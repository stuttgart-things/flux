# SOPS-encrypted files must never be modified by hooks — any whitespace or
# EOF rewrite invalidates the MAC and the file can no longer be decrypted.
exclude: '\.enc\.ya?ml$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      #- id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0  # or specific git tag
    hooks:
      - id: shellcheck
        args:
          - "-e"
          - "SC1090"
          - "-e"
          - "SC1091"
  - repo: https://github.com/hadolint/hadolint
    rev: "v2.12.0"
    hooks:
      - id: hadolint-docker
        args:
          - --ignore
          - DL4006
          - --ignore
          - DL3015
          # DL3018 (pin versions in apk add): alpine's package index only serves
          # the current revision, so a pinned apk version stops resolving within
          # weeks and breaks the build. The versions that matter for
          # reproducibility -- sops, age, kustomize, helm -- are pinned via ARGs
          # and carried in the image tag instead.
          - --ignore
          - DL3018
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detects high entropy strings that are likely to be passwords.
        entry: detect-secrets-hook
        language: python
        # for backward compatibility
        files: .*  # all files
        # Without a baseline every run re-reports the same known false positives
        # and the hook can never be green, which trains us to skip it. The
        # baseline records the audited ones (Secret *names*, env var names, doc
        # placeholders, an age public key) so only genuinely new findings fail.
        # Re-audit and refresh with:
        #   detect-secrets scan --baseline .secrets.baseline
        args:
          - --baseline
          - .secrets.baseline
