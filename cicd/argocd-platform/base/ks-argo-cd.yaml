---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${BUNDLE_NAME:-argocd-platform}-argo-cd
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-apps-upstream}
  path: ./cicd/argo-cd
  prune: true
  wait: true
  postBuild:
    substitute:
      # Equal to cicd/platform/components/argo-cd's default on purpose. Both
      # paths install the same HelmRelease from ./cicd/argo-cd, and two
      # defaults for one chart is how a cluster gets a version nobody chose.
      # (The base in ./cicd/argo-cd still says 9.4.15 and is renovate's to
      # move; a consumer that passes neither gets that one.)
      # renovate: datasource=docker depName=ghcr.io/argoproj/argo-helm/argo-cd
      ARGO_CD_VERSION: "${ARGO_CD_VERSION:-10.4.2}"
      ARGO_CD_NAMESPACE: "${ARGO_CD_NAMESPACE:-argocd}"
      # ARGO_CD_INGRESS_ENABLED is intentionally NOT threaded here. A bare
      # boolean cannot survive a nested Kustomization substitute: kustomize
      # build drops the quotes around ${VAR}, envsubst then yields a YAML bool,
      # and Flux rejects it (postBuild.substitute is map[string]string).
      # cicd/argo-cd defaults ingress off via ${ARGO_CD_INGRESS_ENABLED:-false}
      # in its HelmRelease values, where a boolean is valid.
      INGRESS_HOSTNAME: "${INGRESS_HOSTNAME:-argocd}"
      # passthrough-override: the app default is a sentinel that forces a consumer
      # to choose; a bundle aimed at the lab may choose for it.
      INGRESS_DOMAIN: "${INGRESS_DOMAIN:-platform.sthings-vsphere.labul.sva.de}"
      INGRESS_SECRET_NAME: "${INGRESS_SECRET_NAME:-argocd-server-tls}" # pragma: allowlist secret
      ISSUER_NAME: "${ISSUER_NAME:-vault-pki}"
      ISSUER_KIND: "${ISSUER_KIND:-ClusterIssuer}"
      # passthrough-override: this is a rotate-now stamp. Bundles rotate on their
      # own schedule, so the values are meant to differ.
      ARGO_CD_PASSWORD_MTIME: "${ARGO_CD_PASSWORD_MTIME:-2026-03-23T02:00:00UTC}" # pragma: allowlist secret
      AVP_TRUST_BUNDLE_CONFIGMAP: "${AVP_TRUST_BUNDLE_CONFIGMAP:-cluster-trust-bundle}"
      AVP_TRUST_BUNDLE_KEY: "${AVP_TRUST_BUNDLE_KEY:-trust-bundle.pem}"
      AVP_SSL_CERT_DIR: "${AVP_SSL_CERT_DIR:-/etc/ssl/custom}"
    substituteFrom:
      - kind: Secret
        name: ${ARGO_CD_SECRETS_NAME:-argocd-secrets}
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: argocd-deployment
      namespace: ${ARGO_CD_NAMESPACE:-argocd}
