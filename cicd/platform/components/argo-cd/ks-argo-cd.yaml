---
# ArgoCD → ./cicd/argo-cd
#
# Moved here from apps/platform in the same change that created this bundle.
# It always pointed at ./cicd/argo-cd -- only the wrapper sat in the app layer,
# and ArgoCD is not an app a platform happens to run, it is the delivery tool.
# No cluster had selected it, so the move cost nothing.
#
# dependsOn cilium-gateway: the httproute component below renders an HTTPRoute
# against that Gateway. That dependency crosses bundles -- the Gateway comes
# from infra-platform -- and Flux does not care which Kustomization provides a
# name, only that it exists and is ready.
#
# REQUIRES a Secret (default argocd-secrets, in flux-system) with
# ARGO_CD_SERVER_ADMIN_PASSWORD as a BCRYPT HASH -- not a plaintext password,
# and starting $2a$ not $2y$: ArgoCD's Go bcrypt rejects the $2y$ prefix that
# htpasswd emits by default. Plus VAULT_* for the argocd-vault-plugin sidecar.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-cd
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: cilium-gateway
  interval: 1h
  retryInterval: 1m
  # 15m: this installs ArgoCD plus six CMP sidecars and `wait: true` holds for
  # all of them.
  timeout: 15m
  force: false
  prune: true
  suspend: ${ARGO_CD_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./cicd/argo-cd
  components:
    # The base creates an argocd-ingress Certificate unconditionally; a Gateway
    # consumer neither wants it nor has anything that mounts the Secret.
    - ./components/no-ingress-cert
    - ./components/httproute
  postBuild:
    substitute:
      # renovate: datasource=docker depName=ghcr.io/argoproj/argo-helm/argo-cd
      ARGO_CD_VERSION: "${ARGO_CD_VERSION:-10.5.0}"
      ARGO_CD_NAMESPACE: "${ARGO_CD_NAMESPACE:-argocd}"
      ARGO_CD_INGRESS_ENABLED: "false"
      # passthrough-override: this is a rotate-now stamp. Bundles rotate on their
      # own schedule, so the values are meant to differ.
      ARGO_CD_PASSWORD_MTIME: "${ARGO_CD_PASSWORD_MTIME:-2026-01-01T00:00:00UTC}"

      # The AVP sidecar reaches Vault over TLS signed by an internal CA.
      AVP_TRUST_BUNDLE_CONFIGMAP: "${AVP_TRUST_BUNDLE_CONFIGMAP:-cluster-trust-bundle}"
      AVP_TRUST_BUNDLE_KEY: "${AVP_TRUST_BUNDLE_KEY:-trust-bundle.pem}"
      AVP_SSL_CERT_DIR: "${AVP_SSL_CERT_DIR:-/etc/ssl/custom}"

      ARGO_CD_HOSTNAME: "${ARGO_CD_HOSTNAME:-argocd}"
      ARGO_CD_DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
    # optional: false on purpose -- without it Flux would proceed with an empty
    # admin hash and an ArgoCD nobody can log into, reporting success.
    substituteFrom:
      # substituteFrom-keys: ARGO_CD_SERVER_ADMIN_PASSWORD, VAULT_ADDR, VAULT_NAMESPACE, VAULT_ROLE_ID, VAULT_SECRET_ID
      # optional: false guards the SOURCE, not the KEYS. Flux fails this
      # Kustomization when the Secret is absent -- and substitutes an empty
      # string for any key the Secret does not carry, with no error at all. A
      # Secret that exists but is missing one of the names below produces
      # exactly the outcome the paragraph above warns about. See #331.
      - kind: Secret
        name: ${ARGO_CD_SECRET:-argocd-secrets}
        optional: false
