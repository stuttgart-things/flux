---
# machinery-argocd -> ./cicd/machinery, waiting on argo-cd
#
# The ../machinery component dependsOn crossplane-configs, because there
# machinery is a dashboard over Crossplane claims and nothing else -- without
# the stuttgart-things Configurations it serves an empty table. An Argo CD
# platform cluster (sthings-platform, platform-sthings) has no Crossplane and
# should not get one just to satisfy that edge: what machinery reads there is
# the `Application` kind of the shared watch set, for the Argo checkpoint of
# cluster-build-watch (stuttgart-things/dapr-workflows#49).
#
# So this is the same pair of child Kustomizations under the SAME NAMES --
# `machinery` and `machinery-httproute` -- with the dependency swapped for
# argo-cd. Same names on purpose: machinery-grpcroute (dependsOn machinery)
# works unchanged, and selecting both variants is one object defined twice,
# which kustomize rejects at build time.
#
# The Crossplane kinds of the watch set are simply not served on such a
# cluster; machinery logs that once and re-probes them every 30 s.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: machinery
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: argo-cd
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${MACHINERY_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./cicd/machinery
  postBuild:
    substitute:
      MACHINERY_NAMESPACE: "${MACHINERY_NAMESPACE:-machinery}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/machinery-kustomize
      MACHINERY_VERSION: "${MACHINERY_VERSION:-v1.17.0}"

      # ---- behind sthings-portal (stuttgart-things/flux#945) ---------------
      # The dashboard's URL prefix, e.g. /machinery for a portal entry
      # `machinery|Machinery=http://machinery.<ns>.svc.cluster.local:8080` --
      # the portal forwards /<key>/... unchanged, so this must equal its key.
      # `/` (the default) is no prefix, and cicd/machinery/release.yaml then
      # adds no env entry at all: the Deployment stays byte for byte as
      # before. Not empty: an empty default arrives in the child's substitute
      # map as null, which the apply rejects. Set, the dashboard moves under
      # the prefix on the own hostname too; /health and GET /api/v1/resources
      # stay at the root. machinery v1.16.0+.
      MACHINERY_BASE_PATH: "${MACHINERY_BASE_PATH:-/}"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: machinery-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: machinery
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${MACHINERY_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./cicd/machinery/httproute
  components:
    # What machinery's own hostname serves: `all` (default: dashboard, JSON
    # API, /health, as before) or `api` (/api/... and /health only -- the
    # dashboard then only through sthings-portal's login, with
    # MACHINERY_BASE_PATH set). The API stays public either way: Backstage
    # reads /api/v1/resources from other clusters. A component and not a
    # substitute: the route's rules are a list.
    - ./components/route-${MACHINERY_ROUTE:-all}
  postBuild:
    substitute:
      MACHINERY_NAMESPACE: "${MACHINERY_NAMESPACE:-machinery}"
      MACHINERY_HOSTNAME: "${MACHINERY_HOSTNAME:-machinery}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}"
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
