---
# THE FLEET-MANAGER HALF of the selected crossplane profile ->
# ./cicd/crossplane/profiles/${CROSSPLANE_PROFILE}/platform
#
# AN ADD-ON TO ../crossplane, never selected on its own: it dependsOn
# `crossplane-configs`, which only that component creates, and Flux has no
# optional dependency -- alone this waits forever and reads like slowness rather
# than a mistake. hack/check-cluster-components.py in stuttgart-things fails the
# selection at PR time and names what to add.
#
# ONLY THE `machinery` PROFILE HAS ONE. `cicd-platform` ships no platform/
# directory, so selecting this component on the default profile fails LOUDLY --
# the Kustomization reports that its path does not exist in the source, which is
# exactly what should happen: the fleet-manager packages are
# crossplane-configurations/*, and installing them next to the crossplane/*
# family would put two Configurations of the same name from different sources on
# one cluster. That is a duplicate lock node, and a duplicate node takes EVERY
# package to Healthy=False while Installed stays True and the pods keep running.
#
# Corresponds to `platform_enabled` (default true) in the ansible
# `kind_machinery` play. Kustomize has no conditional, so the toggle is the
# component: take ../crossplane alone for a pure VM builder, or both for a
# cluster that also composes Platforms and builds whole clusters.
#
# WHAT IT ADDS on the machinery profile: the `cluster` Configuration (VM ->
# base-OS -> distribution -> kubeconfig upload -> ClusterAccess -> Platform, all
# from one namespaced ClusterStack XR), provider-clusterbook, the flux-init and
# flux-apps EnvironmentConfigs those Compositions load, and the cluster-scoped
# RBAC the packages document as a precondition and cannot ship themselves.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-platform-configs
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: crossplane-configs
  interval: 1h
  retryInterval: 1m
  # 20m: `cluster` pulls platform, which pulls cni, flux-init, flux-apps,
  # ip-reservation, vault-auth, vault-pki-secrets and management-plane. That is a
  # lot of registry traffic behind one Healthy condition.
  timeout: 20m
  force: false
  prune: true
  suspend: ${CROSSPLANE_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./cicd/crossplane/profiles/${CROSSPLANE_PROFILE:-cicd-platform}/platform
  postBuild:
    substitute:
      # Read by rbac.yaml: the ClusterRoleBindings name
      # system:serviceaccounts:<ns> -- the GROUP, not the provider's
      # ServiceAccount, whose name carries a package-revision hash that changes
      # on every provider upgrade and would silently stop granting anything.
      CROSSPLANE_NAMESPACE: "${CROSSPLANE_NAMESPACE:-crossplane-system}"
      # SECOND COPIES of the defaults in the profile's platform/ directory, and
      # they win. Bump both in the same PR.
      #
      # NEVER LOWER THE `cluster` PIN. `kubectl apply` walks a Configuration
      # BACKWARDS without complaint, so a pin trailing the fleet is not a no-op
      # on an existing cluster -- it is a silent downgrade of the package that
      # builds whole clusters. Check the fleet first.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/crossplane-configurations/cluster
      CROSSPLANE_MACHINERY_CLUSTER_VERSION: "${CROSSPLANE_MACHINERY_CLUSTER_VERSION:-v0.6.1}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/provider-clusterbook-xpkg
      CROSSPLANE_MACHINERY_PROVIDER_CLUSTERBOOK_VERSION: "${CROSSPLANE_MACHINERY_PROVIDER_CLUSTERBOOK_VERSION:-v0.4.2}"
      # Read by flux-defaults, which FluxInit's load-environment step consumes.
      # This is the operator a machinery cluster installs onto the clusters it
      # BUILDS -- not the one running this bundle.
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      CROSSPLANE_MACHINERY_FLUX_OPERATOR_VERSION: "${CROSSPLANE_MACHINERY_FLUX_OPERATOR_VERSION:-0.55.0}"
---
# The helm `in-cluster` ClusterProviderConfig.
#
# ITS OWN KUSTOMIZATION, one behind the packages, and that ordering is the whole
# reason provider-helm's config is not in ../crossplane's provider-configs:
# provider-helm reaches a machinery cluster ONLY through `cluster` -> `platform`
# -> dependsOn, i.e. through the Kustomization directly above this one. In the
# same pass as the package that installs it, the CR dry-runs against a kind the
# API server does not have and Flux aborts the entire apply -- which would take
# the `cluster` Configuration with it, so the provider would never arrive and
# every retry would fail identically.
#
# Behind it, it is only a wait: this fails, retries every minute, and goes green
# once provider-helm's controller has registered helm.m.crossplane.io.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-platform-provider-configs
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: crossplane-platform-configs
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${CROSSPLANE_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./cicd/crossplane/profiles/${CROSSPLANE_PROFILE:-cicd-platform}/platform-provider-configs
  # No substitute block: the helm ClusterProviderConfig reads no variable.
  # CROSSPLANE_NAMESPACE is threaded only where the opentofu one is rendered,
  # which is the only config that uses it.
