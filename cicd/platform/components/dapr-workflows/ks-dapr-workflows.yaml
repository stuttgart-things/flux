---
# Dapr workflows → ./apps/dapr/root + template-execution + its own Redis.
#
# TWO Kustomizations, and they cannot be one. dapr-workflows substitutes FROM a
# Secret, which postBuild reads while BUILDING -- so a Secret created by the
# same apply does not exist yet and never will: Flux applies nothing at all and
# retries forever on "secret not found". The Secret gets its own Kustomization,
# ordered ahead of the one that consumes it.
#
# THIS NEEDS EXTERNAL-SECRETS. Both Secrets come out of the cluster's Vault
# through its ClusterSecretStore; select external-secrets and
# external-secrets-vault-store in the infra layer, and put the three fields in
# the KV mount that store reads:
#
#   <mount>/dapr-workflows  github_token, backstage_token, redis_password
#
# The Redis is deployed here now. The old comment claimed Flux substitution
# would eat the bare $HOSTNAME and $REDISPORT in the chart's start scripts --
# it does not: Flux only substitutes ${VAR} forms, never a bare $VAR. Checked
# with `flux envsubst` over the built manifest, before and after: byte for byte
# identical, and both scripts pass `bash -n`. The braced references in those
# scripts were already escaped as $${...} by whoever wrote them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dapr-workflows-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  # Crosses bundles on purpose: the store lives in infra-platform, and an
  # ExternalSecret applied before its store exists sits in SecretSyncedError
  # while looking, from the Kustomization, entirely healthy.
  dependsOn:
    - name: external-secrets-vault-store
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${DAPR_WORKFLOWS_SUSPEND:-false}
  # wait for the ExternalSecret to actually SYNC, not just to be applied.
  # Applied-but-unsynced is the state that makes the next Kustomization fail on
  # a missing Secret, which is the failure this split exists to prevent.
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/dapr/workflow-secrets
  postBuild:
    substitute:
      DAPR_WORKFLOWS_SECRET: "${DAPR_WORKFLOWS_SECRET:-dapr-workflows-secrets}"
      # passthrough-override: both are loud placeholders and neither is a version;
      # the difference is only which VARIABLE a cluster is told to set. The bundle
      # name wins on purpose, so the message names DAPR_WORKFLOWS_ESO_STORE -- the
      # key that actually appears in a cluster's substitute block.
      DAPR_ESO_STORE_NAME: "${DAPR_WORKFLOWS_ESO_STORE:-set-DAPR_WORKFLOWS_ESO_STORE}"
      DAPR_ESO_STORE_KIND: "${DAPR_WORKFLOWS_ESO_STORE_KIND:-ClusterSecretStore}"
      DAPR_ESO_SECRET_PATH: "${DAPR_WORKFLOWS_ESO_SECRET_PATH:-dapr-workflows}"
      DAPR_ESO_REFRESH_INTERVAL: "${DAPR_WORKFLOWS_ESO_REFRESH_INTERVAL:-1h}"
      DAPR_ESO_GITHUB_TOKEN_PROPERTY: "${DAPR_WORKFLOWS_ESO_GITHUB_TOKEN_PROPERTY:-github_token}"
      DAPR_ESO_BACKSTAGE_TOKEN_PROPERTY: "${DAPR_WORKFLOWS_ESO_BACKSTAGE_TOKEN_PROPERTY:-backstage_token}"
      DAPR_ESO_REDIS_PASSWORD_PROPERTY: "${DAPR_WORKFLOWS_ESO_REDIS_PASSWORD_PROPERTY:-redis_password}"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dapr-workflows
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: cicd
    kustomization.stuttgart-things.com/bundle: cicd-platform
spec:
  dependsOn:
    - name: dapr
    - name: dapr-workflows-secrets
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${DAPR_WORKFLOWS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/dapr/root
  components:
    - ../components/template-execution
    - ../components/redis-stack
    # In the SAME Kustomization as redis-stack, which owns the namespace it
    # writes into. Split out, the ExternalSecret would land in a namespace that
    # does not exist yet.
    - ../components/redis-auth
    # Third and last thing nothing else creates. Without it the workflow pod
    # never leaves ContainerCreating -- see the component for why that is a
    # hard failure and not a downgrade.
    - ../components/backstage-ca
  postBuild:
    substitute:
      DAPR_BACKSTAGE_TPL_NAMESPACE: "${DAPR_WORKFLOWS_NAMESPACE:-backstage-workflows}"
      DAPR_BACKSTAGE_TPL_VERSION: "${DAPR_WORKFLOWS_VERSION:-49b147e70413}"
      DAPR_BACKSTAGE_TPL_IMAGE_TAG: "${DAPR_WORKFLOWS_IMAGE_TAG:-49b147e70413}"
      # passthrough-override: the Redis this Kustomization now deploys, not another
      # cluster's. The base default names homerun2-flux, which anywhere else
      # resolves to nothing and fails at the first workflow rather than at deploy
      # time.
      DAPR_BACKSTAGE_TPL_REDIS_HOST: "${DAPR_WORKFLOWS_REDIS_HOST:-redis-stack.dapr-redis:6379}"

      DAPR_REDIS_NAMESPACE: "${DAPR_WORKFLOWS_REDIS_NAMESPACE:-dapr-redis}"
      # The chart version, carried here as well as in the base so renovate moves
      # BOTH in one PR. Without this annotation it saw only the base, bumped that
      # to 22.0.7 in #337, and nothing landed anywhere -- this copy wins, so
      # cicd-test3 was still on 17.1.4 five releases later with every check green.
      # Taking 22.0.7 is a real upgrade of a running Redis and belongs in a PR that
      # says so.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/redis/redis
      DAPR_REDIS_VERSION: "${DAPR_WORKFLOWS_REDIS_CHART_VERSION:-22.0.7}"
      # passthrough-override: the base names `standard`, which no cluster in this
      # fleet has; these all run openebs-hostpath. A missing StorageClass leaves
      # the PVC Pending while the HelmRelease reports installed.
      DAPR_REDIS_STORAGE_CLASS: "${DAPR_WORKFLOWS_REDIS_STORAGE_CLASS:-openebs-hostpath}"
      DAPR_REDIS_STORAGE_SIZE: "${DAPR_WORKFLOWS_REDIS_STORAGE_SIZE:-8Gi}"
      DAPR_REDIS_AUTH_SECRET: "${DAPR_WORKFLOWS_REDIS_AUTH_SECRET:-redis-auth}"
      DAPR_REDIS_AUTH_KEY: "${DAPR_WORKFLOWS_REDIS_AUTH_KEY:-password}"

      # Same store and same field as the Secret above -- one Vault entry holds
      # the redis password, so the chart's copy and the Dapr component's copy
      # cannot drift apart.
      DAPR_ESO_STORE_NAME: "${DAPR_WORKFLOWS_ESO_STORE:-set-DAPR_WORKFLOWS_ESO_STORE}"
      DAPR_ESO_STORE_KIND: "${DAPR_WORKFLOWS_ESO_STORE_KIND:-ClusterSecretStore}"
      DAPR_ESO_SECRET_PATH: "${DAPR_WORKFLOWS_ESO_SECRET_PATH:-dapr-workflows}"
      DAPR_ESO_REFRESH_INTERVAL: "${DAPR_WORKFLOWS_ESO_REFRESH_INTERVAL:-1h}"
      DAPR_ESO_REDIS_PASSWORD_PROPERTY: "${DAPR_WORKFLOWS_ESO_REDIS_PASSWORD_PROPERTY:-redis_password}"
      DAPR_ESO_BACKSTAGE_CA_PROPERTY: "${DAPR_WORKFLOWS_ESO_BACKSTAGE_CA_PROPERTY:-backstage_ca}"
    substituteFrom:
      # substituteFrom-keys: GITHUB_TOKEN, BACKSTAGE_AUTH_TOKEN, REDIS_PASSWORD
      # Its values are rendered straight into Secrets, so an empty one is a
      # GitHub token that is present, empty, and silently unauthorized.
      #
      # optional: false guards the SOURCE, not the KEYS. Flux fails this
      # Kustomization when the Secret is absent -- and substitutes an empty
      # string for any key the Secret does not carry, with no error at all. A
      # Secret that exists but is missing one of the names below produces
      # exactly the outcome the paragraph above warns about. See #331.
      - kind: Secret
        name: ${DAPR_WORKFLOWS_SECRET:-dapr-workflows-secrets}
        optional: false
