---
# machinery's gRPC bearer-token auth, switched ON, token from a
# ClusterSecretStore -- selected by the cicd component machinery-auth (an
# alternative of `machinery`), never by hand. ../auth-sops is the same with
# the token from a SOPS substituteFrom Secret (machinery-auth-sops).
#
# What it adds to ./cicd/machinery:
#   * the ExternalSecret machinery-auth-token (external-secret.yaml);
#   * through ../auth-mount, a patch on the nested Kustomization that mounts
#     that Secret into the machinery container at
#     /var/run/machinery-auth/token.
# The third piece is not here: the `"auth": {...}` member of config.json comes
# in through MACHINERY_AUTH_CONFIG, which only the auth variants set
# (kustomize cannot patch inside the JSON string; see ../watch-config.yaml).
#
# WHAT AUTH COVERS (machinery v1.14.0, auth.go): every ResourceService RPC on
# :50051, through the GRPCRoute AND in-cluster -- an in-cluster plaintext
# client needs the token too. /grpc.health.v1.Health/* stays anonymous, and
# the HTMX dashboard calls the server in-process, so it is not affected.
#
# A missing Secret holds the new pod in ContainerCreating (see ../auth-mount),
# and the ExternalSecret's Ready condition fails the machinery Kustomization.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - external-secret.yaml
components:
  - ../auth-mount
