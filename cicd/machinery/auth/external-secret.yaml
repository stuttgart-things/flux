---
# The bearer token machinery's gRPC server accepts, out of the cluster's Vault:
#
#   <mount>/machinery-grpc   token
#
# ONE value shared with every client that calls this server from elsewhere --
# today cluster-build-watch on cicd-machinery-test5, which reads the SAME entry
# and property through apps/dapr/components/cluster-build-watch-machinery-auth-on.
# stuttgart-things' hack/cluster-secret-policy.yaml copies it into both
# clusters' mounts from apps/cicd-defaults:machinery_grpc_token in the LabDA
# Vault, so server and client cannot disagree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: machinery-auth-token
  namespace: ${MACHINERY_NAMESPACE:-machinery}
spec:
  refreshInterval: ${MACHINERY_AUTH_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${MACHINERY_AUTH_ESO_STORE:-set-MACHINERY_AUTH_ESO_STORE}
    kind: ${MACHINERY_AUTH_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: machinery-auth-token
    creationPolicy: Owner
  data:
    # `token` exactly: the volume in kustomization.yaml selects that key.
    - secretKey: token  # pragma: allowlist secret
      remoteRef:
        key: ${MACHINERY_AUTH_TOKEN_PATH:-machinery-grpc}
        property: ${MACHINERY_AUTH_TOKEN_PROPERTY:-token}
