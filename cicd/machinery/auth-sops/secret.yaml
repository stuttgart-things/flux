---
# The bearer token machinery's gRPC server accepts, from the consumer's
# substituteFrom Secret (MACHINERY_AUTH_TOKEN). Every client of this server
# must send the SAME value -- see ../README.md, "gRPC auth".
#
# The value must read as a STRING in YAML: Flux substitutes into kustomize's
# output, where quotes are already gone, so a token like `123e45` turns into
# a number. `openssl rand -hex 32` is fine (a 64-character hex string of
# digits and at most one `e` is vanishingly unlikely).
apiVersion: v1
kind: Secret
metadata:
  name: machinery-auth-token
  namespace: ${MACHINERY_NAMESPACE:-machinery}
type: Opaque
stringData:
  # `token` exactly: ../auth-mount's volume selects that key.
  token: ${MACHINERY_AUTH_TOKEN}  # pragma: allowlist secret
