---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: machinery
  namespace: ${MACHINERY_NAMESPACE:-machinery}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: machinery-kustomize
  prune: true
  wait: true
  targetNamespace: ${MACHINERY_NAMESPACE:-machinery}
  patches:
    # Override the container image tag
    - target:
        kind: Deployment
        name: machinery
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: machinery
        spec:
          template:
            spec:
              containers:
                - name: machinery
                  image: ghcr.io/stuttgart-things/machinery:${MACHINERY_VERSION:-v1.17.0}
    # machinery reads config.json (machinery-watch-config) and the auth token
    # ONCE, at start; a changed ConfigMap is otherwise only picked up by the
    # next pod. Reloader rolls the Deployment on a change, where it runs
    # (infra component reloader); elsewhere the annotation does nothing.
    - target:
        kind: Deployment
        name: machinery
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: machinery
          annotations:
            reloader.stakater.com/auto: "true"
    # Mount MACHINERY_CONFIG from ConfigMap as a file
    - target:
        kind: Deployment
        name: machinery
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: machinery
        spec:
          template:
            spec:
              containers:
                - name: machinery
                  env:
                    - name: MACHINERY_CONFIG
                      value: /etc/machinery/config.json
                  volumeMounts:
                    - name: machinery-config
                      mountPath: /etc/machinery
                      readOnly: true
              volumes:
                - name: machinery-config
                  configMap:
                    # NOT `machinery-config` — that ConfigMap belongs to the
                    # Kustomize base and is consumed via envFrom. See
                    # watch-config.yaml.
                    name: machinery-watch-config
                    optional: true
    # BASE_PATH behind sthings-portal (stuttgart-things/flux#945): the
    # dashboard's URL prefix, e.g. /machinery (= the portal key; the portal
    # forwards /<key>/... unchanged). machinery v1.16.0+; /health and
    # GET /api/v1/resources stay at the root under any prefix (Backstage's
    # claim picker, the portal's health poll).
    #
    # An env entry, not a key in the envFrom ConfigMap: a change here rolls
    # the pod. ALWAYS PRESENT: `/` (the default) is no prefix -- machinery
    # trims the trailing slash and reads "" as the root -- so a cluster without
    # MACHINERY_BASE_PATH behaves as before, but its Deployment gained this
    # entry and rolled once when it came in. The value must start with `/`;
    # machinery refuses to start otherwise.
    - target:
        kind: Deployment
        name: machinery
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: machinery
        spec:
          template:
            spec:
              containers:
                - name: machinery
                  env:
                    - name: BASE_PATH
                      value: "${MACHINERY_BASE_PATH:-/}"
    # Add HTTP port to deployment
    - target:
        kind: Deployment
        name: machinery
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: machinery
        spec:
          template:
            spec:
              containers:
                - name: machinery
                  ports:
                    - name: grpc
                      containerPort: 50051
                      protocol: TCP
                    - name: http
                      containerPort: 8080
                      protocol: TCP
    # Add HTTP port to service
    - target:
        kind: Service
        name: machinery
      patch: |
        apiVersion: v1
        kind: Service
        metadata:
          name: machinery
        spec:
          ports:
            - name: grpc
              port: 50051
              targetPort: grpc
              protocol: TCP
            - name: http
              port: 8080
              targetPort: http
              protocol: TCP
    # Remove the KCL-generated HTTPRoute (we provide our own via flux)
    - target:
        kind: HTTPRoute
        name: machinery
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: machinery
        $patch: delete
