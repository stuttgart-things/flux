---
# The mount half of machinery's gRPC bearer-token auth, shared by both token
# sources -- ../auth (ExternalSecret) and ../auth-sops (a Secret substituted
# from the consumer's substituteFrom Secret). Never selected on its own: it is
# a component of those two, so the volume cannot drift between them.
#
# A patch on the nested Kustomization that mounts the Secret
# machinery-auth-token into the machinery container at
# /var/run/machinery-auth/token -- the tokenFile MACHINERY_AUTH_CONFIG names.
#
# The token is read ONCE, at start. A rotated Secret takes effect with the
# next pod; the patch below changes the pod template, so switching auth on
# rolls the Deployment by itself.
#
# The volume is NOT optional, on purpose. machinery with auth.enabled and no
# token exits at start. With a required volume a missing Secret instead holds
# the NEW pod in ContainerCreating, the old one (no auth) keeps serving, and
# the machinery Kustomization fails -- loud, and no outage.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: machinery
    patch: |  # pragma: allowlist secret -- secretName below names a Secret, holds none
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: Deployment
            name: machinery
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: machinery
            spec:
              template:
                spec:
                  containers:
                    - name: machinery
                      volumeMounts:
                        - name: machinery-auth-token
                          mountPath: /var/run/machinery-auth
                          readOnly: true
                  volumes:
                    - name: machinery-auth-token
                      secret:
                        secretName: machinery-auth-token
                        items:
                          - key: token
                            path: token
