---
# The ansible capability: the namespace PipelineRuns execute in, the SSH
# credentials they log into a fresh VM with, and the ansible-run
# EnvironmentConfig every VM Configuration composes against.
#
# IN EVERY SET, and that is not padding. vspherevm and proxmoxvm both compose an
# AnsibleRun to bring a new VM to a usable state, and harvester-vm does too.
# Without this, a VM is created and never configured -- and the failure lands on
# the AnsibleRun, two objects from the XR anyone is watching.
#
# ITS ENVIRONMENT LABEL IS `default`, WHATEVER THE SET IS. ansible-run resolves
# its OWN label, and fleet-wide only `default` exists there. Passing a
# hypervisor environment (labda, labul) matched nothing and silently dropped
# every ansible-run default including ansibleExtraCollections -- the playbook
# then ran against whatever collection happened to be in the working image.
# That is crossplane-configurations#347, which reverted the forwarding in
# vspherevm v0.9.2 and proxmoxvm v0.12.2. The chart's `environment` selects
# which SSH credentials to read, not which label to write.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ansible-run
  namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
spec:
  interval: 30m
  chart:
    spec:
      chart: ansible
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/ansible
      version: ${CROSSPLANE_CAPABILITY_ANSIBLE_CHART_VERSION:-0.9.2}
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things-charts
        namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
      interval: 12h
  values:
    environment: ${CROSSPLANE_CAPABILITY_ENVIRONMENT:-labda}
    namespace: ${CROSSPLANE_CAPABILITY_TEKTON_NAMESPACE:-tekton-ci}
    configuration:
      enabled: false
    environmentConfig:
      storageClass: ${CROSSPLANE_CAPABILITY_STORAGE_CLASS:-openebs-hostpath}
    sshCredentials:
      backend: sops-git
      sopsGit:
        repositoryRef:
          name: ${SOPS_GIT_REPOSITORY_NAME:-sops-secrets}
        ageKeySecret:
          name: ${SOPS_GIT_AGE_SECRET:-sops-age-key}
          key: age.agekey
