---
# MACHINERY-PLATFORM PROFILE -- the fleet-manager half of a machinery cluster.
#
# Mirrors `platform_packages` + `provider_packages` in the ansible
# `kind_machinery` play, which gates both behind `platform_enabled` (default
# true). Kustomize has no such conditional, so the toggle is this directory:
# apply ../machinery alone for a pure VM builder, or both for a cluster that
# also composes Platforms and builds whole clusters.
#
# Same registry family and same dependsOn rule as ../machinery -- read that
# file's header first. flux-apps, remote-cluster, management-plane, cni,
# flux-init, ip-reservation, vault-auth and vault-pki-secrets are all reachable
# through dependsOn from the two packages below and are deliberately absent;
# they show up as package-manager-named CRs and are EXPECTED to look "extra" in
# `kubectl get configuration`.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: platform
spec:
  # Pulls cni, flux-init, flux-apps and -- from v0.3.3 -- ip-reservation,
  # vault-auth and vault-pki-secrets via dependsOn.
  #
  # v0.3.1 is a FLOOR: `cluster` below declares dependsOn platform >=v0.3.1.
  # v0.3.8 raises the vault-pki-secrets floor to >=v0.1.5.
  # v0.4.0 is BREAKING: additionalAuths[].policies no longer takes free-form
  #        HCL; the body is built from kvMount + read.
  # v0.6.0-.2 make vaultIssuer WAIT for cert-manager instead of racing it --
  #        ClusterIssuer, PKI secret and tokenrequest RBAC are held back until
  #        the cert-manager webhook's Endpoints on the target carry an address.
  #
  # Do NOT run v0.3.15 anywhere: it computed two status fields without
  # declaring them in the XRD, and an undeclared status field is not pruned --
  # it fails the whole status apply and with it every compose, while Ready
  # stays True on the last good result. v0.3.16 declares them. v0.6.0 had the
  # same trap, fixed in v0.6.1.
  package: ghcr.io/stuttgart-things/crossplane-configurations/platform:${CROSSPLANE_MACHINERY_PLATFORM_VERSION:-v0.6.2}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: cluster
spec:
  # Builds a WHOLE CLUSTER from one namespaced ClusterStack XR: VM -> base-OS ->
  # distribution -> kubeconfig upload -> ClusterAccess -> Platform. Depends on
  # `platform` above and pulls remote-cluster, which nothing else installs.
  #
  # NEVER LOWER THIS PIN. `kubectl apply` walks a Configuration BACKWARDS
  # without complaint, so a pin trailing the fleet is not a no-op on an existing
  # cluster -- it is a silent downgrade. Check the fleet before touching it.
  #
  # v0.5.0 DERIVES kubeconfig.providerConfigRef from kubeconfig.vaultSecretName
  # instead of defaulting the two separately. They name the same Vault -- one
  # where the kubeconfig is uploaded, the other where it is read back -- and
  # nothing enforced that: the old defaults `vault` / `vault-kubeconfigs` agreed
  # only by accident. Setting vaultSecretName to vault-infra, which the ArgoCD
  # path requires, sent the read to the OTHER Vault and the RemoteCluster failed
  # with `secret not found`, while the ClusterStack stayed Ready=True -- without
  # a ready ClusterAccess the Platform branch is never emitted, so there is
  # nothing left to wait for and no error anywhere (#336, 2026-08-19).
  #
  # NEEDS the platform RBAC manifests the ansible play applies (fetched raw from
  # crossplane-configurations bootstrap/). Without them a build runs all three
  # ansible stages green and then wedges at the access stage.
  package: ghcr.io/stuttgart-things/crossplane-configurations/cluster:${CROSSPLANE_MACHINERY_CLUSTER_VERSION:-v0.6.1}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-clusterbook
spec:
  # The one provider no Configuration carries. ip-reservation classes it (and
  # provider-kubeconfig) as a fleet-cluster PRECONDITION rather than a package
  # dependency, so without it `spec.ipReservation.enabled: true` on a Platform
  # XR has its XRD but no controller to reconcile the IPReservation it composes.
  # Every other provider on a machinery cluster arrives through some
  # Configuration's dependsOn.
  package: ghcr.io/stuttgart-things/provider-clusterbook-xpkg:${CROSSPLANE_MACHINERY_PROVIDER_CLUSTERBOOK_VERSION:-v0.4.2}
