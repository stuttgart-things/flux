---
# The helm ClusterProviderConfig, for the fleet-manager half.
#
# ITS OWN BUILD ROOT, one Kustomization behind ../platform, and that ordering is
# the entire reason it is not in ../provider-configs: provider-helm reaches a
# machinery cluster only through `cluster` -> `platform` -> dependsOn, i.e.
# through the package ../platform installs. In the same pass as that package the
# CR dry-runs against a kind the API server does not have, and Flux aborts the
# WHOLE apply -- which would take the `cluster` Configuration with it, so the
# provider would never arrive and every retry would fail identically.
#
# Behind it, it is only a wait: the Kustomization fails, retries every minute,
# and goes green once provider-helm's controller has registered helm.m.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
components:
  - ../../../components/provider-configs/helm
