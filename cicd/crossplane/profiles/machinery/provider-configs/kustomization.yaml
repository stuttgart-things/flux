---
# ClusterProviderConfigs for the machinery profile -- GENERATED from the KCL
# catalog's `providerConfigs` (hack/gen-crossplane-profile.py).
#
# All three, and this root does NOT compose ../../../components/provider-configs
# the way the cicd-platform profile does. It cannot: the catalog owns the exact
# spec of each one, including the opentofu backend HCL, and rendering it from a
# second place is the drift this whole generator exists to remove.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - provider-configs.yaml
