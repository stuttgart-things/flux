---
# ClusterProviderConfigs for the machinery profile.
#
# kubernetes + opentofu ONLY. NOT helm: of the packages ../configs installs, not
# one declares provider-helm -- it reaches a machinery cluster solely through
# the fleet-manager half (cni, flux-init, platform and management-plane all
# declare it), which brings its own at ../platform-provider-configs. Shipping it
# here would leave a Kustomization on a pure VM builder retrying forever against
# a kind that never registers, which reads like a slow reconcile rather than a
# mistake.
#
# opentofu is the one provider ../install installs explicitly; provider-kubernetes
# arrives through every Configuration's dependsOn, which is why the Kustomization
# rendering this depends on the CONFIGS one and not on the install.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
components:
  - ../../../components/provider-configs/kubernetes
  - ../../../components/provider-configs/opentofu
