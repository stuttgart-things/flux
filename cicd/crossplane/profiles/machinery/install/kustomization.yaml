---
# Crossplane core for a MACHINERY cluster.
#
# Reuses ../../../components/install -- same chart, same HelmRepositories, same
# namespace -- and replaces exactly the two things the KCL catalog owns for this
# profile: the chart version, and the chart's provider list.
#
# THE PROVIDER LIST IS EMPTIED, not narrowed. Under the catalog every Provider is
# a package CR in ../configs/configs.yaml, carrying the LONG name Crossplane
# derives from the package path. Letting the chart install any of them as well
# would put one source under two CRs -- the duplicate lock node that takes every
# package on the cluster to Healthy=False while Installed stays True and the pods
# keep running.
#
# That also settles the registry question this file used to spend forty lines on.
# crossplane-configurations declares provider-kubernetes and provider-helm against
# xpkg.crossplane.io while the shared list spells them xpkg.upbound.io, and two
# spellings of one package are two lock nodes. The old answer here was "install
# none of them and let dependsOn do it". The catalog's answer is better and is
# what the fleet runs: install them EXPLICITLY at the spelling the packages
# declare. Two nodes with DIFFERENT sources are healthy -- seed-labda-1 carries
# function-kcl twice, short-named on upbound and long-named on crossplane.io,
# both Healthy. Only two nodes with the SAME source freeze the resolver.
#
# provider-kubernetes is absent from the catalog on purpose: every Configuration
# pulls it, and with derived names the pulled CR is the one an explicit entry
# would have created.
#
# The version does NOT read ${CROSSPLANE_VERSION}. That variable is the
# bundle-wide one the cicd-platform profile uses; here the fleet pins the core
# per profile, and catalog-patch.yaml carries it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../components/install
patches:
  - target:
      kind: HelmRelease
      name: crossplane-deployment
    path: catalog-patch.yaml
