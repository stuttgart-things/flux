---
# A build root of its own, NOT a Component: nothing else composes this profile,
# and a Flux Kustomization's spec.path points here directly.
#
# PACKAGES ONLY. No EnvironmentConfig lives here, and that is a rule rather than
# an omission -- see the header of configs.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configs.yaml
