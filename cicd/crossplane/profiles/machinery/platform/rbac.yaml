---
# CLUSTER-SCOPED RBAC THE PLATFORM CONFIGURATIONS DOCUMENT AS A PRECONDITION
# AND CANNOT SHIP: a package installs CRDs and Compositions, never
# ClusterRoleBindings. Mirrors `platform_rbac_manifests` in the ansible
# `kind_machinery` play, which fetches these raw from crossplane-configurations
# bootstrap/*/examples/rbac.yaml.
#
# Gated with the rest of the fleet-manager half rather than shipped beside
# ../machinery: a pure VM builder installs no Configuration that composes a
# RemoteCluster and needs none of it.
#
# WITHOUT THIS, A BUILD RUNS ALL THREE ANSIBLE STAGES GREEN AND THEN WEDGES at
# the access stage. Both rules below were found that way, on live builds.
#
# Not needed where the provider's SA is already cluster-admin, which is the
# case on the fleet clusters -- applying it there is a harmless no-op.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-remote-cluster
rules:
  # (1) CREATE RemoteClusters. Easy to miss because it was never needed before:
  # RemoteClusters had always been applied by hand, so the provider only ever
  # had to READ ones that already existed. The moment a Composition creates one:
  #
  #   create failed: cannot create object:
  #   remoteclusters.kubeconfig.stuttgart-things.com "<name>" is forbidden
  #
  # Hit on kind1 (2026-07-27) and again on u26-kind3 (2026-08-12).
  - apiGroups: ["kubeconfig.stuttgart-things.com"]
    resources: ["remoteclusters", "remoteclusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # (2) PATCH on helm ClusterProviderConfigs -- REQUIRED EVEN THOUGH THE OBJECT
  # THAT NEEDS IT IS OBSERVE-ONLY. provider-kubernetes computes desired state
  # with a DRY-RUN server-side apply, and the API server authorizes that
  # exactly like a real write.
  #
  # THE SYMPTOM IS DECEPTIVE: status.ready goes TRUE and status.share fills in
  # with the endpoint and serverVersion (those come from the RemoteCluster,
  # which is fine); only Crossplane's own Ready condition stays False on
  # "Unready resources: observe-helm". A ClusterStack looks finished and is not.
  #
  # Only `helm` needs listing -- provider-kubernetes OWNS kubernetes.m and its
  # generated ClusterRole already covers it; helm.m belongs to provider-helm.
  - apiGroups: ["helm.m.crossplane.io"]
    resources: ["clusterproviderconfigs", "clusterproviderconfigs/status"]
    verbs: ["get", "list", "watch", "patch"]
---
# BIND THE GROUP, NOT THE ServiceAccount.
#
# The obvious binding names the SA -- and on a real cluster that is
# `crossplane-contrib-provider-kubernetes-f6665ef36536`, where the suffix is
# derived from the installed package REVISION. It changes on every provider
# upgrade, so a name-bound ClusterRoleBinding silently stops granting anything
# and the next build fails with the errors above, long after anyone would
# connect it to a provider bump.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-remote-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-remote-cluster
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:${CROSSPLANE_NAMESPACE:-crossplane-system}
---
# RBAC for the ip-reservation child XR a Platform composes when
# spec.ipReservation.enabled is set. It observes RemoteClusters
# (provider-kubeconfig) and manages IPReservations (provider-clusterbook, the
# Provider installed in configs.yaml beside this file).
#
# Note the `patch` on remoteclusters: the Object that reads them is
# Observe-only, and needs it anyway -- same dry-run SSA reason as above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-ip-reservation
rules:
  - apiGroups: ["kubeconfig.stuttgart-things.com"]
    resources: ["remoteclusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["ipreservation.clusterbook.stuttgart-things.com"]
    resources: ["ipreservations"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-ip-reservation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-ip-reservation
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:${CROSSPLANE_NAMESPACE:-crossplane-system}
