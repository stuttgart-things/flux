---
# EnvironmentConfigs for the FLEET-MANAGER half, mirroring
# `platform_environment_config_manifests` in the ansible `kind_machinery` play.
#
# Both are consumed by a Composition's load-environment step, and flux-apps'
# is REQUIRED -- the step references it by name and a missing EnvironmentConfig
# fails the pipeline rather than falling back.
#
# Neither carries a selector label: these two are looked up by NAME, not by the
# config-scoped label the ../machinery ones use.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: flux-defaults
data:
  operatorChart:
    # The quotes here do NOT survive: kustomize re-emits this bundle and drops
    # them whenever the bare form round-trips to the same string, which
    # ${...} does. So what Flux substitutes into is `version: 0.55.0`, and the
    # result is a string only because a two-dot version cannot parse as a
    # number. A single-dot value ("0.55") would arrive as a FLOAT.
    # EnvironmentConfig data is JSON-typed, so the API server accepts it and the
    # Composition gets 0.55 where it expected "0.55" -- keep three components.
    # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: "${CROSSPLANE_MACHINERY_FLUX_OPERATOR_VERSION:-0.55.0}"
    repoURL: "oci://ghcr.io/controlplaneio-fluxcd/charts"
  instance:
    distribution: "2.x"
    components:
      - source-controller
      - kustomize-controller
      - helm-controller
      - notification-controller
  namespace: "flux-system"
  reconcileEvery: "1h"
  reconcileTimeout: "5m"
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: flux-apps-defaults
data:
  namespace: flux-system
  interval: "1h"
  retryInterval: "1m"
  timeout: "10m"
  # THE EFFECTIVE sourceRef DEFAULT LIVES HERE, not in the XRD. A CRD default
  # only materialises if the XR actually sets `sourceRef: {}` -- defaulting
  # does not create an absent object -- so for an XR that omits sourceRef
  # entirely, this is what every app gets.
  sourceRef:
    kind: OCIRepository
    name: flux-apps
