---
# THESE ARE ghcr.io/stuttgart-things/crossplane/*, AND THAT IS NOT THE SAME
# FAMILY AS ghcr.io/stuttgart-things/crossplane-configurations/*.
#
# The org publishes two Configuration families under names that overlap. This
# file installs the first one. The second is what
# stuttgart-things/crossplane/platform/capabilities/* (Helm) and the ansible
# `kind_machinery` play install on the machinery clusters:
#
#   package               crossplane/*   crossplane-configurations/*
#   cloud-config          v0.5.1         v0.5.4
#   volume-claim          v0.1.1         v0.1.0
#   ansible-run           v12.0.0        v0.3.2
#   harvester-vm          v0.3.3         v0.1.9
#   storage-platform      v0.6.0         -- does not exist --
#   pipeline-integration  v0.1.2         -- does not exist --
#
# The version lines do not line up because these are not the same artifacts:
# crossplane-configurations/harvester-vm carries a base layer 2.5x the size of
# ours, and two of ours have no counterpart there at all. Every pin below is
# already the NEWEST tag published on its own path -- there is nothing to bump
# here, and a "newer" number on the other path is not an upgrade.
#
# So do NOT rewrite these paths to crossplane-configurations to "align" with the
# machinery clusters. Crossplane keys its lock on the SOURCE STRING, so the two
# spellings are two different packages to it, and swapping a path is a
# reinstall of a different lineage under the same CR name -- the failure mode
# components/functions/functions.yaml records in full, where exactly that
# reasoning took five Configurations unhealthy at once.
#
# Converging the two families is a change to the PACKAGES' own dependsOn
# declarations first; it cannot be done from this file.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: cloud-config
spec:
  package: ghcr.io/stuttgart-things/crossplane/cloud-config:${CROSSPLANE_CONFIG_CLOUD_CONFIG_VERSION:-v0.5.1}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: volume-claim
spec:
  package: ghcr.io/stuttgart-things/crossplane/volume-claim:${CROSSPLANE_CONFIG_VOLUME_CLAIM_VERSION:-v0.1.1}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: storage-platform
spec:
  package: ghcr.io/stuttgart-things/crossplane/storage-platform:${CROSSPLANE_CONFIG_STORAGE_PLATFORM_VERSION:-v0.6.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: ansible-run
spec:
  package: ghcr.io/stuttgart-things/crossplane/ansible-run:${CROSSPLANE_CONFIG_ANSIBLE_RUN_VERSION:-v12.0.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: pipeline-integration
spec:
  package: ghcr.io/stuttgart-things/crossplane/pipeline-integration:${CROSSPLANE_CONFIG_PIPELINE_INTEGRATION_VERSION:-v0.1.2}
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: harvester-vm
spec:
  package: ghcr.io/stuttgart-things/crossplane/harvester-vm:${CROSSPLANE_CONFIG_HARVESTER_VM_VERSION:-v0.3.3}
  # The ONLY package here that depends on other packages in this same file --
  # volume-claim and cloud-config, plus provider-kubernetes and
  # function-patch-and-transform from the lists beside it. All four are already
  # installed above, so resolving them again gains nothing and costs the
  # cluster its entire Crossplane:
  #
  # Crossplane materialises an unresolved dependency as a Configuration of its
  # own, named after the OCI path -- stuttgart-things-crossplane-volume-claim
  # for the same image our `volume-claim` above installs. Two lock nodes then
  # carry one source, and the resolver gives up on the WHOLE graph:
  #
  #   cannot initialize dependency graph from the packages in the lock:
  #   node ghcr.io/stuttgart-things/crossplane/volume-claim already exists
  #
  # Every Configuration, Function and Provider goes Healthy=False with that
  # message, including the ones that have nothing to do with harvester-vm.
  # Installed stays True and the pods keep running, so nothing crashes and
  # nothing restarts -- Crossplane simply reconciles no claim at all.
  #
  # It is a RACE, which is why it does not always happen: if our explicit
  # volume-claim reaches the lock first, the dependency resolves onto it and no
  # duplicate appears. cicd-test1 came up clean, cicd-test2 did not, from the
  # same manifests.
  #
  # If a dependency of harvester-vm is ever REMOVED from this file, add it back
  # or drop this line -- with it set, nothing will install that dependency.
  skipDependencyResolution: true
