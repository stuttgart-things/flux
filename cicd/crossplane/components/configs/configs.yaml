---
# THESE ARE ghcr.io/stuttgart-things/crossplane/*, AND THAT IS NOT THE SAME
# FAMILY AS ghcr.io/stuttgart-things/crossplane-configurations/*.
#
# The org publishes two Configuration families under names that overlap. This
# file installs the first one. The second is what
# stuttgart-things/crossplane/platform/capabilities/* (Helm) and the ansible
# `kind_machinery` play install on the machinery clusters:
#
#   package               crossplane/*   crossplane-configurations/*
#   cloud-config          v0.5.1         v0.5.4
#   volume-claim          v0.1.1         v0.1.0
#   ansible-run           v12.0.0        v0.3.2
#   harvester-vm          v0.3.3         v0.1.12
#   storage-platform      v0.6.0         -- does not exist --
#   pipeline-integration  v0.1.2         -- does not exist --
#
# The version lines do not line up because these are not the same artifacts:
# crossplane-configurations/harvester-vm carries a base layer 2.5x the size of
# ours, and two of ours have no counterpart there at all. Every pin below is
# already the NEWEST tag published on its own path -- there is nothing to bump
# here, and a "newer" number on the other path is not an upgrade.
#
# So do NOT rewrite these paths to crossplane-configurations to "align" with the
# machinery clusters. Crossplane keys its lock on the SOURCE STRING, so the two
# spellings are two different packages to it, and swapping a path is a
# reinstall of a different lineage under the same CR name -- the failure mode
# components/functions/functions.yaml records in full, where exactly that
# reasoning took five Configurations unhealthy at once.
#
# Converging the two families is a change to the PACKAGES' own dependsOn
# declarations first; it cannot be done from this file.
#
# EVERY CONFIGURATION BELOW SETS skipDependencyResolution, and none may drop it.
# This profile installs every dependency of every package itself: the
# Providers in components/install, the Functions in components/functions, the
# Configurations here. Resolving them again gains nothing and can cost the
# cluster its entire Crossplane.
#
# Crossplane materialises a dependency it cannot match as a package of its own,
# named after the OCI path -- crossplane-contrib-function-kcl for the image our
# short-named `function-kcl` already installs. Two lock nodes then carry one
# source, and the resolver gives up on the WHOLE graph:
#
#   cannot initialize dependency graph from the packages in the lock:
#   node xpkg.upbound.io/crossplane-contrib/function-kcl already exists
#
# Every Configuration, Function and Provider goes Healthy=False with that
# message, including the ones that have nothing to do with the duplicate.
# Installed stays True and the pods keep running, so nothing crashes and
# nothing restarts -- Crossplane simply stops reconciling packages, and
# crossplane-configs sits in its health check until the timeout, forever.
#
# It is a RACE, which is why it does not always happen, and it is not only a
# Configuration -> Configuration one:
#
#   - Configuration -> Configuration: harvester-vm's volume-claim and
#     cloud-config are applied in this same pass. cicd-test1 came up clean,
#     cicd-test2 did not, from the same manifests.
#   - Configuration -> Function: the Functions are in the lock long before any
#     Configuration resolves, so this was believed safe. It is not: while a
#     Function revision is unhealthy -- during a Crossplane upgrade, or while
#     ANOTHER duplicate holds the graph down -- the resolver treats it as
#     missing. sthings-runner, 2026-10-26: crossplane v2.4.2 -> v2.4.3, and
#     nine seconds before the new pod, crossplane-contrib-function-go-templating
#     appeared (pulled by cloud-config/volume-claim/storage-platform). Deleting
#     it on 2026-11-07 let ansible-run resolve next, onto a still-unhealthy
#     function-kcl, and crossplane-contrib-function-kcl appeared within seconds.
#
# The Providers do not collide: components/install lists them in the chart,
# and the chart names them exactly as the resolver would. The Functions cannot
# follow suit -- Compositions reference them by short name in functionRef.
#
# If a dependency is ever REMOVED from the profile, add it back -- with this
# flag set, nothing will install it. hack/check-crossplane-deps.py fails on
# exactly that, and on a Configuration here that resolves on its own.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: cloud-config
spec:
  package: ghcr.io/stuttgart-things/crossplane/cloud-config:${CROSSPLANE_CONFIG_CLOUD_CONFIG_VERSION:-v0.5.1}
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: volume-claim
spec:
  package: ghcr.io/stuttgart-things/crossplane/volume-claim:${CROSSPLANE_CONFIG_VOLUME_CLAIM_VERSION:-v0.1.1}
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: storage-platform
spec:
  package: ghcr.io/stuttgart-things/crossplane/storage-platform:${CROSSPLANE_CONFIG_STORAGE_PLATFORM_VERSION:-v0.6.0}
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: ansible-run
spec:
  package: ghcr.io/stuttgart-things/crossplane/ansible-run:${CROSSPLANE_CONFIG_ANSIBLE_RUN_VERSION:-v12.0.0}
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: pipeline-integration
spec:
  package: ghcr.io/stuttgart-things/crossplane/pipeline-integration:${CROSSPLANE_CONFIG_PIPELINE_INTEGRATION_VERSION:-v0.1.2}
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: harvester-vm
spec:
  package: ghcr.io/stuttgart-things/crossplane/harvester-vm:${CROSSPLANE_CONFIG_HARVESTER_VM_VERSION:-v0.3.3}
  skipDependencyResolution: true
