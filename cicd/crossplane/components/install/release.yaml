---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane-deployment
  namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
spec:
  interval: 30m
  chart:
    spec:
      chart: crossplane
      # renovate: datasource=helm depName=crossplane registryUrl=https://charts.crossplane.io/stable
      version: ${CROSSPLANE_VERSION:-2.4.0}
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
      interval: 12h
  values:
    args:
      - '--debug'
      - '--enable-usages'
    provider:
      packages:
        - xpkg.crossplane.io/crossplane-contrib/provider-helm:${CROSSPLANE_HELM_PROVIDER_VERSION:-v1.4.0}
        - xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:${CROSSPLANE_K8S_PROVIDER_VERSION:-v1.3.1}
        - xpkg.upbound.io/upbound/provider-opentofu:${CROSSPLANE_OPENTOFU_PROVIDER_VERSION:-v1.1.7}
