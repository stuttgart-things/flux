---
# THE REGISTRY PER PACKAGE IS NOT A STYLE CHOICE. Each one here matches the
# registry the installed Configurations DECLARE for it, read from the live
# lock:
#
#   function-auto-ready       xpkg.crossplane.io   <- ansible-run, cloud-config, volume-claim
#   function-go-templating    xpkg.crossplane.io   <- cloud-config, storage-platform, volume-claim
#   function-kcl              xpkg.upbound.io      <- ansible-run
#   patch-and-transform       xpkg.upbound.io      <- harvester-vm
#   provider-helm             xpkg.upbound.io      <- pipeline-integration, storage-platform
#   provider-kubernetes       xpkg.upbound.io      <- ansible-run, cloud-config, storage-platform, volume-claim
#
# Crossplane keys its lock on the SOURCE STRING, not on the image, so the two
# mirrors of one package are two different things to it. Install the other
# spelling and the Configurations report
#
#   cannot resolve package dependencies: missing dependencies:
#   "xpkg.upbound.io/crossplane-contrib/provider-kubernetes" (>=v1.2.0)
#
# while the package they are asking for is right there under its other name.
#
# I moved these to one registry once, on the reasoning that
# crossplane-configurations declares against xpkg.crossplane.io. It does -- but
# crossplane-configurations is not what is installed here, and the family that
# IS installed declares the mix above. Five Configurations went unhealthy at
# once. Converging on one registry is a change to those packages' own
# dependency declarations first; it cannot be done from this file.
#
# function-auto-ready is held at v0.6.x DELIBERATELY. v0.7.0 exists, and
# crossplane-configurations pins ">=v0.6.5,<v0.7.0" -- taking the newer one
# breaks that constraint for every package that depends on it. v0.6.8 is the
# newest release inside the range. renovate.json carries the same bound so a
# bot cannot quietly step over it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane-functions
  namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
spec:
  interval: 30m
  dependsOn:
    - name: crossplane-deployment
      namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
  chart:
    spec:
      chart: sthings-cluster
      version: 0.3.20
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things
        namespace: ${CROSSPLANE_NAMESPACE:-crossplane-system}
      interval: 12h
  values:
    installCRDs: true
    customresources:
      functionAutoReady:
        apiVersion: pkg.crossplane.io/v1beta1
        kind: Function
        metadata:
          name: function-auto-ready
        spec:
          package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.6.8
      functionGoTemplating:
        apiVersion: pkg.crossplane.io/v1beta1
        kind: Function
        metadata:
          name: function-go-templating
        spec:
          package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.4
      functionKCL:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        metadata:
          name: function-kcl
        spec:
          package: xpkg.upbound.io/crossplane-contrib/function-kcl:v0.12.2
      functionPatchAndTransform:
        apiVersion: pkg.crossplane.io/v1beta1
        kind: Function
        metadata:
          name: function-patch-and-transform
        spec:
          package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.10.9
