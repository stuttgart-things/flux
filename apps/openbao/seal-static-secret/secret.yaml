---
# A key that can unseal the instance, stored in the same cluster -- the
# seal-static trade-off (../components/seal-static). It MUST NOT change while
# OPENBAO_SEAL_KEY_ID stays the same: OpenBao could not tell the two keys apart.
#
# terraform-password / admin-password: the passwords
# ../components/self-init-userpass gives the userpass users `terraform` and
# `admin` (break-glass) on first start. OPTIONAL -- empty when
# OPENBAO_TERRAFORM_PASSWORD / OPENBAO_ADMIN_PASSWORD are not set, and nothing
# reads them unless that component is selected (where an empty one fails the
# self-init, loudly). Unset, each renders `<key>:` -- YAML null once kustomize has
# dropped the quotes -- which the API server stores as "" in stringData
# (../../tabletennis/README.md). An empty `:-` default rather than none, so the
# key reads as optional (hack/check-substitutefrom-keys.py).
apiVersion: v1
kind: Secret
metadata:
  name: ${OPENBAO_SEAL_SECRET:-openbao-static-seal}
  namespace: ${OPENBAO_NAMESPACE:-openbao}
type: Opaque
stringData:
  key: ${OPENBAO_SEAL_STATIC_KEY}
  terraform-password: "${OPENBAO_TERRAFORM_PASSWORD:-}"
  admin-password: "${OPENBAO_ADMIN_PASSWORD:-}"
