---
# OpenBao -- the MPL-2.0 fork of Vault, forked at Vault 1.14.
#
# Deployed as a NEW instance, not migrated. The documented in-place migration
# only covers Vault 1.14.1 with raft + shamir and is explicitly unsupported from
# Vault 1.15.0 up, so an existing 1.20.x cannot take that path at all. Standing
# a fresh one up and moving workloads over is the path that exists.
#
# THE SEAL IS NOT HERE. This base deploys a shamir OpenBao, which starts SEALED
# and stays that way until a human unseals it. Pick one of the components:
#
#   components/seal-transit   another Vault/OpenBao unwraps the master key.
#                             Best, but needs a peer that already exists.
#   components/seal-static    a 32-byte key from a Secret. For the FIRST
#                             instance in an environment, where there is no
#                             peer to chain to.
#   components/seal-none      explicitly nothing: shamir, unsealed by hand.
#
# The seal lives in components rather than in a variable because it is a block
# in an HCL document -- there is no substitution that can conditionally omit a
# stanza, and a half-written seal stanza does not fail, it starts an instance
# that cannot be unsealed by the mechanism anyone expects.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: ${OPENBAO_NAMESPACE:-openbao}
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: openbao
      # renovate: datasource=helm depName=openbao registryUrl=https://openbao.github.io/openbao-helm
      version: "${OPENBAO_CHART_VERSION:-0.29.2}"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: ${OPENBAO_NAMESPACE:-openbao}
      interval: 12h
  values:
    server:
      # NO image.tag, deliberately. The chart renders
      #   {{ .Values.server.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}
      # so an unset tag follows the chart AND gets the leading "v" stripped,
      # while an explicit one does not. The image tags are 2.6.2; the GitHub
      # release and the chart's appVersion are v2.6.2. Setting the obvious
      # value yields quay.io/openbao/openbao:v2.6.2, which does not exist:
      #   failed to resolve reference ...: not found
      #
      # Nor is it a substitute variable: an empty default renders YAML null, and
      # postBuild.substitute is map[string]string. hack/check-substitute-strings.py
      # rejects it -- correctly.
      image:
        repository: openbao/openbao

      # The chart's Ingress stays off -- published through the shared Gateway
      # by httproute.yaml, like everything else in this bundle.
      ingress:
        enabled: false

      dataStorage:
        enabled: true
        size: ${OPENBAO_STORAGE_SIZE:-8Gi}
        # REQUIRED in practice: the chart default is the cluster's default
        # StorageClass, and a PVC that never binds leaves the pod Pending while
        # the HelmRelease reports installed.
        storageClass: ${OPENBAO_STORAGE_CLASS:-set-OPENBAO_STORAGE_CLASS}

      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 1
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/openbao/data"
          }

          service_registration "kubernetes" {}

