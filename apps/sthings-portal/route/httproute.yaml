---
# The portal takes the whole hostname: its own pages (and /auth/*) at /, every
# service under /<key>/ through its reverse proxy. The services need no route
# of their own -- and should have none on this host, or the login is bypassed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sthings-portal
  namespace: ${STHINGS_PORTAL_NAMESPACE:-homerun2}
  labels:
    app.kubernetes.io/name: sthings-portal
    app.kubernetes.io/instance: sthings-portal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${GATEWAY_NAME:-cilium-gateway}
      namespace: ${GATEWAY_NAMESPACE:-default}
  hostnames:
    - "${STHINGS_PORTAL_HOST}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sthings-portal
          port: 80
          weight: 1
