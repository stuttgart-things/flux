---
# The K8sGPT CR: the operator starts a k8sgpt server from it and runs its
# analyzers every interval. Applied separately from ../ because its CRD comes
# with the operator's HelmRelease -- in one Kustomization the dry run fails on
# an unknown kind.
#
# ai.enabled: false -- no LLM, no API key. Every finding is a Result CR in
# this namespace with spec.error[] (the analyzer's texts); spec.details, the AI
# explanation, stays empty. The operator deletes a Result once its problem is
# gone, so the Results are always the current findings.
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: ${K8SGPT_NAME:-k8sgpt}
  namespace: ${K8SGPT_NAMESPACE:-k8sgpt-operator-system}
spec:
  ai:
    enabled: false
    # Required by the CRD, unused while ai is disabled.
    backend: openai
  analysis:
    interval: ${K8SGPT_ANALYSIS_INTERVAL:-5m}
  # k8sgpt's default analyzers without ConfigMap (#1003): on platform-sthings
  # the ConfigMap analyzer produced 138 of 139 findings on the first scan --
  # empty or unused ConfigMaps such as kube-root-ca.crt or cluster-trust-bundle.
  # A list cannot be substituted: a cluster that wants other analyzers patches
  # /spec/filters on the K8sGPT kind (by kind: patches run before
  # substitution, when the name is still ${K8SGPT_NAME:-k8sgpt}).
  #
  # GatewayClass, Gateway and HTTPRoute (#1011) are optional analyzers: they
  # check acceptance and references (gateway, backend Service, allowed
  # namespaces), not reachability. On a cluster without the Gateway API CRDs
  # their List fails, k8sgpt records an analyzer error and still returns the
  # other analyzers' results -- no switch needed.
  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - StatefulSet
    - CronJob
    - Service
    - Ingress
    - PersistentVolumeClaim
    - Node
    - ValidatingWebhookConfiguration
    - MutatingWebhookConfiguration
    - GatewayClass
    - Gateway
    - HTTPRoute
  # The cache only holds AI answers.
  noCache: true
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  # renovate: datasource=docker depName=ghcr.io/k8sgpt-ai/k8sgpt
  version: ${K8SGPT_VERSION:-v0.4.41}
