---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8sgpt-operator
  namespace: ${K8SGPT_NAMESPACE:-k8sgpt-operator-system}
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: k8sgpt-operator
      # renovate: datasource=helm depName=k8sgpt-operator registryUrl=https://charts.k8sgpt.ai
      version: ${K8SGPT_OPERATOR_VERSION:-0.2.29}
      sourceRef:
        kind: HelmRepository
        name: k8sgpt
        namespace: ${K8SGPT_NAMESPACE:-k8sgpt-operator-system}
      interval: 12h
  install:
    # The chart ships the core.k8sgpt.ai CRDs (K8sGPT, Result, Mutation).
    # CreateReplace keeps them in step with the operator, and ./scan applies
    # a K8sGPT CR once this release is Ready.
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # No AI backend and no Interplex cache: the operator only writes Result
    # CRs (one per finding). Consumers read those, e.g. homerun2-k8s-pitcher
    # (profiles/k8sgpt-results.yaml) pitching them as findings.
    interplex:
      enabled: false
    controllerManager:
      manager:
        resources:
          requests:
            cpu: ${K8SGPT_OPERATOR_CPU_REQUEST:-10m}
            memory: ${K8SGPT_OPERATOR_MEMORY_REQUEST:-64Mi}
          limits:
            memory: ${K8SGPT_OPERATOR_MEMORY_LIMIT:-256Mi}
