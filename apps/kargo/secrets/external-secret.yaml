---
# Kargo's admin credentials, which the release SUBSTITUTES rather than mounts.
#
# KARGO_ADMIN_PASSWORD_HASH and KARGO_ADMIN_TOKEN_SIGNING_KEY have no defaults
# in release.yaml, and that is the safe half: left unset they render empty, and
# an admin account with an empty bcrypt hash plus a token signing key of ""
# is not a broken install, it is an open one. Nothing in the chart complains.
#
# In its own build root because postBuild reads the Secret while BUILDING: a
# Secret created by the same apply does not exist yet and never will.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-secrets
  namespace: flux-system
spec:
  refreshInterval: ${KARGO_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${KARGO_ESO_STORE_NAME:-set-KARGO_ESO_STORE_NAME}
    kind: ${KARGO_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: ${KARGO_SECRET:-kargo-secrets}
    creationPolicy: Owner
  data:
    # The key names ARE the substitution variables. Rename one and the variable
    # stays unsubstituted -- it does not fail, it renders the literal.
    - secretKey: KARGO_ADMIN_PASSWORD_HASH
      remoteRef:
        key: ${KARGO_ESO_SECRET_PATH:-kargo}
        property: ${KARGO_ESO_PASSWORD_HASH_PROPERTY:-admin_password_hash}
    - secretKey: KARGO_ADMIN_TOKEN_SIGNING_KEY
      remoteRef:
        key: ${KARGO_ESO_SECRET_PATH:-kargo}
        property: ${KARGO_ESO_SIGNING_KEY_PROPERTY:-admin_token_signing_key}
