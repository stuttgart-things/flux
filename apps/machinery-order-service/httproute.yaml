---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: machinery-order-service
  namespace: machinery-order-service
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE:-default}
  hostnames:
    - ${MACHINERY_ORDER_SERVICE_HOSTNAME:-orders}.${DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: machinery-order-service
          port: 8080
