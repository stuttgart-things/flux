---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-deployment
  namespace: ${KEYCLOAK_NAMESPACE:-keycloak}
spec:
  dependsOn:
    - name: keycloak-certificate-configuration
      namespace: ${KEYCLOAK_NAMESPACE:-keycloak}
  interval: 30m
  chart:
    spec:
      chart: keycloak
      # renovate: datasource=docker depName=registry-1.docker.io/bitnamicharts/keycloak
      version: ${KEYCLOAK_VERSION:-25.2.0}
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: ${KEYCLOAK_NAMESPACE:-keycloak}
      interval: 12h
  values:
    auth:
      adminUser: "${ADMIN_USER}"
      adminPassword: "${ADMIN_PASSWORD}" # quoted: a generated password may start with ! # or %
    proxy: edge # Useful for running Keycloak behind an Ingress or LoadBalancer
    service:
      type: ClusterIP # Change to LoadBalancer if needed
    extraEnvVars:
      - name: KEYCLOAK_LOG_LEVEL
        value: DEBUG
      - name: KEYCLOAK_EXTRA_ARGS
        value: "--import-realm"
    # bitnamilegacy, not bitnami: Bitnami withdrew the versioned tags from
    # docker.io/bitnami in 2025, so the chart's own defaults
    # (bitnami/keycloak:26.3.3-debian-12-r0, bitnami/postgresql:17.6.0-debian-12-r0)
    # no longer pull. Same tags under bitnamilegacy -- and the chart refuses a
    # non-bitnami repository unless allowInsecureImages is set. Same fix as
    # apps/harbor.
    image:
      repository: bitnamilegacy/keycloak
    keycloakConfigCli:
      image:
        repository: bitnamilegacy/keycloak-config-cli
    postgresql:
      image:
        repository: bitnamilegacy/postgresql
    global:
      defaultStorageClass: ${STORAGE_CLASS}
      storageClass: ${STORAGE_CLASS}
      security:
        allowInsecureImages: true
    ingress:
      enabled: true
      ingressClassName: ${INGRESS_CLASS:-nginx}
      hostname: ${INGRESS_HOSTNAME:-keycloak}.${INGRESS_DOMAIN}
      tls: false
      extraTls:
        - hosts:
            - ${INGRESS_HOSTNAME:-keycloak}.${INGRESS_DOMAIN}
          secretName: ${INGRESS_HOSTNAME:-keycloak}.${INGRESS_DOMAIN}-tls
    startupProbe:
      enabled: true
      failureThreshold: 30
      periodSeconds: 10
