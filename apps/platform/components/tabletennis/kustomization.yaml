---
# tabletennis -- schmetterpause + zaehlwerk, the office table tennis pair.
#
# REQUIRES cilium-gateway, external-secrets and cnpg-operator from the infra
# bundle, a resolvable DOMAIN, a GATEWAY_NAME, and TABLETENNIS_SECRET_STORE
# naming the cluster's ClusterSecretStore. That store must hold the entries
# `schmetterpause` and `zaehlwerk`.
#
# schmetterpause's CloudNativePG Cluster and its Namespace are NOT pruned:
# removing this component leaves the database behind, to be deleted by hand.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ks-tabletennis.yaml
