---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tabletennis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  # Both apps publish over the gateway and read from a ClusterSecretStore, so
  # neither can come up before those exist. external-secrets is named rather
  # than assumed: the ExternalSecrets fail closed, and a missing store shows up
  # as a Secret that never appears rather than as an error anyone reads.
  #
  # cnpg-operator because schmetterpause's database is a CloudNativePG Cluster
  # applied by THIS Kustomization: without the CRD the dry-run rejects the whole
  # apply, so the apps would not come up either.
  dependsOn:
    - name: cilium-gateway
    - name: external-secrets
    - name: cnpg-operator
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${TABLETENNIS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/tabletennis/profiles/base
  postBuild:
    substitute:
      # INFRA_DOMAIN / INFRA_GATEWAY_* are what infra/platform already reads, so
      # a cluster sets them once and both layers see them. Without this mapping
      # the app components' ${DOMAIN} and ${GATEWAY_NAME} resolve to EMPTY and
      # the HTTPRoutes come out with no gateway and a hostname of
      # "schmetterpause." -- while every Kustomization still reports Ready.
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      SCHMETTERPAUSE_NAMESPACE: "${TABLETENNIS_SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"
      SCHMETTERPAUSE_VERSION: "${TABLETENNIS_SCHMETTERPAUSE_VERSION:-v0.5.0}"
      SCHMETTERPAUSE_HOSTNAME: "${TABLETENNIS_SCHMETTERPAUSE_HOSTNAME:-schmetterpause}"
      # The whole image rather than a major version: a bare 18 resolves to an
      # int, which postBuild.substitute rejects for every sibling at once.
      SCHMETTERPAUSE_DB_IMAGE: "${TABLETENNIS_SCHMETTERPAUSE_DB_IMAGE:-ghcr.io/cloudnative-pg/postgresql:18}"
      SCHMETTERPAUSE_DB_STORAGE_SIZE: "${TABLETENNIS_SCHMETTERPAUSE_DB_STORAGE_SIZE:-1Gi}"
      ZAEHLWERK_NAMESPACE: "${TABLETENNIS_ZAEHLWERK_NAMESPACE:-zaehlwerk}"
      ZAEHLWERK_VERSION: "${TABLETENNIS_ZAEHLWERK_VERSION:-v0.2.0}"
      ZAEHLWERK_HOSTNAME: "${TABLETENNIS_ZAEHLWERK_HOSTNAME:-zaehlwerk}"
      # No safe default exists. The store is named per cluster (vault-<cluster>)
      # and guessing wrong points ESO at another cluster's secrets, which reads
      # as "the Secret never appears". The sentinel names the variable a cluster
      # actually has to set, so the failure says what to do.
      SECRET_STORE_NAME: "${TABLETENNIS_SECRET_STORE:-set-TABLETENNIS_SECRET_STORE}"
