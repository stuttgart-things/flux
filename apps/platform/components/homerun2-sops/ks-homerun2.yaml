---
# homerun2 on a SOPS-only cluster → ./apps/homerun2/profiles/sops
#
# THE ALTERNATIVE TO ../homerun2 for a cluster with no external-secrets and no
# ClusterSecretStore: the credentials are plain Secrets rendered from this
# Kustomization's substituteFrom Secret, which the cluster ships SOPS-encrypted
# (blueprints render-cluster-apps generates it from profile.yaml). Same child
# names as ../homerun2 (homerun2, homerun2-routes), so selecting both is one
# object defined twice.
#
# One Kustomization for redis and the apps, unlike ../homerun2's
# homerun2-redis + homerun2: profiles/sops renders both, and `wait: true`
# holds homerun2-routes until all of it is Ready.
#
# The notification-catcher's routing file is rendered IN THIS BUILD, next to
# its namespace (components/notification-catcher/notify-*). Default `none`:
# the catcher consumes and logs, nothing leaves the cluster.
# HOMERUN2_SOPS_NOTIFY picks another notify-* variant. Set the streams to match
# it (HOMERUN2_NOTIFICATION_CATCHER_STREAMS, e.g. `tabletennis` for
# tabletennis-results), and HOMERUN2_NOTIFICATION_CATCHER_DRY_RUN: off once the
# would-sends of one real match look right -- the same two switches as
# ../homerun2-notification-catcher on an external-secrets cluster.
#
# REQUIRES a StorageClass (HOMERUN2_REDIS_STORAGE_CLASS) and the Secret below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  force: false
  prune: true
  suspend: ${HOMERUN2_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/profiles/sops
  components:
    # none | tabletennis-results | tabletennis-results-with-demos (pong
    # games too, for testing) | tabletennis-results-and-cluster-builds |
    # cluster (renders nothing: the cluster repo ships the ConfigMap).
    # Exactly one: each renders the same ConfigMap.
    - ../../components/notification-catcher/notify-${HOMERUN2_SOPS_NOTIFY:-none}
    # on (default) or off. A component, not a value: DRY_RUN is a bool, and a
    # bool cannot pass through postBuild.substitute -- see dry-run-on.
    - ../../components/notification-catcher/dry-run-${HOMERUN2_NOTIFICATION_CATCHER_DRY_RUN:-on}
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      # passthrough-override: no StorageClass is safe to guess -- the base's
      # "standard" exists on almost no cluster here, and a PVC that never binds
      # reads as a slow redis. A sentinel names the variable to set.
      HOMERUN2_REDIS_STORAGE_CLASS: "${HOMERUN2_REDIS_STORAGE_CLASS:-set-HOMERUN2_REDIS_STORAGE_CLASS}"
      HOMERUN2_REDIS_STORAGE_SIZE: "${HOMERUN2_REDIS_STORAGE_SIZE:-8Gi}"
      # Redis Stack image. 7.4 since stuttgart-things#3923, once every known
      # cluster ran it; it writes RDB v12, which 7.2 cannot load, so a cluster
      # still on 7.2 data states 7.2.0-v18 here until it moves deliberately.
      HOMERUN2_REDIS_IMAGE_VERSION: "${HOMERUN2_REDIS_IMAGE_VERSION:-7.4.0-v8}"
      # passthrough-override: the base's default is empty (only the configured
      # stream), and an empty postBuild.substitute value renders as YAML null
      # and fails the whole Kustomization. `messages` is that configured stream.
      HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: "${HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS:-messages}"
      # BASE_PATH behind homerun2-portal, e.g. /led. "/" is the root to every
      # homerun2 service (each normalises it to ""), and it is the default
      # because an empty one cannot pass: kustomize drops the quotes, and an
      # empty substitute value lands as YAML null and fails the bundle.
      # passthrough-override: the components' own default is empty, see above.
      HOMERUN2_LED_CATCHER_BASE_PATH: "${HOMERUN2_LED_CATCHER_BASE_PATH:-/}"
      HOMERUN2_CORE_CATCHER_BASE_PATH: "${HOMERUN2_CORE_CATCHER_BASE_PATH:-/}"
      HOMERUN2_LIGHT_CATCHER_BASE_PATH: "${HOMERUN2_LIGHT_CATCHER_BASE_PATH:-/}"
      HOMERUN2_WLED_MOCK_BASE_PATH: "${HOMERUN2_WLED_MOCK_BASE_PATH:-/}"
      HOMERUN2_DEMO_PITCHER_BASE_PATH: "${HOMERUN2_DEMO_PITCHER_BASE_PATH:-/}"
      HOMERUN2_CONFIG_VIEWER_BASE_PATH: "${HOMERUN2_CONFIG_VIEWER_BASE_PATH:-/}"
      HOMERUN2_NOTIFICATION_CATCHER_BASE_PATH: "${HOMERUN2_NOTIFICATION_CATCHER_BASE_PATH:-/}"
      # The streams the notification-catcher reads -- match the notify-*
      # variant: zaehlwerk's results arrive on `tabletennis`. The default is
      # the catcher component's own.
      HOMERUN2_NOTIFICATION_CATCHER_STREAMS: "${HOMERUN2_NOTIFICATION_CATCHER_STREAMS:-messages,alerts}"
      # Versions, images and per-service settings of every service this
      # profile runs, so a cluster can pin them -- before, only BASE_PATHs
      # and redis storage passed and every service ran the library default
      # (notification-catcher v3.1.0 where a cluster ran v3.11.0). Defaults
      # are the components' own.
      # Not here: HOMERUN2_LED_CATCHER_IDLE and HOMERUN2_REDIS_PERSISTENCE_ENABLED,
      # whose defaults (off, true) are YAML bools and cannot pass a substitute.
      # A cluster that wants the clock sets HOMERUN2_LED_CATCHER_IDLE: clock on
      # this child with a bundle patch.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-config-viewer-kustomize
      HOMERUN2_CONFIG_VIEWER_KUSTOMIZE_VERSION: "${HOMERUN2_CONFIG_VIEWER_KUSTOMIZE_VERSION:-v0.7.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-config-viewer
      HOMERUN2_CONFIG_VIEWER_VERSION: "${HOMERUN2_CONFIG_VIEWER_VERSION:-v0.7.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher-kustomize
      HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION:-v1.3.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher
      HOMERUN2_CORE_CATCHER_VERSION: "${HOMERUN2_CORE_CATCHER_VERSION:-v1.3.0}"
      HOMERUN2_DEMO_PITCHER_TRUST_BUNDLE_CM: "${HOMERUN2_DEMO_PITCHER_TRUST_BUNDLE_CM:-cluster-trust-bundle}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-demo-pitcher-kustomize
      HOMERUN2_DEMO_PITCHER_VERSION: "${HOMERUN2_DEMO_PITCHER_VERSION:-v2.3.0}"
      HOMERUN2_LED_CATCHER_PROFILE_CM: "${HOMERUN2_LED_CATCHER_PROFILE_CM:-homerun2-led-catcher-profile}"
      HOMERUN2_LED_CATCHER_STREAMS: "${HOMERUN2_LED_CATCHER_STREAMS:-messages}"
      HOMERUN2_LED_CATCHER_TZ: "${HOMERUN2_LED_CATCHER_TZ:-UTC}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-led-catcher-kustomize
      HOMERUN2_LED_CATCHER_VERSION: "${HOMERUN2_LED_CATCHER_VERSION:-v0.20.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher-kustomize
      HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION:-v1.14.0}"
      HOMERUN2_LIGHT_CATCHER_PROFILE_CM: "${HOMERUN2_LIGHT_CATCHER_PROFILE_CM:-homerun2-light-catcher-profile}"
      HOMERUN2_LIGHT_CATCHER_STREAMS: "${HOMERUN2_LIGHT_CATCHER_STREAMS:-messages}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher
      HOMERUN2_LIGHT_CATCHER_VERSION: "${HOMERUN2_LIGHT_CATCHER_VERSION:-v1.14.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-notification-catcher-kustomize
      HOMERUN2_NOTIFICATION_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_NOTIFICATION_CATCHER_KUSTOMIZE_VERSION:-v3.13.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-notification-catcher
      HOMERUN2_NOTIFICATION_CATCHER_VERSION: "${HOMERUN2_NOTIFICATION_CATCHER_VERSION:-v3.13.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-omni-pitcher-kustomize
      HOMERUN2_OMNI_PITCHER_VERSION: "${HOMERUN2_OMNI_PITCHER_VERSION:-v2.4.0}"
      HOMERUN2_REDIS_IMAGE_REGISTRY: "${HOMERUN2_REDIS_IMAGE_REGISTRY:-ghcr.io}"
      HOMERUN2_REDIS_IMAGE_REPOSITORY: "${HOMERUN2_REDIS_IMAGE_REPOSITORY:-stuttgart-things/redis-stack-server}"
      HOMERUN2_REDIS_SENTINEL_REGISTRY: "${HOMERUN2_REDIS_SENTINEL_REGISTRY:-ghcr.io}"
      HOMERUN2_REDIS_SENTINEL_REPOSITORY: "${HOMERUN2_REDIS_SENTINEL_REPOSITORY:-stuttgart-things/redis-sentinel}"
      HOMERUN2_REDIS_SENTINEL_VERSION: "${HOMERUN2_REDIS_SENTINEL_VERSION:-7.4.2-debian-12-r9}"
      HOMERUN2_REDIS_SERVICE_TYPE: "${HOMERUN2_REDIS_SERVICE_TYPE:-ClusterIP}"
      # Held at 17.1.4 without a renovate line, like ../homerun2 (flux#355).
      HOMERUN2_REDIS_VERSION: "${HOMERUN2_REDIS_VERSION:-17.1.4}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout-kustomize
      HOMERUN2_SCOUT_KUSTOMIZE_VERSION: "${HOMERUN2_SCOUT_KUSTOMIZE_VERSION:-v0.12.0}"
      HOMERUN2_SCOUT_TRUST_BUNDLE_CM: "${HOMERUN2_SCOUT_TRUST_BUNDLE_CM:-cluster-trust-bundle}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout
      HOMERUN2_SCOUT_VERSION: "${HOMERUN2_SCOUT_VERSION:-v0.12.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-wled-mock-kustomize
      HOMERUN2_WLED_MOCK_VERSION: "${HOMERUN2_WLED_MOCK_VERSION:-v1.14.0}"
    substituteFrom:
      # substituteFrom-keys: HOMERUN2_REDIS_PASSWORD_B64, TEAMS_WEBHOOK_URL
      # substituteFrom-optional-keys: HOMERUN2_OMNI_PITCHER_AUTH_TOKEN,
      #   HOMERUN2_SCOUT_AUTH_TOKEN
      # The two tokens default to `changeme` in the base, so the build does not
      # need them -- a cluster does. TEAMS_WEBHOOK_URL is read by the catcher's
      # Secret whatever the routing; with notify-none any placeholder will do.
      # HOMERUN2_REDIS_PASSWORD_B64 is base64 (it lands in Secret `data:`), and
      # zaehlwerk's ZAEHLWERK_REDIS_PASSWORD (../tabletennis-sops) is the same
      # password, decoded.
      - kind: Secret
        name: ${HOMERUN2_SOPS_SECRET:-homerun2-sops-secrets}
        optional: false
