---
# AppProfile: what a cluster sets for homerun2-sops, and the Secret it needs.
# Read by blueprints `render-cluster-apps`; kept true by
# hack/check-app-profiles.py (vars and keys) and `kcl vet` (value shapes).
#
# HOMERUN2_REDIS_PASSWORD_B64 has no usable default: it is base64 of the redis
# password (it lands in Secret `data:`), and zaehlwerk (tabletennis-sops)
# needs the same password decoded -- nothing generates both. The placeholder is
# not valid base64, so the homerun2 apply fails loudly until a cluster sets it
# (ref+sops:// in its ClusterApps). TEAMS_WEBHOOK_URL is read even with the
# default notify-none routing, which sends nothing.
kind: AppProfile
metadata:
  name: homerun2-sops
spec:
  bundle: apps-platform
  component: ../components/homerun2-sops
  vars:
    HOMERUN2_REDIS_STORAGE_CLASS: { required: true }
    INFRA_DOMAIN: { required: true }
    HOMERUN2_NAMESPACE: {}
    HOMERUN2_SUSPEND: {}
    HOMERUN2_SOPS_NOTIFY: {}
    HOMERUN2_NOTIFICATION_CATCHER_STREAMS: {}
    HOMERUN2_NOTIFICATION_CATCHER_DRY_RUN: {}
    HOMERUN2_REDIS_STORAGE_SIZE: {}
    HOMERUN2_REDIS_IMAGE_VERSION: {}
    HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS: {}
    HOMERUN2_OMNI_PITCHER_HOSTNAME: {}
    HOMERUN2_CORE_CATCHER_HOSTNAME: {}
    HOMERUN2_SCOUT_HOSTNAME: {}
    HOMERUN2_LED_CATCHER_HOSTNAME: {}
    HOMERUN2_LIGHT_CATCHER_HOSTNAME: {}
    HOMERUN2_WLED_MOCK_HOSTNAME: {}
    HOMERUN2_DEMO_PITCHER_HOSTNAME: {}
    HOMERUN2_CONFIG_VIEWER_HOSTNAME: {}
    HOMERUN2_LED_CATCHER_BASE_PATH: {}
    HOMERUN2_CORE_CATCHER_BASE_PATH: {}
    HOMERUN2_LIGHT_CATCHER_BASE_PATH: {}
    HOMERUN2_WLED_MOCK_BASE_PATH: {}
    HOMERUN2_DEMO_PITCHER_BASE_PATH: {}
    HOMERUN2_CONFIG_VIEWER_BASE_PATH: {}
    INFRA_GATEWAY_NAME: {}
    INFRA_GATEWAY_NAMESPACE: {}
    HOMERUN2_CONFIG_VIEWER_KUSTOMIZE_VERSION: {}
    HOMERUN2_CONFIG_VIEWER_VERSION: {}
    HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION: {}
    HOMERUN2_CORE_CATCHER_VERSION: {}
    HOMERUN2_DEMO_PITCHER_TRUST_BUNDLE_CM: {}
    HOMERUN2_DEMO_PITCHER_VERSION: {}
    HOMERUN2_LED_CATCHER_PROFILE_CM: {}
    HOMERUN2_LED_CATCHER_STREAMS: {}
    HOMERUN2_LED_CATCHER_TZ: {}
    HOMERUN2_LED_CATCHER_VERSION: {}
    HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION: {}
    HOMERUN2_LIGHT_CATCHER_PROFILE_CM: {}
    HOMERUN2_LIGHT_CATCHER_STREAMS: {}
    HOMERUN2_LIGHT_CATCHER_VERSION: {}
    HOMERUN2_NOTIFICATION_CATCHER_KUSTOMIZE_VERSION: {}
    HOMERUN2_NOTIFICATION_CATCHER_VERSION: {}
    HOMERUN2_OMNI_PITCHER_VERSION: {}
    HOMERUN2_REDIS_IMAGE_REGISTRY: {}
    HOMERUN2_REDIS_IMAGE_REPOSITORY: {}
    HOMERUN2_REDIS_SENTINEL_REGISTRY: {}
    HOMERUN2_REDIS_SENTINEL_REPOSITORY: {}
    HOMERUN2_REDIS_SENTINEL_VERSION: {}
    HOMERUN2_REDIS_SERVICE_TYPE: {}
    HOMERUN2_REDIS_VERSION: {}
    HOMERUN2_SCOUT_KUSTOMIZE_VERSION: {}
    HOMERUN2_SCOUT_TRUST_BUNDLE_CM: {}
    HOMERUN2_SCOUT_VERSION: {}
    HOMERUN2_WLED_MOCK_VERSION: {}
  secrets:
    - name: homerun2-sops-secrets
      data:
        HOMERUN2_REDIS_PASSWORD_B64: set-HOMERUN2_REDIS_PASSWORD_B64 # pragma: allowlist secret
        TEAMS_WEBHOOK_URL: https://set-TEAMS_WEBHOOK_URL.invalid
        # alnum: sent as a bearer token, and zaehlwerk's
        # ZAEHLWERK_OMNI_PITCHER_TOKEN has to be the same value.
        HOMERUN2_OMNI_PITCHER_AUTH_TOKEN: { generate: { type: alnum, length: 32 } }
        HOMERUN2_SCOUT_AUTH_TOKEN: { generate: { type: alnum, length: 32 } }
