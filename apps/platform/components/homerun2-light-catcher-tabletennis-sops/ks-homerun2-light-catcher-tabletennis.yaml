---
# a light-catcher on the `tabletennis` stream, in a namespace of its own, on a
# SOPS-only cluster → ./apps/homerun2/profiles/sops-light-catcher-tabletennis
#
# THE ALTERNATIVE TO ../homerun2-light-catcher-tabletennis for a cluster with no
# external-secrets: the redis password is a plain Secret rendered from this
# Kustomization's substituteFrom Secret, in the same build as the Namespace it
# lands in. Same child names (homerun2-light-catcher-tabletennis, -routes), so
# selecting both is one object defined twice.
#
# REQUIRES homerun2 (redis) -- ../homerun2-sops on such a cluster, whose child
# has the same name. Not ../homerun2-light-catcher: the wled-mock it brings is
# only the default endpoint, and waiting on it would block a cluster that
# drives a real strip and never selects the mock.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-light-catcher-tabletennis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: homerun2
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${HOMERUN2_LIGHT_CATCHER_TABLETENNIS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/profiles/sops-light-catcher-tabletennis
  postBuild:
    substitute:
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      HOMERUN2_LIGHT_CATCHER_TABLETENNIS_NAMESPACE: "${HOMERUN2_LIGHT_CATCHER_TABLETENNIS_NAMESPACE:-homerun2-tabletennis}"
      # The homerun2 wled-mock unless the cluster has a strip. Written out rather
      # than built from HOMERUN2_NAMESPACE: a default cannot nest a reference.
      HOMERUN2_LIGHT_CATCHER_TABLETENNIS_WLED_ENDPOINT: "${HOMERUN2_LIGHT_CATCHER_TABLETENNIS_WLED_ENDPOINT:-http://homerun2-wled-mock.homerun2.svc.cluster.local}"
      # The same version variables as ../homerun2-light-catcher: one catcher, two
      # instances. v1.1.0 is the floor here -- the profile matches on tags.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher-kustomize
      HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION:-v1.7.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher
      HOMERUN2_LIGHT_CATCHER_VERSION: "${HOMERUN2_LIGHT_CATCHER_VERSION:-v1.7.0}"
    substituteFrom:
      # substituteFrom-keys: HOMERUN2_REDIS_PASSWORD_B64
      # base64 of the redis password (it lands in Secret `data:`) -- the SAME
      # value as homerun2-sops' HOMERUN2_REDIS_PASSWORD_B64. A Secret of its
      # own rather than homerun2-sops-secrets: a renderer generates one Secret
      # per AppProfile entry, and two profiles declaring one name would write
      # it twice with different keys. A cluster references both from one
      # source (ref+sops:// in its ClusterApps).
      - kind: Secret
        name: ${HOMERUN2_LIGHT_CATCHER_TABLETENNIS_SOPS_SECRET:-homerun2-light-catcher-tabletennis-sops-secrets}
        optional: false
