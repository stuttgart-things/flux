---
# homerun2-sound-catcher-routes -- the HTTPRoute for homerun2-sound-catcher → ./apps/homerun2/profiles/base-sound-catcher-routes
#
# A Kustomization of its own that waits for homerun2-sound-catcher, because Cilium resolves
# a route's backendRefs once: applied before its Service exists, a route
# serves HTTP 500 for good while every Kustomization reports Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-sound-catcher-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: homerun2-sound-catcher
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${HOMERUN2_SOUND_CATCHER_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/profiles/base-sound-catcher-routes
  postBuild:
    substitute:
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      HOMERUN2_SOUND_CATCHER_HOSTNAME: "${HOMERUN2_SOUND_CATCHER_HOSTNAME:-sound-catcher}"
      # NOT here: HOMERUN2_SOUND_CATCHER_BASE_PATH. The route builds
      # `<BASE_PATH>/api/events` from it, so the root needs it EMPTY -- which a
      # substitute cannot carry (YAML null) and "/" would turn into
      # //api/events. A cluster behind homerun2-portal adds it to this child
      # with a bundle patch (e.g. /sound).
