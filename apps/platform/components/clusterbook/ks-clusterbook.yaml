---
# clusterbook -- IP allocation and the matching DNS record, in one call → ./apps/clusterbook
#
# dependsOn cilium-gateway (infra bundle) for its HTTPRoute.
#
# THIS IS LAB-BOUND, and selecting it elsewhere gives a service that answers and
# can do nothing. It writes into ONE PowerDNS zone with ONE token: point
# CLUSTERBOOK_PDNS_ZONE at a zone this token may change, or every reservation
# fails at the DNS half after allocating an address. There is exactly one
# instance today (infra-sthings, zone sthings-vsphere.labul.sva.de).
#
# Its /reserve endpoint is NOT idempotent -- it hands out a NEW address on every
# call, so a retried pipeline leaks an address and a second DNS record while
# every step still reports success. Callers should go through
# `dagger -m clusterbook reserve-ip`, which asks /clusters/{name} first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clusterbook
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: cilium-gateway
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${CLUSTERBOOK_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/clusterbook
  # PowerDNS on. A component because PDNS_ENABLED is a bool and
  # postBuild.substitute is map[string]string -- and because a consumer cannot
  # set it either: through a bundle component there is a hop, and a variable
  # this component does not list never reaches the base.
  components:
    - ./components/pdns
  postBuild:
    substitute:
      CLUSTERBOOK_NAMESPACE: "${CLUSTERBOOK_NAMESPACE:-clusterbook}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/clusterbook
      CLUSTERBOOK_VERSION: "${CLUSTERBOOK_VERSION:-v1.25.15}"
      FLUX_SOURCE_API_VERSION: "${FLUX_SOURCE_API_VERSION:-v1}"

      # ---- the address pool ---------------------------------------------
      # A NetworkConfig CR, which is NOT shipped by this app -- it is the
      # allocation ledger and belongs to whoever owns the addresses. The chart
      # defaults the name to networks-labul, so a second lab must set this or
      # it reads a pool that is not its own.
      CLUSTERBOOK_CONFIG_NAME: "${CLUSTERBOOK_CONFIG_NAME:-networks-labul}"
      CLUSTERBOOK_CONFIG_LOCATION: "${CLUSTERBOOK_CONFIG_LOCATION:-clusterbook}"

      # ---- PowerDNS -----------------------------------------------------
      # passthrough-override: the base leaves both EMPTY, which the operator
      # accepts -- it then writes no DNS record and reports success, so a cluster
      # gets an address and no name. A loud placeholder fails at deploy time
      # instead, where it is still cheap to fix.
      PDNS_URL: "${CLUSTERBOOK_PDNS_URL:-set-CLUSTERBOOK_PDNS_URL}"
      # The TRAILING DOT belongs here -- PowerDNS wants an absolute zone name,
      # and appending another one later yields "zone..", which it rejects as
      # unparsable. That has bitten the teardown path twice.
      # passthrough-override: same as PDNS_URL above -- empty is accepted silently.
      PDNS_ZONE: "${CLUSTERBOOK_PDNS_ZONE:-set-CLUSTERBOOK_PDNS_ZONE.}"

      # ---- HTTPRoute ----------------------------------------------------
      CLUSTERBOOK_HOSTNAME: "${CLUSTERBOOK_HOSTNAME:-clusterbook}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
    # PDNS_TOKEN, and DDWRT_PASSWORD when that backend is on. optional: false --
    # left optional, clusterbook comes up with an empty token and every
    # reservation allocates an address and then fails to write DNS, which looks
    # like a PowerDNS problem rather than a missing secret.
    substituteFrom:
      # substituteFrom-keys: PDNS_TOKEN, DDWRT_PASSWORD
      # optional: false guards the SOURCE, not the KEYS. Flux fails this
      # Kustomization when the Secret is absent -- and substitutes an empty
      # string for any key the Secret does not carry, with no error at all. A
      # Secret that exists but is missing one of the names below produces
      # exactly the outcome the paragraph above warns about. See #331.
      - kind: Secret
        name: ${CLUSTERBOOK_SECRET:-clusterbook-pdns-vars}
        optional: false
