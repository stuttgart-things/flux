---
# tabletennis with schmetterpause's database backed up → ./apps/tabletennis/profiles/base
#
# ---------------------------------------------------------------------------
# THE ALTERNATIVE TO ../tabletennis, NOT AN ADD-ON. Both render the child
# Kustomization `tabletennis` from the same path, so a cluster switches between
# them without the apps being pruned and re-created, and selecting both is one
# object defined twice. check-shared-path-wiring.py keeps the two in step: this
# file may only ADD the backup component and its variables.
# ---------------------------------------------------------------------------
#
# What it adds, from ../../components/schmetterpause-db-backup: an ObjectStore,
# continuous WAL archiving on schmetterpause-db through the Barman Cloud plugin,
# a daily ScheduledBackup, and the ExternalSecret that carries both the S3 pair
# and the CA bundle. Recovery: that component's README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tabletennis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  # As ../tabletennis, plus:
  #   cnpg-barman-cloud  the plugin, and the ObjectStore CRD this applies
  #   trust-manager      publishes the cluster-trust-bundle ConfigMap the
  #                      ExternalSecret turns into the endpoint CA
  dependsOn:
    - name: cilium-gateway
    - name: external-secrets
    - name: cnpg-operator
    - name: cnpg-barman-cloud
    - name: trust-manager
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${TABLETENNIS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/tabletennis/profiles/base
  components:
    - ../../components/schmetterpause-db-backup
    # zaehlwerk's scoreboard panel: off, or homerun2 on the same cluster.
    # A component rather than a variable -- see components/zaehlwerk-panel-homerun2.
    - ../../components/zaehlwerk-panel-${TABLETENNIS_ZAEHLWERK_PANEL:-off}
    # PodMonitors + alert rules for the app and its database: off, on, or backup
    # (on plus the WAL/base-backup rules). A component rather than a variable,
    # like the panel above -- and for the same reason the argocd side gates them
    # behind a value: the Prometheus Operator CRDs have to be on the cluster, and
    # without them the dry-run rejects the WHOLE apps layer, not just these
    # objects.
    # ON THIS COMPONENT, `on` IS PROBABLY THE WRONG CHOICE: it ships the app and
    # database alerts and leaves the backup this variant sets up unwatched. Use
    # `backup`, which is `on` plus those rules. Still defaulted to off, because
    # the Prometheus Operator CRDs are a separate decision from having backups.
    - ../../components/schmetterpause-monitoring-${TABLETENNIS_SCHMETTERPAUSE_MONITORING:-off}
    # The first admin, granted at every start (schmetterpause ADR-0008): off or
    # on, with the name in TABLETENNIS_SCHMETTERPAUSE_BOOTSTRAP_ADMIN. A
    # component rather than a plain value because "none" is the empty string,
    # and an empty postBuild.substitute value renders as YAML null and fails
    # this whole Kustomization -- see hack/check-substitute-strings.py.
    - ../../components/schmetterpause-admin-${TABLETENNIS_SCHMETTERPAUSE_ADMIN:-off}
    # schmetterpause's JSON surface for the Zählwerk -- GET /api/players and
    # POST /api/results (schmetterpause ADR-0015): off or on. A component
    # because the token is one more entry in the app's ExternalSecret, and ESO
    # fails the WHOLE Secret over one missing Vault property -- session key
    # included, which signs every player out. "Off" therefore has to mean the
    # property is not asked for, which no substituted value can express.
    - ../../components/schmetterpause-scoreboard-${TABLETENNIS_SCHMETTERPAUSE_SCOREBOARD:-off}
    # zaehlwerk reporting a won match into schmetterpause (zaehlwerk ADR-0004):
    # off or on. THE OTHER END OF THE SWITCH ABOVE -- select both or neither.
    # On its own this points zaehlwerk at a surface that does not exist, and
    # nothing turns red: the match still scores, and only zaehlwerk's log
    # carries the 404.
    - ../../components/zaehlwerk-handover-${TABLETENNIS_ZAEHLWERK_HANDOVER:-off}
    # Kyverno's check that the application image carries schmetterpause's CI
    # signature (ADR-0020/0021): off or on. A component for the same reason as
    # the monitoring variants -- without the Kyverno CRDs the dry-run would
    # reject it. Note this repository ships no Kyverno; see the component.
    - ../../components/schmetterpause-policy-${TABLETENNIS_SCHMETTERPAUSE_POLICY:-off}
  postBuild:
    substitute:
      # ---- identical to ../tabletennis ----------------------------------
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      SCHMETTERPAUSE_NAMESPACE: "${TABLETENNIS_SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/schmetterpause-kustomize
      SCHMETTERPAUSE_VERSION: "${TABLETENNIS_SCHMETTERPAUSE_VERSION:-v0.14.0}"
      SCHMETTERPAUSE_HOSTNAME: "${TABLETENNIS_SCHMETTERPAUSE_HOSTNAME:-schmetterpause}"
      SCHMETTERPAUSE_DB_IMAGE: "${TABLETENNIS_SCHMETTERPAUSE_DB_IMAGE:-ghcr.io/cloudnative-pg/postgresql:18}"
      SCHMETTERPAUSE_DB_STORAGE_SIZE: "${TABLETENNIS_SCHMETTERPAUSE_DB_STORAGE_SIZE:-1Gi}"
      ZAEHLWERK_NAMESPACE: "${TABLETENNIS_ZAEHLWERK_NAMESPACE:-zaehlwerk}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/zaehlwerk-kustomize
      ZAEHLWERK_VERSION: "${TABLETENNIS_ZAEHLWERK_VERSION:-v0.6.0}"
      ZAEHLWERK_HOSTNAME: "${TABLETENNIS_ZAEHLWERK_HOSTNAME:-zaehlwerk}"
      SECRET_STORE_NAME: "${TABLETENNIS_SECRET_STORE:-set-TABLETENNIS_SECRET_STORE}"
      # The display name the admin flag lands on, read only by the `on` admin
      # variant. The person has to have joined first; a name nobody carries is a
      # warning in the log rather than a failed start.
      #
      # A SENTINEL RATHER THAN EMPTY, and not a preference: an empty value here
      # renders as YAML null once kustomize has dropped the quotes, and the API
      # server then refuses the whole Kustomization. "None" is expressed by
      # leaving the admin component at `off`, which is its default.
      SCHMETTERPAUSE_BOOTSTRAP_ADMIN: "${TABLETENNIS_SCHMETTERPAUSE_BOOTSTRAP_ADMIN:-set-TABLETENNIS_SCHMETTERPAUSE_BOOTSTRAP_ADMIN}"
      # Read by the `on` scoreboard and handover variants, and by BOTH of them:
      # one Vault entry holds the token schmetterpause serves its /api with and
      # zaehlwerk calls it with, so a rotation is one value rather than two that
      # can disagree.
      #
      # ITS OWN ENTRY, not the application's. vault-base-setup writes an entry
      # with data_json and rewrites it whole, so putting this on `schmetterpause`
      # means restating session-key, username and password in the same JSON --
      # and a wrong session-key signs every player out at once.
      SCHMETTERPAUSE_SCOREBOARD_VAULT_PATH: "${TABLETENNIS_SCHMETTERPAUSE_SCOREBOARD_VAULT_PATH:-schmetterpause-scoreboard}"
      SCHMETTERPAUSE_SCOREBOARD_VAULT_PROPERTY: "${TABLETENNIS_SCHMETTERPAUSE_SCOREBOARD_VAULT_PROPERTY:-token}"
      # Where zaehlwerk reports to, read only by the `on` handover variant. The
      # HTTPRoute is the default -- a browser's own path, TLS end to end -- and
      # the in-cluster Service (http://schmetterpause.<ns>.svc) works too where
      # both run on one cluster.
      #
      # passthrough-override: the component derives this from SCHMETTERPAUSE_HOSTNAME
      # and DOMAIN, which exist one level down; the same value has to be built
      # from this layer's own INFRA_DOMAIN here.
      ZAEHLWERK_SCHMETTERPAUSE_URL: "${TABLETENNIS_ZAEHLWERK_SCHMETTERPAUSE_URL:-https://${TABLETENNIS_SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${INFRA_DOMAIN}}"
      # Browser origins allowed to read zaehlwerk's live match stream.
      # schmetterpause's own origin by default, for its live tab; upstream
      # refuses the `*` wildcard, and empty means none.
      #
      # passthrough-override: same reason as ZAEHLWERK_SCHMETTERPAUSE_URL above.
      ZAEHLWERK_ALLOWED_ORIGINS: "${TABLETENNIS_ZAEHLWERK_ALLOWED_ORIGINS:-https://${TABLETENNIS_SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${INFRA_DOMAIN}}"
      SCHMETTERPAUSE_MONITORING_INTERVAL: "${TABLETENNIS_SCHMETTERPAUSE_MONITORING_INTERVAL:-60s}"
      # Only read by the `backup` monitoring variant. The ScheduledBackup is
      # daily; 26 h leaves room for one slow run before it alerts.
      #
      # A PRODUCT RATHER THAN THE NUMBER OF SECONDS, and not the number of
      # hours either: a bare 93600 or 26 resolves to an int, which
      # postBuild.substitute rejects -- for every sibling in this block at
      # once, not just this key. Same reason SCHMETTERPAUSE_DB_IMAGE above
      # carries the whole image rather than the major version. `26 * 3600` is
      # a string here and valid PromQL there, so the hours stay readable.
      SCHMETTERPAUSE_BACKUP_MAX_AGE_SECONDS: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_MAX_AGE_SECONDS:-26 * 3600}"
      # ---- the backup -----------------------------------------------------
      # REQUIRED, both. A bucket of its own: Velero treats unknown top-level
      # directories in ITS bucket as an invalid store, so sharing one breaks the
      # Velero backups rather than this.
      SCHMETTERPAUSE_BACKUP_BUCKET: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_BUCKET:-set-SCHMETTERPAUSE_BACKUP_BUCKET}"
      SCHMETTERPAUSE_BACKUP_S3_ENDPOINT: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_S3_ENDPOINT:-https://set-SCHMETTERPAUSE_BACKUP_S3_ENDPOINT.invalid}"
      # The KV entry holding access_key and secret_key. A cluster whose MinIO
      # user already has an entry -- the one Velero uses, say -- points this at
      # it instead of keeping the same credential twice.
      SCHMETTERPAUSE_BACKUP_SECRET_PATH: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_SECRET_PATH:-schmetterpause-backup}"
      SCHMETTERPAUSE_BACKUP_RETENTION: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_RETENTION:-7d}"
      # Six fields, seconds first.
      SCHMETTERPAUSE_BACKUP_SCHEDULE: "${TABLETENNIS_SCHMETTERPAUSE_BACKUP_SCHEDULE:-0 0 3 * * *}"
