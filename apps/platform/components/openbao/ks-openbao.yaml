---
# OpenBao with a real transit auto-unseal → ./apps/openbao
#
# NO dependsOn cilium-gateway. The base renders an HTTPRoute against that
# Gateway, and an HTTPRoute is valid against a Gateway that is not yet Ready --
# it simply does not attach until the Gateway comes up. Gating the whole
# instance on cilium-gateway created a deadlock the first time this cluster
# hosted the PKI it depends on: cilium-gateway waits on the platform wildcard
# certificate, which during a PKI migration is issued by the very Vault this
# OpenBao replaces. OpenBao could not come up to end the outage that kept it
# down. Bring OpenBao up independently of ingress; the HTTPRoute settles once
# the Gateway does. See stuttgart-things/harvester#152.
#
# TWO THINGS THIS COMPONENT CANNOT CHECK FOR YOU, both of which go green while
# being wrong:
#
#   * OPENBAO_SEAL_ADDRESS must point at a Vault/OpenBao that holds the transit
#     key, and the Secret named below must carry a token allowed to use it. Get
#     either wrong and the pod stays not-ready with a seal error while the
#     HelmRelease reports installed.
#   * OPENBAO_STORAGE_CLASS must exist here. A PVC that never binds leaves the
#     pod Pending, and nothing above it says so.
#
# The Vault-side half -- transit mount, key, policy and a PERIODIC RENEWABLE
# token -- is not created here and cannot be: it needs credentials for the other
# Vault. Same split as cert-manager-vault-issuer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${OPENBAO_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/openbao
  # WHICH SEAL. Substituted by the parent before this is applied, so one
  # component covers all three modes:
  #
  #   transit  another Vault/OpenBao unwraps the key -- nothing that can unseal
  #            this instance is stored near it. Needs a peer to already exist.
  #   static   a 32-byte key from a Secret. For the FIRST instance in an
  #            environment, where there is no peer to chain to.
  #   none     shamir. Starts SEALED after every restart until a human unseals
  #            it -- legitimate, but not something to discover in an incident.
  #
  # Named on the components line rather than hidden in a variable default, so a
  # cluster's seal choice is visible where its apps are listed.
  components:
    - ./components/seal-${OPENBAO_SEAL_MODE:-transit}
  postBuild:
    substitute:
      OPENBAO_NAMESPACE: "${OPENBAO_NAMESPACE:-openbao}"
      # renovate: datasource=helm depName=openbao registryUrl=https://openbao.github.io/openbao-helm
      OPENBAO_CHART_VERSION: "${OPENBAO_CHART_VERSION:-0.29.3}"
      # No OPENBAO_VERSION: the image tag is not parameterised at all. It
      # follows the chart's appVersion with the leading "v" stripped by the
      # chart, so the chart version below is the single thing to keep current.

      OPENBAO_STORAGE_CLASS: "${OPENBAO_STORAGE_CLASS:-set-OPENBAO_STORAGE_CLASS}" # REQUIRED
      OPENBAO_STORAGE_SIZE: "${OPENBAO_STORAGE_SIZE:-8Gi}"

      # ---- seal: transit ------------------------------------------------
      OPENBAO_SEAL_ADDRESS: "${OPENBAO_SEAL_ADDRESS:-set-OPENBAO_SEAL_ADDRESS}" # REQUIRED
      OPENBAO_SEAL_KEY_NAME: "${OPENBAO_SEAL_KEY_NAME:-openbao-unseal}"
      OPENBAO_SEAL_MOUNT_PATH: "${OPENBAO_SEAL_MOUNT_PATH:-transit/}"
      # ---- seal: static -------------------------------------------------
      # An OPAQUE LABEL, not a version to be clever with -- but it MUST change
      # whenever the key does, or OpenBao cannot tell them apart and whatever
      # was sealed with the old key becomes unreadable.
      OPENBAO_SEAL_KEY_ID: "${OPENBAO_SEAL_KEY_ID:-set-OPENBAO_SEAL_KEY_ID}"

      # ---- the Secret either seal reads ---------------------------------
      # transit: a periodic renewable token. static: a 32-byte key.
      OPENBAO_SEAL_SECRET: "${OPENBAO_SEAL_SECRET:-openbao-transit-seal}"
      OPENBAO_SEAL_SECRET_KEY: "${OPENBAO_SEAL_SECRET_KEY:-token}"
      OPENBAO_TRUST_BUNDLE_CONFIGMAP: "${OPENBAO_TRUST_BUNDLE_CONFIGMAP:-cluster-trust-bundle}"
      OPENBAO_TRUST_BUNDLE_KEY: "${OPENBAO_TRUST_BUNDLE_KEY:-trust-bundle.pem}"

      # ---- HTTPRoute ----------------------------------------------------
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOSTNAME: "${OPENBAO_HOSTNAME:-openbao}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
