---
# openbao-httproute -- the HTTPRoute for openbao → ./apps/openbao/components/httproute
#
# A Kustomization of its own that waits for openbao, because Cilium resolves a
# route's backendRefs once: applied before its Service exists, a route serves
# HTTP 500 for good while every Kustomization reports Ready. Same split as the
# homerun2 *-routes components.
#
# Consequence on a FRESH instance: openbao is not Ready until `bao operator
# init` has run (its pod is not ready while uninitialised), so the route -- and
# with it the UI through the Gateway -- appears only after the init. Run it with
# `kubectl exec` (apps/openbao/README.md, "Initialize").
#
# Moving from a revision where the route was part of openbao: it changes owner.
# openbao prunes it (it is gone from openbao's inventory) and openbao-httproute,
# already past its dependsOn on a running instance, applies it again -- at most
# a reconcile's gap without a route, and the Service already exists, so it
# comes back resolved. Should openbao-httproute apply first, it takes over the
# owner labels and openbao's prune leaves it alone: Flux deletes only objects
# still labelled as its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: openbao
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${OPENBAO_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/openbao/components/httproute
  postBuild:
    substitute:
      OPENBAO_NAMESPACE: "${OPENBAO_NAMESPACE:-openbao}"
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOSTNAME: "${OPENBAO_HOSTNAME:-openbao}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
