---
# AppProfile: what a cluster sets for homerun2-k8s-pitcher-remote-sops, and
# the Secret it needs. Read by blueprints `render-cluster-apps`; kept true by
# hack/check-app-profiles.py (vars and keys) and `kcl vet` (value shapes).
#
# HOMERUN2_K8S_PITCHER_AUTH_TOKEN must be the CENTRAL omni-pitcher's token.
# Nothing generates it from that, so the default is a placeholder the central
# omni-pitcher rejects (401) until a cluster references the same source as the
# central cluster's homerun2-sops (ref+sops:// in its ClusterApps).
kind: AppProfile
metadata:
  name: homerun2-k8s-pitcher-remote-sops
spec:
  bundle: apps-platform
  component: ../components/homerun2-k8s-pitcher-remote-sops
  vars:
    HOMERUN2_CENTRAL_PITCHER_URL: { required: true }
    CLUSTER_NAME: { required: true }
    HOMERUN2_K8S_PITCHER_SUSPEND: {}
    HOMERUN2_K8S_PITCHER_NAMESPACE: {}
    HOMERUN2_K8S_PITCHER_TRUST_BUNDLE_CM: {}
    HOMERUN2_K8S_PITCHER_VERSION: {}
  secrets:
    - name: homerun2-k8s-pitcher-remote-sops-secrets
      data:
        HOMERUN2_K8S_PITCHER_AUTH_TOKEN: set-HOMERUN2_K8S_PITCHER_AUTH_TOKEN # pragma: allowlist secret
