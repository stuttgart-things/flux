---
# k8s-pitcher → central omni-pitcher, on a SOPS-only cluster
# → ./apps/homerun2/profiles/k8s-pitcher-remote-sops
#
# THE ALTERNATIVE TO ../homerun2-k8s-pitcher-remote for a cluster with no
# external-secrets: the same child name and profile, the token from this
# Kustomization's substituteFrom Secret (blueprints render-cluster-apps
# generates it from profile.yaml). See ../homerun2-k8s-pitcher-remote for what
# is pitched.
#
# REQUIRES the Secret below, and trust-manager's cluster-trust-bundle when the
# central endpoint has a private CA.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-k8s-pitcher-remote
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${HOMERUN2_K8S_PITCHER_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/profiles/k8s-pitcher-remote-sops
  postBuild:
    substitute:
      # The central omni-pitcher's pitch endpoint, e.g.
      # https://omni-pitcher.homerun2-dev.sthings.lab/pitch. No safe default.
      HOMERUN2_CENTRAL_PITCHER_URL: "${HOMERUN2_CENTRAL_PITCHER_URL:-https://set-HOMERUN2_CENTRAL_PITCHER_URL.invalid/pitch}" # REQUIRED
      # spec.cluster: names this cluster in every message. No safe default.
      CLUSTER_NAME: "${CLUSTER_NAME:-set-CLUSTER_NAME}" # REQUIRED
      # passthrough-override: the component's homerun2-flux is the namespace
      # of a k8s-pitcher beside a full homerun2 stack; alone it is homerun2.
      HOMERUN2_K8S_PITCHER_NAMESPACE: "${HOMERUN2_K8S_PITCHER_NAMESPACE:-homerun2}"
      HOMERUN2_K8S_PITCHER_TRUST_BUNDLE_CM: "${HOMERUN2_K8S_PITCHER_TRUST_BUNDLE_CM:-cluster-trust-bundle}"
      # The kustomize artefact and the image (one variable, both tags). At
      # least v1.4.0 (homerun2-k8s-pitcher#88, #89): an older image ignores the
      # profile's filters, cooldown and rate limit and pitches every Event and
      # every Flux flip.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-k8s-pitcher-kustomize
      HOMERUN2_K8S_PITCHER_VERSION: "${HOMERUN2_K8S_PITCHER_VERSION:-v1.4.0}"
    substituteFrom:
      # substituteFrom-keys: HOMERUN2_K8S_PITCHER_AUTH_TOKEN
      # The CENTRAL omni-pitcher's token -- the same value as that cluster's
      # HOMERUN2_OMNI_PITCHER_AUTH_TOKEN. No default: without it the token
      # Secret renders empty and the apply fails.
      - kind: Secret
        name: ${HOMERUN2_K8S_PITCHER_REMOTE_SOPS_SECRET:-homerun2-k8s-pitcher-remote-sops-secrets}
        optional: false
