---
# clusterscope, lab view → ./apps/clusterscope + four of its components
#
# The same child (clusterscope) as ../clusterscope, with:
#   components/vault-kubeconfigs  the other clusters' kubeconfigs, one
#                                 ExternalSecret from CLUSTERSCOPE_KUBECONFIG_STORE,
#                                 mounted at /kubeconfigs (optional: the pod
#                                 starts without it and shows this cluster only)
#   components/vault-git-auth     git-sync-auth from CLUSTERSCOPE_GIT_SYNC_AUTH_STORE
#                                 (a private repo; ../clusterscope expects the
#                                 Secret supplied)
#   components/config             /etc/clusterscope/config.yaml from
#                                 CLUSTERSCOPE_CONFIG (roots, clusterbooks, ...)
#   components/blackbox-probes    a ScrapeConfig probing every endpoint of
#                                 /api/targets through a blackbox exporter
# and live state and probing switched on (written here: "true" is a YAML bool,
# and postBuild.substitute is map[string]string).
#
# CLUSTERSCOPE_CONFIG IS NOT THREADED: it is one line of JSON, and a `{...}`
# value loses its quotes when this bundle is re-emitted and arrives as a map.
# Set it with a patch on the child, as a literal string:
#   - op: add
#     path: /spec/postBuild/substitute/CLUSTERSCOPE_CONFIG
#     value: '{"roots":[{"path":"/data/<repo>/clusters/<lab>"}]}'
# Unset, the config file renders empty and clusterscope reads no roots.
#
# A Kustomization providing the kubeconfig store is the cluster's; add it to
# dependsOn with a patch where it matters (the volume is optional either way).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clusterscope
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: cilium-gateway
    - name: kube-prometheus-stack
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${CLUSTERSCOPE_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/clusterscope
  components:
    - components/vault-kubeconfigs
    - components/vault-git-auth
    - components/config
    - components/blackbox-probes
  postBuild:
    substitute:
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOSTNAME: "${CLUSTERSCOPE_HOSTNAME:-clusterscope}"
      CLUSTERSCOPE_NAMESPACE: "${CLUSTERSCOPE_NAMESPACE:-clusterscope}"
      # CLUSTERSCOPE_VERSION is NOT threaded, as in ../clusterscope.
      CLUSTERSCOPE_TECH: "${CLUSTERSCOPE_TECH:-flux}"
      CLUSTERSCOPE_LIVE: "true"
      CLUSTERSCOPE_PROBE: "true"

      # ---- the lab -----------------------------------------------------
      # REQUIRED, both. The base defaults them to empty, and an empty
      # substitute value renders as null, which the CRD rejects.
      # passthrough-override: placeholder instead of the base's empty default.
      CLUSTERSCOPE_LAB: "${CLUSTERSCOPE_LAB:-set-CLUSTERSCOPE_LAB}"
      # passthrough-override: same reason as CLUSTERSCOPE_LAB.
      CLUSTERSCOPE_SELF_CLUSTER: "${CLUSTERSCOPE_SELF_CLUSTER:-set-CLUSTERSCOPE_SELF_CLUSTER}"

      # ---- kubeconfigs (components/vault-kubeconfigs) ------------------
      # passthrough-override: the base's empty default means "no directory";
      # components/vault-kubeconfigs mounts at /kubeconfigs.
      CLUSTERSCOPE_KUBECONFIG_DIR: "${CLUSTERSCOPE_KUBECONFIG_DIR:-/kubeconfigs}"
      CLUSTERSCOPE_KUBECONFIG_STORE: "${CLUSTERSCOPE_KUBECONFIG_STORE:-vault-kubeconfigs}"
      # A regexp over the store's entries; the default matches none.
      CLUSTERSCOPE_KUBECONFIG_CLUSTERS: "${CLUSTERSCOPE_KUBECONFIG_CLUSTERS:-^$}"

      # ---- the repository (git-sync) -----------------------------------
      # REQUIRED -- see ../clusterscope.
      GIT_SYNC_REPO: "${CLUSTERSCOPE_GIT_REPO:-https://set-CLUSTERSCOPE_GIT_REPO.invalid}"
      GIT_SYNC_BRANCH: "${CLUSTERSCOPE_GIT_BRANCH:-main}"
      GIT_SYNC_DIR: "${CLUSTERSCOPE_GIT_SYNC_DIR:-/data/repo/clusters}"
      GIT_SYNC_PERIOD: "${CLUSTERSCOPE_GIT_SYNC_PERIOD:-60s}"
      GIT_SYNC_AUTH_SECRET: "${CLUSTERSCOPE_GIT_SYNC_AUTH_SECRET:-git-sync-auth}"
      # REQUIRED (components/vault-git-auth): the store and the key path the
      # git username and token are read from.
      GIT_SYNC_AUTH_STORE: "${CLUSTERSCOPE_GIT_SYNC_AUTH_STORE:-set-GIT_SYNC_AUTH_STORE}"
      GIT_SYNC_AUTH_PATH: "${CLUSTERSCOPE_GIT_SYNC_AUTH_PATH:-set-GIT_SYNC_AUTH_PATH}"
      GIT_SYNC_AUTH_USERNAME_PROPERTY: "${CLUSTERSCOPE_GIT_SYNC_AUTH_USERNAME_PROPERTY:-username}"
      GIT_SYNC_AUTH_PASSWORD_PROPERTY: "${CLUSTERSCOPE_GIT_SYNC_AUTH_PASSWORD_PROPERTY:-password}"

      # ---- config (components/config) ----------------------------------
      # passthrough-override: the base's empty default means "no file";
      # components/config mounts the file here.
      CLUSTERSCOPE_CONFIG_FILE: "${CLUSTERSCOPE_CONFIG_FILE:-/etc/clusterscope/config.yaml}"

      # ---- probes (components/blackbox-probes) -------------------------
      CLUSTERSCOPE_BLACKBOX_MODULE: "${CLUSTERSCOPE_BLACKBOX_MODULE:-http_2xx}"
