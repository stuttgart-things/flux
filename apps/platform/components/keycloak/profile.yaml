---
# AppProfile: what a cluster sets for keycloak, and the Secret it needs.
# Read by blueprints `render-cluster-apps`; kept true by
# hack/check-app-profiles.py (vars and keys) and `kcl vet` (value shapes).
kind: AppProfile
metadata:
  name: keycloak
spec:
  bundle: apps-platform
  component: ../components/keycloak
  vars:
    KEYCLOAK_STORAGE_CLASS: { required: true }
    INFRA_DOMAIN: { required: true }
    KEYCLOAK_HOSTNAME: {}
    KEYCLOAK_NAMESPACE: {}
    KEYCLOAK_VERSION: {}
    KEYCLOAK_SUSPEND: {}
    APPS_CLUSTER_ISSUER: {}
    INFRA_GATEWAY_NAME: {}
    INFRA_GATEWAY_NAMESPACE: {}
  secrets:
    - name: keycloak-secrets
      data:
        ADMIN_USER: admin
        # alnum: the release quotes it, but the chart may still put it into a
        # URL, env var or config file where ! # % would need escaping.
        ADMIN_PASSWORD: { generate: { type: alnum, length: 32 } }
