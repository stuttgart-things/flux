---
# MinIO → ./apps/minio
#
# dependsOn cilium-gateway: the httproute component renders two routes, API and
# console, which are separate hostnames on purpose -- the console redirects to
# the API and a single host breaks uploads in ways that look like a client bug.
#
# REQUIRES a StorageClass that exists here, and a Secret with
# MINIO_ADMIN_USER / MINIO_ADMIN_PASSWORD.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: cilium-gateway
    # AND cert-manager-install, like rancher and vault beside it: the base
    # renders a Certificate through the sthings-cluster chart, and a Certificate
    # applied before cert-manager's webhook is serving fails the Helm install
    # outright:
    #
    #   Internal error occurred: failed calling webhook "webhook.cert-manager.io"
    #
    # A failed HelmRelease then goes Stalled and does NOT retry on its own, so
    # what looks like a startup race becomes a permanent failure that needs
    # `flux reconcile helmrelease --force`. minio was the only one of the three
    # missing this.
    - name: cert-manager-install
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${MINIO_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/minio
  components:
    - ./components/httproute
  postBuild:
    substitute:
      MINIO_NAMESPACE: "${MINIO_NAMESPACE:-minio}"
      # THREADED, not set: the default is the base's own, so this pins nothing
      # and moves with it -- but a cluster that must stay on chart 16 now has a
      # line to write, and before this it did not. Setting MINIO_VERSION on the
      # apps-platform Kustomization did nothing at all, silently, because a child
      # cannot inherit what it does not name.
      #
      # That matters here more than elsewhere. Renovate carried this base from
      # 16.0.10 to 17.0.21 and the caveat below is still unaddressed, so any
      # consumer moving its source pin across that release takes chart 17 with
      # it -- and gets a console that cannot be pulled while the server keeps
      # serving and the HelmRelease reports installed.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/minio/minio
      MINIO_VERSION: "${MINIO_VERSION:-17.0.21}"
      # REGISTRY, REPOSITORY and IMAGE_TAG are deliberately NOT set here.
      # The image stays at ghcr.io/stuttgart-things/minio:2025.4.22-debian-12-r1,
      # which is what platform-sthings runs -- and that is a CHOICE, not lag: it
      # predates MinIO's licence change. Newer is not better here. Do not
      # "update" it because a higher number exists.
      #
      # Chart 17 is the base's default now, and this is what a cluster on it
      # runs into: 17 splits the console into its own deployment with its own
      # image, and the base parameterises the registry globally but not that
      # repository, so it resolves to ghcr.io/bitnami/minio-object-browser and
      # cannot be pulled. The mirror does carry
      # ghcr.io/stuttgart-things/minio-object-browser:2.0.2-debian-12-r3, so 17
      # is reachable -- it needs the console repository set as well, which is a
      # licence decision first and a config change second. Until somebody makes
      # it, a cluster that cares pins MINIO_VERSION to 16.0.10.
      MINIO_INGRESS_ENABLED: "false"
      MINIO_INGRESS_CLASS: "${MINIO_INGRESS_CLASS:-nginx}"
      # REQUIRED. A PVC that never binds leaves the pod Pending while the
      # HelmRelease reports installed.
      # passthrough-override: the base names `nfs4-csi`, which exists in one lab
      # and nowhere else. A StorageClass that is merely absent binds nothing and
      # says nothing, so the placeholder is the louder failure.
      STORAGE_CLASS: "${MINIO_STORAGE_CLASS:-set-MINIO_STORAGE_CLASS}"
      # passthrough-override: the platform bundle sizes minio for a cluster, the
      # app's own default is the single-app minimum.
      MINIO_STORAGE_SIZE: "${MINIO_STORAGE_SIZE:-20Gi}"
      CLUSTER_ISSUER: "${APPS_CLUSTER_ISSUER:-cluster-ca}"
      INGRESS_HOSTNAME_API: "${MINIO_HOSTNAME_API:-minio}"
      INGRESS_HOSTNAME_CONSOLE: "${MINIO_HOSTNAME_CONSOLE:-minio-console}"
      INGRESS_DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
    substituteFrom:
      # substituteFrom-keys: MINIO_ADMIN_USER, MINIO_ADMIN_PASSWORD
      # optional: false guards the SOURCE, not the KEYS. Flux fails this
      # Kustomization when the Secret is absent -- and substitutes an empty
      # string for any key the Secret does not carry, with no error at all. A
      # Secret that exists but is missing one of the names below produces
      # exactly the outcome the paragraph above warns about. See #331.
      - kind: Secret
        name: ${MINIO_SECRET:-minio-secrets}
        optional: false
