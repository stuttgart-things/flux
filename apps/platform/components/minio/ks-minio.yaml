---
# MinIO → ./apps/minio
#
# dependsOn cilium-gateway: the httproute component renders two routes, API and
# console, which are separate hostnames on purpose -- the console redirects to
# the API and a single host breaks uploads in ways that look like a client bug.
#
# REQUIRES a StorageClass that exists here, and a Secret with
# MINIO_ADMIN_USER / MINIO_ADMIN_PASSWORD.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: cilium-gateway
    # AND cert-manager-install, like rancher and vault beside it: the base
    # renders a Certificate through the sthings-cluster chart, and a Certificate
    # applied before cert-manager's webhook is serving fails the Helm install
    # outright:
    #
    #   Internal error occurred: failed calling webhook "webhook.cert-manager.io"
    #
    # A failed HelmRelease then goes Stalled and does NOT retry on its own, so
    # what looks like a startup race becomes a permanent failure that needs
    # `flux reconcile helmrelease --force`. minio was the only one of the three
    # missing this.
    - name: cert-manager-install
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: false
  prune: true
  suspend: ${MINIO_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/minio
  components:
    - ./components/httproute
  postBuild:
    substitute:
      MINIO_NAMESPACE: "${MINIO_NAMESPACE:-minio}"
      # CHART, REGISTRY, REPOSITORY and IMAGE_TAG are deliberately NOT set here.
      # The base defaults to chart 16.0.10 with
      # ghcr.io/stuttgart-things/minio:2025.4.22-debian-12-r1, which is what
      # platform-sthings runs -- and that is a CHOICE, not lag: it predates
      # MinIO's licence change. Newer is not better here. Do not "update" this
      # because a higher number exists.
      #
      # I overrode it with chart 17.0.21 and the console failed to pull. Chart
      # 17 splits the console into its own deployment with its own image, and
      # the base parameterises the registry globally but not that repository,
      # so it resolved to ghcr.io/bitnami/minio-object-browser. The mirror does
      # carry ghcr.io/stuttgart-things/minio-object-browser:2.0.2-debian-12-r3,
      # so chart 17 is reachable -- it needs the console repository set too.
      # That is a licence decision first and a config change second.
      MINIO_INGRESS_ENABLED: "false"
      MINIO_INGRESS_CLASS: "${MINIO_INGRESS_CLASS:-nginx}"
      # REQUIRED. A PVC that never binds leaves the pod Pending while the
      # HelmRelease reports installed.
      STORAGE_CLASS: "${MINIO_STORAGE_CLASS:-set-MINIO_STORAGE_CLASS}"
      # passthrough-override: the platform bundle sizes minio for a cluster, the
      # app's own default is the single-app minimum.
      MINIO_STORAGE_SIZE: "${MINIO_STORAGE_SIZE:-20Gi}"
      CLUSTER_ISSUER: "${APPS_CLUSTER_ISSUER:-cluster-ca}"
      INGRESS_HOSTNAME_API: "${MINIO_HOSTNAME_API:-minio}"
      INGRESS_HOSTNAME_CONSOLE: "${MINIO_HOSTNAME_CONSOLE:-minio-console}"
      INGRESS_DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
    substituteFrom:
      - kind: Secret
        name: ${MINIO_SECRET:-minio-secrets}
        optional: false
