---
# sthings-portal-routes -- the HTTPRoute for sthings-portal → ./apps/sthings-portal/route
#
# A Kustomization of its own that waits for sthings-portal, because Cilium
# resolves a route's backendRefs once: applied before its Service exists, a
# route serves HTTP 500 for good while every Kustomization reports Ready.
#
# The host is the one homerun2-portal-routes serves by default
# (portal.<INFRA_DOMAIN>). Select one of the two portals per host, never both:
# two routes for one host and path are a conflict the Gateway settles by age.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sthings-portal-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: sthings-portal
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${STHINGS_PORTAL_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/sthings-portal/route
  postBuild:
    substitute:
      STHINGS_PORTAL_NAMESPACE: "${STHINGS_PORTAL_NAMESPACE:-homerun2}"
      # Also in the redirect URL (ks-sthings-portal.yaml) and at the provider:
      # the OIDC client is registered for exactly this origin.
      STHINGS_PORTAL_HOST: "${STHINGS_PORTAL_HOSTNAME:-portal}.${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED (INFRA_DOMAIN)
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
