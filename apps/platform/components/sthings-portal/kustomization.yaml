---
# sthings-portal -- one web frontend for the services behind it (status, and
# each service UI under /<key>/ through its reverse proxy), with login through
# an OIDC provider (ZITADEL) and local users as emergency access. The
# successor of homerun2-portal; the same host by default, so select one of
# the two.
#
# REQUIRES, in STHINGS_PORTAL_NAMESPACE: the namespace, the Secret
# STHINGS_PORTAL_AUTH_SECRET (created by hand: users, session-key,
# oidc-client-secret) and the CA ConfigMap (default: trust-manager's
# cluster-trust-bundle). Reloader to roll the pod on a change. See
# apps/sthings-portal/README.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ks-sthings-portal.yaml
  - ks-sthings-portal-routes.yaml
