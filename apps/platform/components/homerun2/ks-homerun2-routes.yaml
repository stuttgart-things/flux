---
# homerun2-routes -- the HTTPRoutes for homerun2 → ./apps/homerun2/profiles/platform-routes
#
# A Kustomization of its own that waits for homerun2, because Cilium resolves
# a route's backendRefs once: applied before its Service exists, a route
# serves HTTP 500 for good while every Kustomization reports Ready. homerun2
# is Ready only when its children are -- and their Services with them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-routes
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: homerun2
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${HOMERUN2_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/profiles/platform-routes
  postBuild:
    substitute:
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      HOMERUN2_OMNI_PITCHER_HOSTNAME: "${HOMERUN2_OMNI_PITCHER_HOSTNAME:-omni-pitcher}"
      HOMERUN2_CORE_CATCHER_HOSTNAME: "${HOMERUN2_CORE_CATCHER_HOSTNAME:-core-catcher}"
      HOMERUN2_SCOUT_HOSTNAME: "${HOMERUN2_SCOUT_HOSTNAME:-scout}"
      HOMERUN2_LED_CATCHER_HOSTNAME: "${HOMERUN2_LED_CATCHER_HOSTNAME:-led-catcher}"
