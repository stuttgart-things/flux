---
# homerun2-redis -- the homerun2 namespace and redis-stack
# → ./apps/homerun2/root
#
# Its own Kustomization so the apps in homerun2 start against a redis that
# already answers: `wait: true` holds this one until the HelmRelease is Ready,
# which the chart reports only once redis is.
#
# CREDENTIAL MODE is HOMERUN2_SECRETS: `eso` (the default -- redis-password
# from ${HOMERUN2_SECRET_PATH} in a ClusterSecretStore, nothing
# credential-shaped through Flux) or `sops` (the value comes from the
# substituteFrom Secret below). It selects the variant directory of every
# component in the list, so the whole bundle moves with one line.
#
# REQUIRES a StorageClass, and on the eso path external-secrets and a store.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-redis
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: cilium-gateway
    # The ExternalSecret CRDs. Only the eso path renders ExternalSecrets, but
    # Flux has no optional dependency: pointed at a Kustomization the cluster
    # does not have, this one parks on "dependency not ready" forever. A sops
    # cluster therefore renames it to one it does have -- any Kustomization
    # that reconciles before homerun2 will do.
    - name: ${HOMERUN2_SECRETS_DEPENDS_ON:-external-secrets}
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  force: false
  prune: true
  suspend: ${HOMERUN2_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/root
  components:
    # Both values are built by hack/check-component-lists.py, so a
    # component with an eso/ and no sops/ fails the pull request
    # rather than the one cluster that selects sops.
    # component-switch: HOMERUN2_SECRETS = eso sops
    - ../components/redis-stack
    - ../components/redis-stack/${HOMERUN2_SECRETS:-eso}
  postBuild:
    # The sops path's values. On the eso path -- the default -- no such Secret
    # exists, which is why this is optional; a cluster setting
    # HOMERUN2_SECRETS: sops sets HOMERUN2_SECRETS_FROM_OPTIONAL: "false" with
    # it, so a missing Secret fails loudly instead of substituting empty
    # strings and installing a redis with no password that reports Ready.
    substituteFrom:
      - kind: Secret
        name: ${HOMERUN2_SECRETS_FROM:-homerun2-secrets-subst}
        optional: ${HOMERUN2_SECRETS_FROM_OPTIONAL:-true}
    substitute:
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      # No safe default: stores are named per cluster (vault-<cluster>).
      HOMERUN2_SECRET_STORE: "${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}"
      HOMERUN2_SECRET_PATH: "${HOMERUN2_SECRET_PATH:-homerun2}"
      # Held at 17.1.4 on purpose and without a renovate line: every consumer
      # runs 17.1.4, and the 22.x default this replaced was never installed
      # anywhere (its non-Bitnami images need allowInsecureImages).
      HOMERUN2_REDIS_VERSION: "${HOMERUN2_REDIS_VERSION:-17.1.4}"
      # passthrough-override: no StorageClass is safe to guess -- the base's
      # "standard" exists on almost no cluster here, and a PVC that never binds
      # reads as a slow redis. A sentinel names the variable to set.
      HOMERUN2_REDIS_STORAGE_CLASS: "${HOMERUN2_REDIS_STORAGE_CLASS:-set-HOMERUN2_REDIS_STORAGE_CLASS}"
      HOMERUN2_REDIS_STORAGE_SIZE: "${HOMERUN2_REDIS_STORAGE_SIZE:-8Gi}"
