---
# the homerun2 smoke test as a Job → ./apps/homerun2/smoke-test
#
# Ready only once the Job completed, so a red Kustomization here is a failed
# test, not a failed apply: `kubectl -n homerun2 logs job/homerun2-smoke-test`.
# Changing anything re-runs it (the Job carries force), and so does a
# component version bump: the versions below land in the pod template. Add the optional
# components' probes to HOMERUN2_SMOKE_PROBES when they are selected.
#
# REQUIRES ../homerun2, and waits on its homerun2-routes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-smoke-test
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: homerun2-routes
  interval: 1h
  retryInterval: 1m
  timeout: 20m
  force: false
  prune: true
  suspend: ${HOMERUN2_SMOKE_TEST_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/homerun2/smoke-test
  postBuild:
    substitute:
      # INFRA_* are what infra/platform already reads, so a cluster sets them once.
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      HOMERUN2_OMNI_PITCHER_HOSTNAME: "${HOMERUN2_OMNI_PITCHER_HOSTNAME:-omni-pitcher}"
      # Through the gateway, <hostname>/<path>, comma-separated without spaces.
      HOMERUN2_SMOKE_EXTERNAL_PROBES: "${HOMERUN2_SMOKE_EXTERNAL_PROBES:-omni-pitcher/health,core-catcher/health,scout/health,led-catcher/healthz}"
      HOMERUN2_SMOKE_PROBES: "${HOMERUN2_SMOKE_PROBES:-homerun2-core-catcher/health,homerun2-scout/health,homerun2-led-catcher/healthz}"
      # ---- versions: re-run the test when one changes -------------------
      # A Job's pod template is immutable and carries force, so a changed
      # annotation below recreates the Job. Without these the test ran once
      # per bundle change to the Job itself: a component bump went unprobed.
      # Copies of the app components' own, bumped with them by renovate; an
      # unselected component only costs a needless re-run.
      HOMERUN2_REDIS_VERSION: "${HOMERUN2_REDIS_VERSION:-17.1.4}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-omni-pitcher-kustomize
      HOMERUN2_OMNI_PITCHER_VERSION: "${HOMERUN2_OMNI_PITCHER_VERSION:-v2.1.3}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher-kustomize
      HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION:-v1.0.3}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher
      HOMERUN2_CORE_CATCHER_VERSION: "${HOMERUN2_CORE_CATCHER_VERSION:-v1.0.3}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout-kustomize
      HOMERUN2_SCOUT_KUSTOMIZE_VERSION: "${HOMERUN2_SCOUT_KUSTOMIZE_VERSION:-v0.8.2}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout
      HOMERUN2_SCOUT_VERSION: "${HOMERUN2_SCOUT_VERSION:-v0.8.2}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-led-catcher-kustomize
      HOMERUN2_LED_CATCHER_VERSION: "${HOMERUN2_LED_CATCHER_VERSION:-v0.7.0}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-demo-pitcher-kustomize
      HOMERUN2_DEMO_PITCHER_VERSION: "${HOMERUN2_DEMO_PITCHER_VERSION:-v2.0.1}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher-kustomize
      HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION: "${HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION:-v1.1.4}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher
      HOMERUN2_LIGHT_CATCHER_VERSION: "${HOMERUN2_LIGHT_CATCHER_VERSION:-v1.1.4}"
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-wled-mock-kustomize
      HOMERUN2_WLED_MOCK_VERSION: "${HOMERUN2_WLED_MOCK_VERSION:-v1.1.4}"
