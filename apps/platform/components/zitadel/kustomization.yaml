---
# zitadel -- the lab IdP: PostgreSQL, ZITADEL with the Login UI v2, and its
# HTTPRoute applied after it (zitadel-httproute).
#
# REQUIRES a StorageClass that exists here (ZITADEL_STORAGE_CLASS) and a SOPS
# Secret zitadel-secrets in flux-system (masterkey, DB passwords, initial admin
# password). The route attaches to the cilium-gateway's wildcard listener.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ks-zitadel.yaml
  - ks-zitadel-httproute.yaml
