---
# zitadel-httproute -- the HTTPRoute for zitadel → ./apps/zitadel/components/httproute
#
# A Kustomization of its own that waits for zitadel, because Cilium resolves a
# route's backendRefs once: applied before its Services exist, a route serves
# HTTP 500 for good while every Kustomization reports Ready. Same split as
# openbao-httproute.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: zitadel
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${ZITADEL_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/zitadel/components/httproute
  postBuild:
    substitute:
      ZITADEL_NAMESPACE: "${ZITADEL_NAMESPACE:-zitadel}"
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      ZITADEL_DOMAIN: "${ZITADEL_HOSTNAME:-zitadel}.${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED (INFRA_DOMAIN)
