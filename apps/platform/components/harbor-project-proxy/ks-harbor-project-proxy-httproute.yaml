---
# harbor-project-proxy-httproute -- the wildcard route *.<harbor host>
# → ./apps/harbor/components/httproute-project-proxy
#
# A Kustomization of its own that waits for harbor-project-proxy, because
# Cilium resolves a route's backendRefs once: applied before the Service
# exists, the route serves HTTP 500 for good while every Kustomization reports
# Ready (see minio-httproute). The wildcard DNS name and certificate SAN come
# from harbor itself (pre-release.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-project-proxy-httproute
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: apps
    kustomization.stuttgart-things.com/bundle: apps-platform
spec:
  dependsOn:
    - name: harbor-project-proxy
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${HARBOR_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${APPS_SOURCE:-flux-apps}
  path: ./apps/harbor/components/httproute-project-proxy
  postBuild:
    substitute:
      HARBOR_NAMESPACE: "${HARBOR_NAMESPACE:-harbor}"
      HARBOR_HOSTNAME: "${HARBOR_HOSTNAME:-harbor}"
      HARBOR_DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
