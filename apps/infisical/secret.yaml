---
# The chart reads its root configuration from this Secret (infisical.kubeSecretRef)
# via envFrom. ENCRYPTION_KEY encrypts every stored secret: lose or change it and
# the data is unreadable -- generate it once and keep it.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: ${INFISICAL_NAMESPACE:-infisical}
type: Opaque
stringData:
  # 16 random bytes, hex (openssl rand -hex 16)
  ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
  # 32 random bytes, base64 (openssl rand -base64 32)
  AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
  SITE_URL: "https://${HOSTNAME}.${DOMAIN}"
