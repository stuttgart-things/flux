---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-configuration
  namespace: ${BACKSTAGE_NAMESPACE:-portal}
spec:
  interval: 30m
  chart:
    spec:
      chart: sthings-cluster
      version: 0.3.20
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
      interval: 12h
  values:
    configmaps:
      backstage-app-config:
        name: backstage-app-config
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
        app-config.extra.yaml: |
          app:
            title: $${APP_TITLE:-Backstage}
            baseUrl: $${APP_BASE_URL}
          organization:
            name: $${ORGANIZATION_NAME}
          backend:
            auth:
              keys:
                - secret: $${BACKEND_SECRET:-change-me-in-production}
              externalAccess:
                - type: static
                  options:
                    token: $${EXTERNAL_ACCESS_TOKEN}
                    subject: dapr-workflow-service
                  accessRestrictions:
                    - plugin: scaffolder
                    - plugin: catalog
            baseUrl: $${BACKEND_BASE_URL:-http://localhost:7007}
            listen:
              port: $${BACKEND_PORT:-7007}
            csp:
              connect-src: ["'self'", 'http:', 'https:']
            cors:
              origin: $${CORS_ORIGIN:-http://localhost:3000}
              methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
              credentials: true
            database:
              client: pg
              connection:
                host: $${POSTGRES_HOST}
                port: $${POSTGRES_PORT:-5432}
                user: $${POSTGRES_USER}
                password: $${POSTGRES_PASSWORD}
              plugin:
                # Roadie RAG-AI (sthings-backstage >= v1.9.0) keeps its
                # embeddings in its own pgvector Postgres, apps/backstage-rag-postgres.
                # Only used when ragAi.enabled is true.
                rag-ai:
                  client: pg
                  # CNPG creates the database; the owner has no CREATEDB.
                  ensureExists: false
                  connection:
                    host: ${BACKSTAGE_RAG_PG_HOST:-rag-postgres-rw}
                    port: ${BACKSTAGE_RAG_PG_PORT:-5432}
                    database: ${BACKSTAGE_RAG_PG_DATABASE:-backstage_rag}
                    user: $${RAG_PG_USER:-rag}
                    password: $${RAG_PG_PASSWORD:-}
            # RAG-AI is optional: without rag-postgres or the LLM API key the
            # backend starts without it instead of failing.
            startup:
              plugins:
                rag-ai:
                  onPluginBootFailure: continue
                  modules:
                    llm:
                      onPluginModuleBootFailure: continue
          integrations:
            github:
              - host: github.com
                token: $${GITHUB_TOKEN}
          proxy:
            endpoints:
              '/claim-machinery':
                target: $${CLAIM_MACHINERY_API_URL:-https://claim-api.example.com}
                changeOrigin: true
                secure: false
                pathRewrite:
                  '^/api/proxy/claim-machinery': ''
                allowedHeaders: ['*']
                credentials: 'dangerously-allow-unauthenticated'
              '/machinery':
                target: $${MACHINERY_URL:-https://machinery.example.com}
                changeOrigin: true
                secure: false
                pathRewrite:
                  '^/api/proxy/machinery': ''
                allowedHeaders: ['*']
                credentials: 'dangerously-allow-unauthenticated'
          # TechDocs: built in the pod by default. builder external + publisher
          # awsS3 reads docs that CI built and uploaded instead (the techdocs
          # Dagger module); see the README, "Optional: TechDocs from CI".
          techdocs:
            builder: '${BACKSTAGE_TECHDOCS_BUILDER:-local}'
            generator:
              runIn: 'local'
            publisher:
              type: '${BACKSTAGE_TECHDOCS_PUBLISHER:-local}'
              # Only read with type awsS3.
              awsS3:
                bucketName: '${BACKSTAGE_TECHDOCS_S3_BUCKET:-techdocs}'
                endpoint: '${BACKSTAGE_TECHDOCS_S3_ENDPOINT:-}'
                region: '${BACKSTAGE_TECHDOCS_S3_REGION:-us-east-1}'
                # MinIO serves buckets by path, not by virtual host.
                s3ForcePathStyle: true
                credentials:
                  accessKeyId: $${TECHDOCS_S3_ACCESS_KEY_ID:-}
                  secretAccessKey: $${TECHDOCS_S3_SECRET_ACCESS_KEY:-}
          auth:
            environment: development
            providers:
              guest: {}
              github:
                development:
                  clientId: $${GITHUB_CLIENT_ID}
                  clientSecret: $${GITHUB_CLIENT_SECRET}
                  signIn:
                    resolvers:
                      - resolver: usernameMatchingUserEntityName
          scaffolder: {}
          claimMachinery:
            apiUrl: $${CLAIM_MACHINERY_API_URL:-https://claim-api.example.com}
          catalog:
            import:
              entityFilename: catalog-info.yaml
              pullRequestBranchName: backstage-integration
            rules:
              - allow: [Component, System, API, Resource, Location, Template]
            locations: []
          kubernetes:
            serviceLocatorMethod:
              type: multiTenant
            clusterLocatorMethods:
              - type: localKubectlProxy
          permission:
            enabled: true
          # Roadie RAG-AI: questions on catalog and TechDocs ("Ask AI" in the
          # sidebar). Off unless BACKSTAGE_RAG_AI_ENABLED=true. Chat and
          # embeddings go to OpenRouter's free models by default. See the
          # sthings-backstage README "RAG-AI".
          ragAi:
            enabled: ${BACKSTAGE_RAG_AI_ENABLED:-false}
            llm:
              baseUrl: ${BACKSTAGE_LLM_BASE_URL:-https://openrouter.ai/api/v1}
              apiKey: $${LLM_API_KEY:-}
              # Most reliable first; OpenRouter falls back to the next ones.
              models: ${BACKSTAGE_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free}
              maxTokens: ${BACKSTAGE_LLM_MAX_TOKENS:-4000}
          ai:
            supportedSources: ['catalog', 'tech-docs']
            prompts:
              prefix: >-
                You answer questions about the stuttgart-things platform from the
                Backstage catalog entities and TechDocs pages given below. Answer in the
                language of the question. If the documents do not contain the answer,
                say so; do not make up components, URLs or commands. A virtual machine
                is a Resource entity of type vm or a host listed as a VM in the system
                inventory; Scaffolder templates, catalog locations and VM templates are
                not VMs. For counts, prefer a document that states the number over
                counting entities, and say when the documents may be incomplete. Documents:
            embeddings:
              chunkSize: 1000
              chunkOverlap: 200
              # Free OpenRouter models allow 20 requests/minute.
              concurrencyLimit: 2
              openai:
                openAiBaseUrl: ${BACKSTAGE_LLM_BASE_URL:-https://openrouter.ai/api/v1}
                openAiApiKey: $${LLM_API_KEY:-}
                # Changing the model changes the vector size: truncate the
                # embeddings table and re-index afterwards.
                modelName: ${BACKSTAGE_LLM_EMBEDDINGS_MODEL:-nvidia/nemotron-3-embed-1b:free}
                # nemotron-3-embed-1b:free takes at most 256 texts per request.
                batchSize: 128
            storage:
              pgVector:
                # Chunks per question handed to the model. 6 keeps prompts small
                # for the free OpenRouter models; a local model with a larger
                # context can take more (harvester#526: 6 chunks hid a VM).
                amount: ${BACKSTAGE_RAG_AI_AMOUNT:-6}
    secrets:
      backstage-secrets:
        name: backstage-secrets
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
        secretKVs:
          APP_TITLE: ${BACKSTAGE_APP_TITLE:-Stuttgart Things Backstage}
          ORGANIZATION_NAME: ${BACKSTAGE_ORGANIZATION_NAME:-stuttgart-things}
          APP_BASE_URL: https://backstage.${DOMAIN}
          BACKEND_BASE_URL: https://backstage.${DOMAIN}
          CORS_ORIGIN: https://backstage.${DOMAIN}
          # Targets of the /claim-machinery and /machinery proxies (machinery:
          # the live XR inventory the MachineryClaimPicker reads).
          # Overridable, because the hosts are decided by whoever deploys
          # those two APIs, not by this chart.
          CLAIM_MACHINERY_API_URL: ${BACKSTAGE_CLAIM_MACHINERY_API_URL:-https://claim-api.${DOMAIN}}
          MACHINERY_URL: ${BACKSTAGE_MACHINERY_URL:-https://machinery.${DOMAIN}}
          AUTH_ENVIRONMENT: development
          GITHUB_TOKEN: ${BACKSTAGE_GITHUB_TOKEN}
          GITHUB_CLIENT_ID: ${BACKSTAGE_GITHUB_CLIENT_ID}
          GITHUB_CLIENT_SECRET: ${BACKSTAGE_GITHUB_CLIENT_SECRET}
          BACKEND_SECRET: ${BACKSTAGE_BACKEND_SECRET}
          EXTERNAL_ACCESS_TOKEN: ${BACKSTAGE_EXTERNAL_ACCESS_TOKEN}
          # ZITADEL OIDC client (see sthings-backstage#82 + zitadel-config TF module).
          # Empty defaults so unset BACKSTAGE_ZITADEL_* doesn't break substitution
          # in clusters that don't (yet) provision the secret.
          ZITADEL_ISSUER: ${BACKSTAGE_ZITADEL_ISSUER:-}
          ZITADEL_CLIENT_ID: ${BACKSTAGE_ZITADEL_CLIENT_ID:-}
          ZITADEL_CLIENT_SECRET: ${BACKSTAGE_ZITADEL_CLIENT_SECRET:-}
          # RAG-AI chat + embeddings key. Empty default: RAG-AI stays off
          # (or reports 503) without it, the rest of Backstage is unaffected.
          LLM_API_KEY: "${BACKSTAGE_LLM_API_KEY:-}"
          # Read-only S3 user for TechDocs from CI (publisher awsS3). Empty
          # defaults: unused with the default local publisher.
          TECHDOCS_S3_ACCESS_KEY_ID: "${BACKSTAGE_TECHDOCS_S3_ACCESS_KEY_ID:-}"
          TECHDOCS_S3_SECRET_ACCESS_KEY: "${BACKSTAGE_TECHDOCS_S3_SECRET_ACCESS_KEY:-}"
