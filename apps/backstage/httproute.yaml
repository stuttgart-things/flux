---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-httproute
  namespace: ${BACKSTAGE_NAMESPACE:-portal}
spec:
  # The route must not exist before the Service it points at.
  #
  # Cilium resolves a backendRef ONCE, when it admits the route. Created first,
  # the route is admitted with ResolvedRefs=False / BackendNotFound and STAYS
  # there after the Service appears seconds later -- nothing re-resolves it. The
  # Gateway keeps reporting Programmed, the HelmRelease reports installed, the
  # Kustomization reports Ready, and the hostname answers 500 forever. The cure
  # is a no-op annotation on the route, which is not something anybody thinks to
  # try on a green cluster.
  #
  # Measured on sthings-platform's first install: Service created 3m26s before
  # the route was still called "not found".
  dependsOn:
    - name: backstage-deployment
      namespace: ${BACKSTAGE_NAMESPACE:-portal}
  interval: 30m
  chart:
    spec:
      chart: sthings-cluster
      version: 0.3.20
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
      interval: 12h
  values:
    customresources:
      backstage-referencegrant:
        apiVersion: gateway.networking.k8s.io/v1beta1
        kind: ReferenceGrant
        metadata:
          name: backstage-gateway-access
          namespace: ${BACKSTAGE_NAMESPACE:-portal}
          labels:
            app.kubernetes.io/name: backstage
            app.kubernetes.io/instance: backstage
        spec:
          from:
            - group: gateway.networking.k8s.io
              kind: Gateway
              namespace: ${GATEWAY_NAMESPACE:-default}
          to:
            - group: ""
              kind: Service
      backstage-httproute:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: backstage
          namespace: ${BACKSTAGE_NAMESPACE:-portal}
          labels:
            app.kubernetes.io/name: backstage
            app.kubernetes.io/instance: backstage
        spec:
          hostnames:
            - backstage.${DOMAIN}
          parentRefs:
            - name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: backstage-deployment
                  namespace: ${BACKSTAGE_NAMESPACE:-portal}
                  port: 7007
