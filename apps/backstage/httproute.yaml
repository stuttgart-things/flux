---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-httproute
  namespace: ${BACKSTAGE_NAMESPACE:-portal}
spec:
  # The route must not exist before the Service it points at -- on a cluster
  # without the Gateway API TLSRoute CRD.
  #
  # cilium-operator lists TLSRoutes on every Service event without checking
  # that the CRD exists (cilium/cilium#47819, closed upstream without a fix).
  # With only the standard-channel CRDs installed that list fails, so a route
  # created before its Service stays ResolvedRefs=False / BackendNotFound and
  # the hostname answers 500 while everything else reports Ready
  # (stuttgart-things/stuttgart-things#4643). Measured on sthings-platform's
  # first install: Service created 3m26s before the route was still "not
  # found"; a no-op annotation on the route cured it.
  #
  # The fix is the experimental TLSRoute CRD plus a cilium-operator restart;
  # all six lab clusters have it since 2026-11-16 (see their READMEs). This
  # ordering stays for clusters that are set up without it.
  dependsOn:
    - name: backstage-deployment
      namespace: ${BACKSTAGE_NAMESPACE:-portal}
  interval: 30m
  chart:
    spec:
      chart: sthings-cluster
      version: 0.3.20
      sourceRef:
        kind: HelmRepository
        name: stuttgart-things
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
      interval: 12h
  values:
    customresources:
      backstage-referencegrant:
        apiVersion: gateway.networking.k8s.io/v1beta1
        kind: ReferenceGrant
        metadata:
          name: backstage-gateway-access
          namespace: ${BACKSTAGE_NAMESPACE:-portal}
          labels:
            app.kubernetes.io/name: backstage
            app.kubernetes.io/instance: backstage
        spec:
          from:
            - group: gateway.networking.k8s.io
              kind: Gateway
              namespace: ${GATEWAY_NAMESPACE:-default}
          to:
            - group: ""
              kind: Service
      backstage-httproute:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: backstage
          namespace: ${BACKSTAGE_NAMESPACE:-portal}
          labels:
            app.kubernetes.io/name: backstage
            app.kubernetes.io/instance: backstage
        spec:
          hostnames:
            - backstage.${DOMAIN}
          parentRefs:
            - name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: backstage-deployment
                  namespace: ${BACKSTAGE_NAMESPACE:-portal}
                  port: 7007
