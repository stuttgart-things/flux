---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-deployment
  namespace: ${BACKSTAGE_NAMESPACE:-portal}
spec:
  dependsOn:
    - name: backstage-configuration
      namespace: ${BACKSTAGE_NAMESPACE:-portal}
  interval: 30m
  valuesFrom:
    # The image tag, when it is a NUMBER: Helm reads `260218.1436` from a
    # substituted value as a float and installs `2.602181436e+08`. Read from a
    # ConfigMap with targetPath it stays a string.
    #
    # optional, because that is a problem only some tags have. A cluster that
    # runs a `v1.5.1` sets BACKSTAGE_IMAGE_TAG and never creates this ConfigMap
    # -- and without `optional: true` the HelmRelease then fails outright on a
    # ConfigMap it does not need. The ConfigMap still WINS where it exists, so
    # nothing changes for a cluster that has one.
    - kind: ConfigMap
      name: backstage-helm-overrides
      valuesKey: imageTag
      targetPath: backstage.image.tag
      optional: true
  chart:
    spec:
      chart: backstage
      # renovate: datasource=docker depName=ghcr.io/backstage/charts/backstage
      version: ${BACKSTAGE_VERSION:-2.10.0}
      sourceRef:
        kind: HelmRepository
        name: backstage
        namespace: ${BACKSTAGE_NAMESPACE:-portal}
      interval: 12h
  values:
    global:
      storageClass: ${BACKSTAGE_STORAGE_CLASS:-nfs4-csi}
    ingress:
      enabled: false
    postgresql:
      enabled: true
      auth:
        username: backstage
        password: ${BACKSTAGE_POSTGRESQL_PASSWORD}
      architecture: standalone
    backstage:
      # Stakater Reloader: roll the Deployment when any referenced Secret/
      # ConfigMap (backstage-secrets, app-config, catalog) changes. No-op on
      # clusters without the Reloader controller (see infra/reloader).
      annotations:
        reloader.stakater.com/auto: "true"
      replicas: ${BACKSTAGE_REPLICAS:-1}
      # Generous startup budget so the first-boot catalog DB migration (against a
      # fresh Postgres) can finish before liveness kicks in. The chart default
      # startupProbe only allows ~30s (failureThreshold 3 x periodSeconds 10),
      # which the first migration overruns -> one SIGKILL/restart. failureThreshold
      # 30 x 10s = up to ~5m. Liveness stays tight for fast detection once running.
      startupProbe:
        httpGet:
          path: /.backstage/health/v1/liveness
          port: 7007
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: ${BACKSTAGE_STARTUP_FAILURE_THRESHOLD:-30}
        successThreshold: 1
      # The container shipped with `resources: {}` -- no requests and no limits.
      #
      # That is BestEffort: the scheduler counts this pod as costing nothing, so
      # it is placed on a node that cannot hold it, and it is the FIRST thing
      # evicted under memory pressure. On the single-node clusters this bundle
      # targets, that node is also running Rancher and kube-prometheus-stack.
      #
      # NODE_OPTIONS below is the other half and cannot be left out: V8 sizes
      # its default heap from the machine's physical memory, not from the cgroup
      # limit, so a Node process on a 16 GB node happily grows past a 1Gi limit
      # and is OOMKilled instead of collecting garbage. The limit alone converts
      # a node-wide incident into a crash loop; the two together make it neither.
      #
      # 768 is ~75% of the 1Gi default, the usual headroom for buffers, stacks
      # and the non-heap parts of the runtime. A cluster raising
      # BACKSTAGE_MEMORY_LIMIT should raise BACKSTAGE_NODE_OPTIONS with it --
      # and one LOWERING the limit below the heap size gets the OOMKill this
      # exists to prevent.
      #
      # Measured idle on sthings-platform: ~300Mi / 9m with the catalog loaded
      # (80 entities), ~139m during startup.
      resources:
        requests:
          cpu: ${BACKSTAGE_CPU_REQUEST:-100m}
          memory: ${BACKSTAGE_MEMORY_REQUEST:-512Mi}
        limits:
          cpu: ${BACKSTAGE_CPU_LIMIT:-1000m}
          memory: ${BACKSTAGE_MEMORY_LIMIT:-1Gi}
      image:
        registry: ${BACKSTAGE_IMAGE_REGISTRY:-ghcr.io}
        repository: ${BACKSTAGE_IMAGE_REPOSITORY:-stuttgart-things/sthings-backstage}
        tag: ${BACKSTAGE_IMAGE_TAG:-latest}
        digest: ${BACKSTAGE_IMAGE_DIGEST:-""}
      extraEnvVars:
        - name: NODE_OPTIONS
          value: ${BACKSTAGE_NODE_OPTIONS:---max-old-space-size=768}
        - name: APP_TITLE
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: APP_TITLE
        - name: ORGANIZATION_NAME
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: ORGANIZATION_NAME
        - name: APP_BASE_URL
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: APP_BASE_URL
        - name: BACKEND_BASE_URL
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: BACKEND_BASE_URL
        - name: CORS_ORIGIN
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: CORS_ORIGIN
        - name: CLAIM_MACHINERY_API_URL
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: CLAIM_MACHINERY_API_URL
        - name: CLAIM_MACHINERY_REGISTRY_URL
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: CLAIM_MACHINERY_REGISTRY_URL
        - name: AUTH_ENVIRONMENT
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_ENVIRONMENT
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: GITHUB_TOKEN
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: GITHUB_CLIENT_SECRET
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: BACKEND_SECRET
        - name: EXTERNAL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: EXTERNAL_ACCESS_TOKEN
      extraAppConfig:
        - filename: app-config.extra.yaml
          configMapRef: backstage-app-config
        - filename: app-config.catalog.yaml
          configMapRef: backstage-catalog-config
