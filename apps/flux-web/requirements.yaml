---
apiVersion: v1
kind: Namespace
metadata:
  name: ${FLUX_WEB_NAMESPACE:-flux-system}
  annotations:
    # Shared namespace (flux-system): never delete it when this app is removed
    # or its Kustomization is pruned -- only this app's objects go.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    toolkit.fluxcd.io/tenant: sthings-team
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flux-operator
  namespace: ${FLUX_WEB_NAMESPACE:-flux-system}
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
