---
# The HTTPRoutes are in profiles/base-routes: apply them from a second
# Kustomization that dependsOn this one (see that profile).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/redis-stack
  - ../../components/omni-pitcher
  - ../../components/core-catcher
  - ../../components/notification-catcher
  - ../../components/scout
  - ../../components/redis-stack/sops
  - ../../components/omni-pitcher/sops
  - ../../components/core-catcher/sops
  - ../../components/scout/sops
