---
# HTTPRoutes for profiles/base-led-catcher, applied after it is Ready.
#
# Separate for the reason profiles/base-routes and profiles/platform-routes are:
# Cilium resolves a route's backendRefs once, so a route applied beside the
# Kustomization that later creates its Service serves HTTP 500 for good while
# every Kustomization reports Ready.
#
# Substitutes DOMAIN, GATEWAY_NAME, GATEWAY_NAMESPACE and
# HOMERUN2_LED_CATCHER_HOSTNAME -- the same names profiles/base-routes uses.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/led-catcher/route
