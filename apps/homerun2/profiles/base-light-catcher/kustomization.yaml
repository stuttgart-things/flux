---
# light-catcher and the wled-mock it drives, on top of profiles/base, with
# credentials from the consumer's substituteFrom Secret rather than a
# ClusterSecretStore.
#
# The sops counterpart to profiles/platform-light-catcher, and it exists for the
# reason base-led-catcher does: components are not standalone-buildable, so a
# Flux Kustomization cannot point at components/light-catcher directly, and
# every profile carrying it selected the eso/ variant. components/light-catcher
# /sops was already there and unselected.
#
# wled-mock takes no credential variant at all -- it has neither eso/ nor sops/
# -- so it is selected bare here exactly as platform-light-catcher selects it.
#
# Needs HOMERUN2_REDIS_PASSWORD_B64, which profiles/base already requires, so a
# consumer running base needs nothing new. HTTPRoutes are in
# profiles/base-light-catcher-routes; apply them from a Kustomization that
# dependsOn this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/light-catcher
  - ../../components/light-catcher/sops
  - ../../components/wled-mock
