---
# k8s-pitcher alone, pitching to a central homerun2 cluster's omni-pitcher
# (#823), on a cluster without external-secrets: the token is
# HOMERUN2_K8S_PITCHER_AUTH_TOKEN from the consumer's substituteFrom Secret
# (components/k8s-pitcher/sops, no default).
# For the apps-platform bundle component homerun2-k8s-pitcher-remote-sops.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/k8s-pitcher
  - ../../components/k8s-pitcher/remote
  - ../../components/k8s-pitcher/sops
