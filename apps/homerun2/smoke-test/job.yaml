---
# The homerun2 smoke test, ported from the Argo CD chart (argocd
# apps/homerun2/smoke-test). In-cluster first, then through the gateway:
# omni-pitcher /health, an unauthenticated POST /pitch that must be 401, an
# authenticated one that must be 2xx, and a health probe per component in
# HOMERUN2_SMOKE_PROBES ("service/path,service/path" -- commas and no spaces,
# because kustomize folds a long value at a space and the default then differs
# from its copy).
#
# NO ${...} IN THE SCRIPT. Flux substitutes that form in every resource it
# applies, and an unset name becomes empty -- a script using it would run with
# its variables blanked. Plain $VAR is never touched, so the script uses only
# that; the values it needs arrive as env set from the substitutions below.
#
# WHAT A PASS AFTER A VERSION BUMP PROVES. Every in-cluster probe whose
# service reports its version on the health endpoint waits until it answers
# with the version in EXPECTED_VERSIONS, three times in a row, before it
# counts. Bumping a component re-runs this Job at once, in parallel with the
# rollout -- nothing orders it after the optional components' Kustomizations,
# and Flux has no optional dependsOn -- so without that wait a fast run probed
# the OLD pods and passed (flux#432, labda-dev-a: every light-catcher probe
# answered by v1.1.0 while v1.1.3 was still being created). Three in a row
# because a Service alternates between old and new pods during a rollout.
#
# It does NOT prove that for wled-mock, whose /healthz reports no version: that
# probe passes on whichever pod answers. Nor for the external probes, which run
# after the in-cluster ones and check routes, not versions.
#
# force: a Job's pod template is immutable. Flux deletes and recreates it when
# anything here changes, which is also what re-runs the test -- including the
# tested-versions annotation, so a component bump re-runs it too.
apiVersion: batch/v1
kind: Job
metadata:
  name: homerun2-smoke-test
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homerun2-smoke-test
        app.kubernetes.io/part-of: homerun2
      # What the test last ran against. A component bump changes this, which
      # (force, immutable template) recreates the Job and re-runs the test.
      # No defaults here: the Kustomization always sets them, and a second copy
      # of each would be one renovate cannot see.
      annotations:
        homerun2.stuttgart-things.com/tested-versions: "redis=${HOMERUN2_REDIS_VERSION},omni-pitcher=${HOMERUN2_OMNI_PITCHER_VERSION},core-catcher=${HOMERUN2_CORE_CATCHER_KUSTOMIZE_VERSION}/${HOMERUN2_CORE_CATCHER_VERSION},scout=${HOMERUN2_SCOUT_KUSTOMIZE_VERSION}/${HOMERUN2_SCOUT_VERSION},led-catcher=${HOMERUN2_LED_CATCHER_VERSION},demo-pitcher=${HOMERUN2_DEMO_PITCHER_VERSION},light-catcher=${HOMERUN2_LIGHT_CATCHER_KUSTOMIZE_VERSION}/${HOMERUN2_LIGHT_CATCHER_VERSION},wled-mock=${HOMERUN2_WLED_MOCK_VERSION}"
    spec:
      restartPolicy: Never
      # Numeric on purpose: curlimages/curl declares a named user, and with
      # only runAsNonRoot the kubelet cannot prove it is not root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: ca-bundle
          configMap:
            name: ${HOMERUN2_SMOKE_TRUST_BUNDLE_CM:-cluster-trust-bundle}
            optional: true
      containers:
        - name: smoke
          image: ${HOMERUN2_SMOKE_IMAGE:-curlimages/curl:8.22.0}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/bundle
              readOnly: true
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homerun2-omni-pitcher-token
                  key: auth-token
            - name: INTERNAL_URL
              value: http://homerun2-omni-pitcher
            - name: EXTERNAL_HOST
              value: ${HOMERUN2_OMNI_PITCHER_HOSTNAME:-omni-pitcher}.${DOMAIN}
            # A Cilium LoadBalancer VIP does not hairpin from pods on the same
            # node, so the external pass dials the gateway's Service and keeps
            # the real hostname for SNI, Host and certificate validation.
            - name: CONNECT_TO
              value: cilium-gateway-${GATEWAY_NAME}.${GATEWAY_NAMESPACE:-default}.svc.cluster.local
            # Through the gateway, <hostname>/<path>: every route this cluster
            # publishes. A route can serve 500 while its pod is healthy (Cilium
            # resolves backends once), so the in-cluster probes alone miss it.
            - name: EXTERNAL_PROBES
              value: ${HOMERUN2_SMOKE_EXTERNAL_PROBES:-omni-pitcher/health,core-catcher/health,scout/health,led-catcher/healthz}
            - name: DOMAIN
              value: ${DOMAIN}
            - name: PROBES
              value: ${HOMERUN2_SMOKE_PROBES:-homerun2-core-catcher/health,homerun2-scout/health,homerun2-led-catcher/healthz}
            # service=version, keyed by the probe's service name up to the first
            # dot, so `homerun2-light-catcher.homerun2-tabletennis/health` finds
            # light-catcher's. The IMAGE versions -- what /health reports -- from
            # the same substitutions the app components read, so the two cannot
            # disagree. A probe whose service is not listed is not version-checked.
            # No defaults, for the reason given at tested-versions above.
            - name: EXPECTED_VERSIONS
              value: "homerun2-omni-pitcher=${HOMERUN2_OMNI_PITCHER_VERSION},homerun2-core-catcher=${HOMERUN2_CORE_CATCHER_VERSION},homerun2-scout=${HOMERUN2_SCOUT_VERSION},homerun2-led-catcher=${HOMERUN2_LED_CATCHER_VERSION},homerun2-demo-pitcher=${HOMERUN2_DEMO_PITCHER_VERSION},homerun2-light-catcher=${HOMERUN2_LIGHT_CATCHER_VERSION}"
          command:
            - sh
            - -c
            - |
              set -e
              fail() { echo "FAIL: $*"; exit 1; }
              code() {
                m=$1; u=$2; shift 2
                curl -s -m 15 -o /dev/null -w '%{http_code}' -X "$m" "$u" "$@" || true
              }
              wait_ok() {
                label=$1; url=$2; shift 2; i=1
                while [ "$i" -le 30 ]; do
                  if curl -sf -m 10 -o /dev/null "$@" "$url"; then
                    echo "[$label] $url ok after $i attempt(s)"; return 0
                  fi
                  i=$((i + 1)); sleep 10
                done
                fail "[$label] $url never answered 2xx"
              }
              # The version a service's /health must report, or nothing.
              expected() {
                echo "$EXPECTED_VERSIONS" | tr ',' '\n' | sed -n "s/^$1=//p" | head -1
              }
              # wait_ok, plus: the body's "version" must equal $want three
              # times in a row. Anything else -- an old pod, no version field --
              # resets the streak and waits.
              wait_version() {
                label=$1; url=$2; want=$3; shift 3; i=1; streak=0
                while [ "$i" -le 30 ]; do
                  got=""
                  if body=$(curl -sf -m 10 "$@" "$url"); then
                    got=$(printf '%s' "$body" | grep -o '"version": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
                    [ -n "$got" ] || got="no version"
                  else
                    got="no 2xx"
                  fi
                  if [ "$got" = "$want" ]; then
                    streak=$((streak + 1))
                    if [ "$streak" -ge 3 ]; then
                      echo "[$label] $url answers $want (3 in a row, attempt $i)"; return 0
                    fi
                    sleep 2
                  else
                    [ "$streak" -gt 0 ] && echo "[$label] $url flipped back to $got"
                    streak=0
                    echo "[$label] $url answers $got, waiting for $want (attempt $i)"
                    sleep 10
                  fi
                  i=$((i + 1))
                done
                fail "[$label] $url never answered $want -- the new version did not roll out"
              }
              pitch_checks() {
                label=$1; base=$2; shift 2
                c=$(code POST "$base/pitch" -H 'Content-Type: application/json' \
                      -d '{"title":"smoke-test","message":"no token, must be rejected","severity":"info","author":"smoke-test"}' "$@")
                [ "$c" = "401" ] || fail "[$label] unauthenticated POST /pitch returned $c, expected 401 -- /pitch is not protected"
                echo "[$label] unauthenticated POST /pitch -> 401"
                c=$(code POST "$base/pitch" -H "Authorization: Bearer $AUTH_TOKEN" -H 'Content-Type: application/json' \
                      -d '{"title":"smoke-test","message":"homerun2 smoke test","severity":"info","author":"smoke-test","system":"smoke-test"}' "$@")
                case "$c" in
                  200|201|202) echo "[$label] authenticated POST /pitch -> $c" ;;
                  *) fail "[$label] authenticated POST /pitch returned $c" ;;
                esac
              }
              want=$(expected homerun2-omni-pitcher)
              if [ -n "$want" ]; then
                wait_version internal "$INTERNAL_URL/health" "$want"
              else
                wait_ok internal "$INTERNAL_URL/health"
              fi
              pitch_checks internal "$INTERNAL_URL"
              for p in $(echo "$PROBES" | tr ',' ' '); do
                svc=$(echo "$p" | cut -d/ -f1); path=/$(echo "$p" | cut -d/ -f2-)
                want=$(expected "$(echo "$svc" | cut -d. -f1)")
                if [ -n "$want" ]; then
                  wait_version "$svc" "http://$svc$path" "$want"
                else
                  wait_ok "$svc" "http://$svc$path"
                fi
              done
              CA=""
              [ -s /etc/ssl/bundle/trust-bundle.pem ] && CA="--cacert /etc/ssl/bundle/trust-bundle.pem"
              wait_ok external "https://$EXTERNAL_HOST/health" --connect-to "$EXTERNAL_HOST:443:$CONNECT_TO:443" $CA
              pitch_checks external "https://$EXTERNAL_HOST" --connect-to "$EXTERNAL_HOST:443:$CONNECT_TO:443" $CA
              for p in $(echo "$EXTERNAL_PROBES" | tr ',' ' '); do
                h=$(echo "$p" | cut -d/ -f1).$DOMAIN; path=/$(echo "$p" | cut -d/ -f2-)
                wait_ok "external $h" "https://$h$path" --connect-to "$h:443:$CONNECT_TO:443" $CA
              done
              echo "PASS"
