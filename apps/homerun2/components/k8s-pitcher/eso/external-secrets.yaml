---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun2-k8s-pitcher-token
  namespace: ${HOMERUN2_K8S_PITCHER_NAMESPACE:-homerun2-flux}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}
  target:
    name: homerun2-k8s-pitcher-token
    creationPolicy: Owner
  data:
    - secretKey: auth-token
      remoteRef:
        key: ${HOMERUN2_OMNI_PITCHER_TOKEN_PATH:-homerun2}
        property: ${HOMERUN2_OMNI_PITCHER_TOKEN_PROPERTY:-omni-pitcher-auth-token}
