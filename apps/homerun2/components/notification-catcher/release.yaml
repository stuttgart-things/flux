---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-notification-catcher
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: homerun2-notification-catcher-kustomize
  prune: true
  wait: true
  targetNamespace: ${HOMERUN2_NAMESPACE:-homerun2}
  # Credentials are not patched here. The base's two Secrets (-redis and
  # -secrets, the latter carrying TEAMS_WEBHOOK_URL) are filled by ./sops from
  # substituted values, or replaced by ExternalSecrets in ./eso -- a profile
  # selects one of the two. The routing file (-notify ConfigMap) is not in the
  # base at all: the cluster supplies it, or a notify-* component does.
  patches:
    # Container image tag — pinned via the cluster's substitution Secret.
    - target:
        kind: Deployment
        name: homerun2-notification-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-notification-catcher
        spec:
          template:
            spec:
              containers:
                - name: homerun2-notification-catcher
                  image: ghcr.io/stuttgart-things/homerun2-notification-catcher:${HOMERUN2_NOTIFICATION_CATCHER_VERSION:-v3.0.2}

    # First-reconciliation guard: every dispatched alert is logged
    # ("dry-run: would send …") instead of POSTing to Teams. Defaults to
    # "true" so a fresh cluster never spams Teams; flip it from the
    # consuming Kustomization once routing is confirmed in
    # `kubectl logs deploy/homerun2-notification-catcher`:
    #   postBuild.substitute.HOMERUN2_NOTIFICATION_CATCHER_DRYRUN: "false"
    # Requires homerun2-notification-catcher v1.3.0 or later.
    - target:
        kind: Deployment
        name: homerun2-notification-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-notification-catcher
        spec:
          template:
            spec:
              containers:
                - name: homerun2-notification-catcher
                  env:
                    - name: DRY_RUN
                      value: "${HOMERUN2_NOTIFICATION_CATCHER_DRYRUN:=true}"

    # Redis connection — point at the co-deployed redis-stack rather than the
    # KCL default. (The kustomize base already defaults to redis-stack.<ns>
    # but we set it explicitly to mirror the core-catcher / omni-pitcher
    # components and to make the namespace override visible here.)
    #
    # REDIS_STREAMS=messages,alerts: omni-pitcher routes by config since
    # v1.9.0 (routes-configmap.yaml), and /pitch/grafana — Alertmanager and
    # Grafana — goes to `alerts`, while git-pitcher still writes to
    # `messages`. The catcher dispatches both: teams-git-prs from `messages`,
    # teams-grafana-alerts from `alerts`. Subscribed to one of them only, the
    # other output goes silent while every pod reports healthy — which is
    # what happened with the former `REDIS_STREAM: messages` pin once
    # routing was on: every alert landed in a stream nobody read.
    #
    # REDIS_STREAMS (comma-separated) wins over REDIS_STREAM in the catcher;
    # REDIS_STREAM stays as the fallback for a catcher without it.
    - target:
        kind: ConfigMap
        name: homerun2-notification-catcher-env
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: homerun2-notification-catcher-env
        data:
          REDIS_ADDR: redis-stack.${HOMERUN2_NAMESPACE:-homerun2}.svc.cluster.local
          REDIS_PORT: "6379"
          REDIS_STREAM: messages
          REDIS_STREAMS: ${HOMERUN2_NOTIFICATION_CATCHER_STREAMS:=messages,alerts}
