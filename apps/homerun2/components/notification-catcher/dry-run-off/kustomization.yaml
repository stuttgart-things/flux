---
# dry-run-off -- the catcher POSTS to its outputs. Selected with
# HOMERUN2_NOTIFICATION_CATCHER_DRY_RUN: off, once `kubectl -n homerun2 logs
# deploy/homerun2-notification-catcher` has shown the would-sends you expect.
#
# Appended after release.yaml's DRY_RUN patch, so this value wins.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: homerun2-notification-catcher
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: Deployment
            name: homerun2-notification-catcher
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: homerun2-notification-catcher
            spec:
              template:
                spec:
                  containers:
                    - name: homerun2-notification-catcher
                      env:
                        - name: DRY_RUN
                          value: "false"
