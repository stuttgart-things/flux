---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun2-notification-catcher-redis
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}
  target:
    name: homerun2-notification-catcher-redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ${HOMERUN2_SECRET_PATH:-homerun2}
        property: redis-password

---
# The outputs the catcher dispatches to. dataFrom, not data: every key of the
# entry becomes a key of the Secret, so adding a second Notifier's webhook is
# a write to the store and nothing here changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun2-notification-catcher-secrets
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}
  target:
    name: homerun2-notification-catcher-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ${HOMERUN2_NOTIFICATION_CATCHER_SECRET_PATH:-homerun2-notification-catcher}
