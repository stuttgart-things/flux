---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun2-notification-catcher-redis
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}
  target:
    name: homerun2-notification-catcher-redis
    creationPolicy: Owner
  data:
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: ${HOMERUN2_SECRET_PATH:-homerun2}
        property: redis-password
---
# envFrom'd by the Deployment: every key here becomes an environment variable,
# and the routing file's ${TEAMS_WEBHOOK_URL} is resolved from it at start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun2-notification-catcher-secrets
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${HOMERUN2_SECRET_STORE:-set-HOMERUN2_SECRET_STORE}
  target:
    name: homerun2-notification-catcher-secrets
    creationPolicy: Owner
  data:
    - secretKey: TEAMS_WEBHOOK_URL # pragma: allowlist secret
      remoteRef:
        key: ${HOMERUN2_SECRET_PATH:-homerun2}
        property: ${HOMERUN2_NOTIFICATION_CATCHER_TEAMS_WEBHOOK_PROPERTY:-teams-webhook-url}
