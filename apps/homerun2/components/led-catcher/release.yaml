---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-led-catcher
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: homerun2-led-catcher-kustomize
  prune: true
  wait: true
  targetNamespace: ${HOMERUN2_NAMESPACE:-homerun2}
  patches:
    # Roll the pod when a referenced ConfigMap/Secret changes: the catcher
    # reads its config at start only. REQUIRES Reloader on the cluster
    # (infra/reloader) -- without it this does nothing. See the same patch in
    # ../notification-catcher/release.yaml for why Reloader, not a hash.
    - target:
        kind: Deployment
        name: homerun2-led-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-led-catcher
          annotations:
            reloader.stakater.com/auto: "true"
    # Remove the KCL-generated HTTPRoute (we provide our own via the component)
    - target:
        kind: HTTPRoute
        name: homerun2-led-catcher
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: homerun2-led-catcher
        $patch: delete
    # Override the container image tag
    - target:
        kind: Deployment
        name: homerun2-led-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-led-catcher
        spec:
          template:
            spec:
              containers:
                - name: homerun2-led-catcher
                  image: ghcr.io/stuttgart-things/homerun2-led-catcher:${HOMERUN2_LED_CATCHER_VERSION:-v0.13.0}
    # Override Redis connection
    - target:
        kind: Deployment
        name: homerun2-led-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-led-catcher
        spec:
          template:
            spec:
              containers:
                - name: homerun2-led-catcher
                  env:
                    - name: REDIS_ADDR
                      value: redis-stack.${HOMERUN2_NAMESPACE:-homerun2}.svc.cluster.local
                    - name: REDIS_PORT
                      value: "6379"
                    - name: LED_MODE
                      value: web
                    # The web simulator's stream buttons, e.g.
                    # "messages,tabletennis". Empty is the same as unset: the
                    # configured stream as its only preset.
                    - name: UI_STREAM_PRESETS
                      value: "${HOMERUN2_LED_CATCHER_UI_STREAM_PRESETS:=}"
                    # Comma-separated, e.g. messages,alerts where Grafana
                    # alerts arrive in their own stream.
                    - name: REDIS_STREAMS
                      value: "${HOMERUN2_LED_CATCHER_STREAMS:=messages}"
                    # The idle screen (off, clock) and the zone its clock and
                    # the card's HH:MM are shown in.
                    - name: LED_IDLE
                      value: "${HOMERUN2_LED_CATCHER_IDLE:=off}"
                    - name: TZ
                      value: "${HOMERUN2_LED_CATCHER_TZ:=UTC}"
    # The profile -- which display rule for which event -- is the caller's to
    # supply, as for light-catcher. Unset, the Deployment mounts the base's own
    # ConfigMap. Set it to a ConfigMap the cluster repo ships (key
    # profile.yaml). The catcher reads the profile at startup: the reloader
    # annotation above rolls the pod on a change where Reloader runs.
    - target:
        kind: Deployment
        name: homerun2-led-catcher
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-led-catcher
        spec:
          template:
            spec:
              volumes:
                - name: profile
                  configMap:
                    name: ${HOMERUN2_LED_CATCHER_PROFILE_CM:-homerun2-led-catcher-profile}
