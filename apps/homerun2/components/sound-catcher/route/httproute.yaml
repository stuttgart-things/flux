---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homerun2-sound-catcher
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE:-default}
  hostnames:
    - ${HOMERUN2_SOUND_CATCHER_HOSTNAME:-sound-catcher}.${DOMAIN}
  rules:
    # The player page's event stream (SSE) is one long response. Without a
    # timeout of its own, Envoy ends it after its route default and the page
    # reconnects again and again (it catches up, but with gaps). 0s: none.
    - matches:
        - path:
            type: PathPrefix
            value: /api/events
      timeouts:
        request: 0s
      backendRefs:
        - name: homerun2-sound-catcher
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homerun2-sound-catcher
          port: 80
