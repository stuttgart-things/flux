---
# sound-catcher: its HTTPRoute, as a component of its own, applied from a
# Kustomization that waits for the app one -- Cilium resolves backendRefs
# once, and a route applied before its Service serves 500 for good.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - httproute.yaml
