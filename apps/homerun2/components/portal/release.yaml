---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homerun2-portal
  namespace: ${HOMERUN2_NAMESPACE:-homerun2}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: homerun2-portal-kustomize
  prune: true
  wait: true
  targetNamespace: ${HOMERUN2_NAMESPACE:-homerun2}
  patches:
    # Roll the pod when its ConfigMap changes: the portal reads
    # PORTAL_SERVICES at start only. REQUIRES Reloader on the cluster
    # (infra/reloader) -- without it this does nothing.
    - target:
        kind: Deployment
        name: homerun2-portal
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-portal
          annotations:
            reloader.stakater.com/auto: "true"
    # Remove the KCL-generated HTTPRoute (we provide our own via the component)
    - target:
        kind: HTTPRoute
        name: homerun2-portal
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: homerun2-portal
        $patch: delete
    # Override the container image tag
    - target:
        kind: Deployment
        name: homerun2-portal
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homerun2-portal
        spec:
          template:
            spec:
              containers:
                - name: homerun2-portal
                  image: ghcr.io/stuttgart-things/homerun2-portal:${HOMERUN2_PORTAL_VERSION:-v0.8.0}
    # The services behind the portal, "key=url" each, in navigation order.
    # Each one is served under /<key>/ and must run with BASE_PATH=/<key>
    # (led-catcher v0.18.0 or later). The URLs are in-cluster; a short
    # Service name resolves in the namespace.
    - target:
        kind: ConfigMap
        name: homerun2-portal-config
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: homerun2-portal-config
        data:
          PORTAL_SERVICES: "${HOMERUN2_PORTAL_SERVICES:=led=http://homerun2-led-catcher}"
