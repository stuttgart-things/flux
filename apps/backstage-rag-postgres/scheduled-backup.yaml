---
# A daily base backup. The in-tree setup this replaces archived WAL only and
# never scheduled a base backup -- and WAL without a base backup to replay it
# onto restores nothing. WAL is archived continuously in between, so a
# recovery can reach any point after the oldest base backup the retention
# keeps.
#
# CloudNativePG's schedule has SIX fields -- seconds first. `immediate` takes one
# backup as soon as this is created, so a fresh cluster has something to recover
# from before the first night.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: rag-postgres-daily
  namespace: ${BACKSTAGE_NAMESPACE:-portal}
  labels:
    backup: backstage-rag-postgres
spec:
  schedule: "${RAG_BACKUP_SCHEDULE:-0 0 2 * * *}"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: rag-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
