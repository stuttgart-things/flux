---
# Opt-in: a second repository next to GIT_SYNC_REPO, for labs whose cluster
# directories live in two repos. Needs components/config to scan it.
#
# Own git-sync container on its own emptyDir, mounted at /data-extra in
# clusterscope: two git-syncs must not share a --root (each manages the
# directory and cleans it when its checks fail). The checkout link is
# /data-extra/<last URL segment> — use a URL without ".git".
#
# Variables:
#   GIT_SYNC_EXTRA_REPO    repository URL (required)
#   GIT_SYNC_EXTRA_BRANCH  default main
#   GIT_SYNC_EXTRA_PERIOD  default 120s
#   GIT_SYNC_AUTH_SECRET   same optional username/password Secret as git-sync
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: clusterscope-deploy
    patch: |  # pragma: allowlist secret -- names a Secret, holds none
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: Deployment
            name: clusterscope
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: clusterscope
            spec:
              template:
                spec:
                  containers:
                    - name: clusterscope
                      volumeMounts:
                        - name: gitdata-extra
                          mountPath: /data-extra
                    - name: git-sync-extra
                      image: ${GIT_SYNC_IMAGE:-registry.k8s.io/git-sync/git-sync:v4.4.0}
                      args:
                        - '--repo=${GIT_SYNC_EXTRA_REPO}'
                        - '--ref=${GIT_SYNC_EXTRA_BRANCH:-main}'
                        - '--root=/data-extra'
                        - '--period=${GIT_SYNC_EXTRA_PERIOD:-120s}'
                        - '--depth=1'
                      env:
                        - name: GITSYNC_USERNAME
                          valueFrom:
                            secretKeyRef:
                              name: ${GIT_SYNC_AUTH_SECRET:-git-sync-auth}
                              key: username
                              optional: true
                        - name: GITSYNC_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: ${GIT_SYNC_AUTH_SECRET:-git-sync-auth}
                              key: password
                              optional: true
                      # As git-sync in release.yaml: 100m throttles the
                      # short fetch/checkout bursts (flux#835).
                      resources:
                        limits:
                          cpu: 500m
                          memory: 128Mi
                        requests:
                          cpu: 10m
                          memory: 32Mi
                      securityContext:
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                        runAsUser: 65533
                      volumeMounts:
                        - name: gitdata-extra
                          mountPath: /data-extra
                        - name: git-sync-extra-tmp
                          mountPath: /tmp
                  volumes:
                    - name: gitdata-extra
                      emptyDir: {}
                    - name: git-sync-extra-tmp
                      emptyDir: {}
