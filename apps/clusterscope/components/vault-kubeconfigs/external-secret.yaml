---
# One kubeconfig per cluster, from the KV mount the ClusterStack plays write
# to (path = cluster name, property `kubeconfig`), as one Secret with one key
# per cluster — the layout -kubeconfig-dir expects.
#
# `find` selects the clusters by name, so the lab's cluster list stays one
# substitution (CLUSTERSCOPE_KUBECONFIG_CLUSTERS, a regexp) instead of one
# data entry per cluster. find returns each Vault entry as JSON; the template
# keeps only its `kubeconfig` property. (Flux substitutes ${…} only, so the
# Go template's $variables pass through untouched.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clusterscope-kubeconfigs
  namespace: ${CLUSTERSCOPE_NAMESPACE:-clusterscope}
spec:
  refreshInterval: ${CLUSTERSCOPE_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${CLUSTERSCOPE_KUBECONFIG_STORE:-vault-kubeconfigs}
    kind: ClusterSecretStore
  target:
    name: clusterscope-kubeconfigs
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{- range $cluster, $entry := . }}
            {{ $cluster }}: {{ (fromJson $entry).kubeconfig | toJson }}
            {{- end }}
  dataFrom:
    - find:
        name:
          regexp: '${CLUSTERSCOPE_KUBECONFIG_CLUSTERS:-^$}'
