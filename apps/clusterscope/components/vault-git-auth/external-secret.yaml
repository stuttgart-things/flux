---
# git-sync credentials (HTTPS token) for a private repository, from Vault.
# Keys username / password, as release.yaml's git-sync env expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-sync-auth
  namespace: ${CLUSTERSCOPE_NAMESPACE:-clusterscope}
spec:
  refreshInterval: ${CLUSTERSCOPE_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${GIT_SYNC_AUTH_STORE:-set-GIT_SYNC_AUTH_STORE}
    kind: ClusterSecretStore
  target:
    name: ${GIT_SYNC_AUTH_SECRET:-git-sync-auth}
    creationPolicy: Owner
  data:
    - secretKey: username  # pragma: allowlist secret
      remoteRef:
        key: ${GIT_SYNC_AUTH_PATH:-set-GIT_SYNC_AUTH_PATH}
        property: ${GIT_SYNC_AUTH_USERNAME_PROPERTY:-username}
    - secretKey: password  # pragma: allowlist secret
      remoteRef:
        key: ${GIT_SYNC_AUTH_PATH:-set-GIT_SYNC_AUTH_PATH}
        property: ${GIT_SYNC_AUTH_PASSWORD_PROPERTY:-password}
