---
# CLUSTERSCOPE_ROUTE=health: clusterscope's own hostname serves the health
# endpoints only. Dashboard AND API are then reachable only through
# sthings-portal, behind its login (stuttgart-things/stuttgart-things#4231).
# For a lab where nothing outside the cluster reads the API: /api/... carries
# the lab's inventory (clusters, endpoints, PR previews), and the blackbox
# probes (components/blackbox-probes) read /api/targets in-cluster, through
# the Service.
#
# /health is clusterscope v0.29.0+ (v0.28.0: /healthz, /readyz only).
# Anything else on the host answers 404 from the Gateway.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: HTTPRoute
      name: clusterscope
    patch: |
      - op: replace
        path: /spec/rules
        value:
          - matches:
              - path:
                  type: Exact
                  value: /health
              - path:
                  type: Exact
                  value: /healthz
              - path:
                  type: Exact
                  value: /readyz
            backendRefs:
              - name: clusterscope
                port: 8080
