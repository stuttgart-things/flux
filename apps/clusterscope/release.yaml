---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: clusterscope-kustomize
  namespace: flux-system
spec:
  interval: 1h
  # Since v0.23.1 the base pins the image of the same version; -config
  # (components/config) needs v0.24.0.
  url: oci://ghcr.io/stuttgart-things/clusterscope-kustomize
  ref:
    tag: ${CLUSTERSCOPE_VERSION:-v0.25.1}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clusterscope-deploy
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: clusterscope-kustomize
  path: ./
  prune: true
  wait: true
  targetNamespace: ${CLUSTERSCOPE_NAMESPACE:-clusterscope}
  patches:
    # Set -root to the git-sync synced subdirectory. Every flag uses the
    # -flag=value form: an empty substitution then stays a valid flag instead
    # of an empty positional argument that would end flag parsing.
    - target:
        kind: Deployment
        name: clusterscope
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: clusterscope
        spec:
          template:
            spec:
              containers:
                - name: clusterscope
                  args:
                    - '-root=${GIT_SYNC_DIR:-/data/repo/clusters}'
                    - '-tech=${CLUSTERSCOPE_TECH:-flux}'
                    - '-serve=:${CLUSTERSCOPE_PORT:-8080}'
                    - '-lab=${CLUSTERSCOPE_LAB:-}'
                    # Several repos / name + lab overrides (components/config);
                    # replaces -root when set.
                    - '-config=${CLUSTERSCOPE_CONFIG_FILE:-}'
                    # Live mode: GitOps status, workload health, endpoints.
                    # The own cluster is read with the in-cluster
                    # ServiceAccount; other clusters need a kubeconfig in
                    # CLUSTERSCOPE_KUBECONFIG_DIR (components/vault-kubeconfigs).
                    - '-live=${CLUSTERSCOPE_LIVE:-false}'
                    - '-self-cluster=${CLUSTERSCOPE_SELF_CLUSTER:-}'
                    - '-kubeconfig-dir=${CLUSTERSCOPE_KUBECONFIG_DIR:-}'
                    - '-probe=${CLUSTERSCOPE_PROBE:-false}'
                    - '-refresh=${CLUSTERSCOPE_REFRESH:-60}'
    # Trust the lab CAs for the endpoint probes (-probe): the trust-manager
    # bundle (default CAs + lab CAs) via SSL_CERT_DIR. Optional — without
    # trust-manager the image's own CA file still applies (Go loads it
    # regardless of SSL_CERT_DIR).
    - target:
        kind: Deployment
        name: clusterscope
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: clusterscope
        spec:
          template:
            spec:
              volumes:
                - name: trust-bundle
                  configMap:
                    name: ${CLUSTERSCOPE_TRUST_BUNDLE_CONFIGMAP:-cluster-trust-bundle}
                    optional: true
              containers:
                - name: clusterscope
                  env:
                    - name: SSL_CERT_DIR
                      value: /etc/ssl/custom
                  volumeMounts:
                    - name: trust-bundle
                      mountPath: /etc/ssl/custom/${CLUSTERSCOPE_TRUST_BUNDLE_KEY:-trust-bundle.pem}
                      subPath: ${CLUSTERSCOPE_TRUST_BUNDLE_KEY:-trust-bundle.pem}
                      readOnly: true
    # Add git-sync sidecar container
    # Auth for private repos: a Secret with username + password (HTTPS token),
    # from Vault via components/vault-git-auth or created by hand:
    #   kubectl create secret generic git-sync-auth \
    #     --from-literal=username=token --from-literal=password=<TOKEN> -n clusterscope
    # Optional: without the Secret git-sync clones anonymously (public repos).
    - target:
        kind: Deployment
        name: clusterscope
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: clusterscope
        spec:
          template:
            spec:
              containers:
                - name: git-sync
                  image: ${GIT_SYNC_IMAGE:-registry.k8s.io/git-sync/git-sync:v4.4.0}
                  args:
                    - '--repo=${GIT_SYNC_REPO}'
                    - '--ref=${GIT_SYNC_BRANCH:-main}'
                    - '--root=/data'
                    - '--period=${GIT_SYNC_PERIOD:-60s}'
                    - '--depth=1'
                  env:
                    - name: GITSYNC_ONE_TIME
                      value: "false"
                    - name: GITSYNC_USERNAME
                      valueFrom:
                        secretKeyRef:
                          name: ${GIT_SYNC_AUTH_SECRET:-git-sync-auth}
                          key: username
                          optional: true
                    - name: GITSYNC_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ${GIT_SYNC_AUTH_SECRET:-git-sync-auth}
                          key: password
                          optional: true
                  resources:
                    limits:
                      cpu: 100m
                      memory: 128Mi
                    requests:
                      cpu: 10m
                      memory: 32Mi
                  securityContext:
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    runAsUser: 65533
                  volumeMounts:
                    - name: gitdata
                      mountPath: /data
                    - name: git-sync-tmp
                      mountPath: /tmp
              volumes:
                - name: git-sync-tmp
                  emptyDir: {}
    # Remove the KCL-generated HTTPRoute (managed via httproute.yaml)
    - target:
        kind: HTTPRoute
        name: clusterscope
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: clusterscope
        $patch: delete
