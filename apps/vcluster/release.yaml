---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vcluster
  namespace: ${VCLUSTER_NAMESPACE:-vcluster}
spec:
  interval: 30m
  chart:
    spec:
      chart: vcluster
      # renovate: datasource=helm depName=vcluster registryUrl=https://charts.loft.sh
      version: ${VCLUSTER_VERSION:-0.37.0}
      sourceRef:
        kind: HelmRepository
        name: loft
        namespace: ${VCLUSTER_NAMESPACE:-vcluster}
      interval: 12h
  values:
    controlPlane:
      distro:
        k8s:
          enabled: true
          image:
            tag: "v1.33.4"  # Specify version explicitly
      backingStore:
        etcd:
          embedded:
            enabled: true
      # resources, highAvailability and persistence belong to the STATEFULSET,
      # not to backingStore or to controlPlane itself. The chart rejects them
      # anywhere else against its own schema:
      #
      #   at '/controlPlane/backingStore': additional properties
      #     'highAvailability', 'resources' not allowed
      #   at '/controlPlane': additional properties 'persistence' not allowed
      #
      # so this release could not install at all. Found by
      # hack/check-helm-values.py on its first run.
      statefulSet:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi  # Increased from 256Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 4Gi  # Increased from 2Gi
            ephemeral-storage: 8Gi
        highAvailability:
          replicas: 1  # Set to 3 for true HA in production
        persistence:
          volumeClaim:
            enabled: ${VCLUSTER_STORAGE_ENABLED:-true}
            retentionPolicy: Retain
            size: ${VCLUSTER_STORAGE_SIZE:-10Gi}
            storageClass: ${VCLUSTER_STORAGE_CLASS}
            accessModes: ["ReadWriteOnce"]
    sync:
      toHost:
        services:
          enabled: true
        endpoints:
          enabled: true
        persistentVolumeClaims:
          enabled: true
      fromHost:
        events:
          enabled: true
        storageClasses:
          enabled: true  # Changed from auto
        nodes:
          enabled: false
          selector:
            all: false
        ingressClasses:
          enabled: true  # Changed from false
