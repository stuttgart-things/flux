---
# Everything ZITADEL and its PostgreSQL need to start, rendered from
# substitution variables -- for a cluster that delivers secrets with SOPS +
# substituteFrom only (apps/platform/components/zitadel). No defaults: a
# missing key renders empty and fails loudly at the first start rather than
# installing an IdP with a blank masterkey.
#
#   masterkey          ZITADEL_MASTERKEY, EXACTLY 32 characters
#                      (`openssl rand -base64 24`). It encrypts secrets INSIDE
#                      the database and MUST NOT change after the first start:
#                      a new key leaves the data unreadable.
#   db-password        ZITADEL_DB_PASSWORD, PostgreSQL user `zitadel`
#   db-admin-password  ZITADEL_DB_ADMIN_PASSWORD, PostgreSQL superuser
#                      `postgres` (the init job creates the database with it)
#   admin-password     ZITADEL_ADMIN_PASSWORD, the initial password of the
#                      human IAM_OWNER `zitadel-admin`. Read ONCE, by the
#                      setup job on an empty database; changing it later
#                      changes nothing in ZITADEL. Must satisfy the default
#                      password policy: 8+ characters with upper, lower, digit
#                      AND a symbol -- an alnum value fails the setup job.
#                      `openssl rand -base64 32` does: 44 characters, the last
#                      one the padding `=`.
#
# THE QUOTES BELOW DO NOT SURVIVE. kustomize re-emits `"${X}"` as a bare
# `${X}` before Flux substitutes, so each value lands as a plain YAML scalar: a
# leading `#` turns it into a comment (an empty masterkey), `: ` or ` #` cut
# it short. base64 and alnum values are safe -- which is why the masterkey and
# the admin password are base64 and the DB passwords alnum (profile.yaml).
#
# The PostgreSQL passwords are read by the bitnami chart only when it
# initialises an empty volume, too. Rotating them means ALTER USER first.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-credentials
  namespace: ${ZITADEL_NAMESPACE:-zitadel}
type: Opaque
stringData:
  masterkey: "${ZITADEL_MASTERKEY}"
  db-password: "${ZITADEL_DB_PASSWORD}"
  db-admin-password: "${ZITADEL_DB_ADMIN_PASSWORD}"
  admin-password: "${ZITADEL_ADMIN_PASSWORD}"
