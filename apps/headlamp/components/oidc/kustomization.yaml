---
# OIDC login for Headlamp (opt-in). Applied by the headlamp-oidc component
# (infra/platform/components); without it the base renders token login, as
# before.
#
# Headlamp sends the user's ID token to the kube-apiserver, so the apiserver
# has to accept that issuer and audience (--authentication-config /
# AuthenticationConfiguration) and RBAC has to bind the users or groups it
# derives. Headlamp itself grants nothing.
#
# - Client ID, issuer, scopes, callback: plain chart values (not secret),
#   rendered by the chart as env + -oidc-* args. secret.create: false, so the
#   chart writes no Secret of its own.
# - Client secret: from an existing Secret (SOPS / ESO, not here), as
#   HEADLAMP_CONFIG_OIDC_CLIENT_SECRET -- Headlamp reads HEADLAMP_CONFIG_* env
#   as its flags, so no -oidc-client-secret arg and nothing in the values.
# - CA of the issuer: a ConfigMap (default the trust-manager Bundle target
#   cluster-trust-bundle, key trust-bundle.pem), as -oidc-ca-file via
#   HEADLAMP_CONFIG_OIDC_CA_FILE. A missing ConfigMap or Secret keeps the pod
#   in ContainerCreating -- loud, unlike a login that fails at the IdP.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: headlamp
    patch: |  # pragma: allowlist secret -- names a Secret and its key, holds none
      - op: add
        path: /spec/values/config/oidc
        value:
          secret:
            create: false
          clientID: ${HEADLAMP_OIDC_CLIENT_ID:-set-HEADLAMP_OIDC_CLIENT_ID}
          issuerURL: ${HEADLAMP_OIDC_ISSUER_URL:-https://set-HEADLAMP_OIDC_ISSUER_URL.invalid}
          # Comma separated; Headlamp adds openid itself.
          scopes: ${HEADLAMP_OIDC_SCOPES:-profile,email}
          callbackURL: ${HEADLAMP_OIDC_CALLBACK_URL:-https://${HOSTNAME}.${DOMAIN}/oidc-callback}
      - op: add
        path: /spec/values/env
        value:
          - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ${HEADLAMP_OIDC_CLIENT_SECRET_NAME:-headlamp-oidc}
                key: ${HEADLAMP_OIDC_CLIENT_SECRET_KEY:-client-secret}
          - name: HEADLAMP_CONFIG_OIDC_CA_FILE
            value: /etc/headlamp/oidc-ca/${HEADLAMP_OIDC_CA_KEY:-trust-bundle.pem}
      - op: add
        path: /spec/values/volumes
        value:
          - name: oidc-ca
            configMap:
              name: ${HEADLAMP_OIDC_CA_CONFIGMAP:-cluster-trust-bundle}
      - op: add
        path: /spec/values/volumeMounts
        value:
          - name: oidc-ca
            mountPath: /etc/headlamp/oidc-ca
            readOnly: true
