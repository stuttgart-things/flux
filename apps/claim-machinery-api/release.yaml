---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claim-machinery-api
  namespace: ${CLAIM_MACHINERY_API_NAMESPACE:-claim-machinery}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: claim-machinery-api-kustomize
  prune: true
  wait: true
  targetNamespace: ${CLAIM_MACHINERY_API_NAMESPACE:-claim-machinery}
  patches:
    # Remove the Ingress from the kustomize base (we use Gateway API HTTPRoute)
    - target:
        kind: Ingress
        name: claim-machinery-api
      patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: claim-machinery-api
        $patch: delete
    # Override the container image tag and set server command
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claim-machinery-api
        spec:
          template:
            spec:
              containers:
                - name: claim-machinery-api
                  image: ghcr.io/stuttgart-things/claim-machinery-api:${CLAIM_MACHINERY_API_VERSION:-v0.29.0}
                  args:
                    - server
    # Opt into Stakater Reloader so a change to the claim-machinery-api
    # ConfigMap/Secret (e.g. TEMPLATE_PROFILE_PATH) auto-rolls the Deployment.
    # NOTE: only fires on ConfigMap/Secret changes, not on edits to the
    # remote profile YAMLs (those are fetched by URL at runtime).
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claim-machinery-api
          annotations:
            reloader.stakater.com/auto: "${CLAIM_MACHINERY_RELOADER_AUTO:-true}"
    # Override TEMPLATE_PROFILE_PATH and configure homerun2 notifications
    - target:
        kind: ConfigMap
        name: claim-machinery-api
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: claim-machinery-api
        data:
          # Profile source precedence:
          #   CLAIM_MACHINERY_PROFILE_PATH -> full override (any URL, or the
          #     baked-in /app/config/profile.yaml for a version-pinned profile)
          #   else compose the remote URL from:
          #     CLAIM_MACHINERY_PROFILE_REF  (git ref/tag/sha, default main)
          #     CLAIM_MACHINERY_PROFILE_NAME (profile file name, default machinery)
          TEMPLATE_PROFILE_PATH: "${CLAIM_MACHINERY_PROFILE_PATH:-https://raw.githubusercontent.com/stuttgart-things/claim-machinery-api/${CLAIM_MACHINERY_PROFILE_REF:-main}/profiles/${CLAIM_MACHINERY_PROFILE_NAME:-machinery}.yaml}"
          ENABLE_HOMERUN: "${CLAIM_MACHINERY_ENABLE_HOMERUN:-false}"
          HOMERUN_URL: "${CLAIM_MACHINERY_HOMERUN_URL:-}"
    # Inject homerun auth token from Secret
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: | # pragma: allowlist secret
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claim-machinery-api
        spec:
          template:
            spec:
              containers:
                - name: claim-machinery-api
                  env:
                    - name: HOMERUN_AUTH_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: ${CLAIM_MACHINERY_AUTH_SECRET_NAME:-claim-machinery-auth}
                          key: ${CLAIM_MACHINERY_AUTH_SECRET_KEY:-HOMERUN_AUTH_TOKEN}
                          optional: true
    # Mount trust-manager CA bundle for TLS trust
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claim-machinery-api
        spec:
          template:
            spec:
              volumes:
                - name: trust-bundle
                  configMap:
                    name: ${CLAIM_MACHINERY_TRUST_BUNDLE_CONFIGMAP:-cluster-trust-bundle}
                    optional: true
              containers:
                - name: claim-machinery-api
                  env:
                    - name: SSL_CERT_DIR
                      value: ${CLAIM_MACHINERY_SSL_CERT_DIR:-/etc/ssl/custom}
                  volumeMounts:
                    - name: trust-bundle
                      mountPath: ${CLAIM_MACHINERY_SSL_CERT_DIR:-/etc/ssl/custom}/${CLAIM_MACHINERY_TRUST_BUNDLE_KEY:-trust-bundle.pem}
                      subPath: ${CLAIM_MACHINERY_TRUST_BUNDLE_KEY:-trust-bundle.pem}
                      readOnly: true
    # BASE_PATH behind sthings-portal (stuttgart-things/flux#945): the prefix
    # of the UI (/ui/), the docs and the API, e.g. /claims (= the portal key;
    # the portal forwards /<key>/... unchanged). claim-machinery-api v0.23.0+;
    # /health, /version, /openapi(.yaml) and /api/v1/claim-templates* stay at
    # the root under any prefix (claims CLI, Backstage, the portal's health
    # poll). An env entry and not a key in the envFrom ConfigMap: a change
    # here rolls the pod even where Reloader does not run.
    #
    # ALWAYS PRESENT: `/` (the default) is no prefix -- claim-machinery-api
    # trims the trailing slash and reads "" as the root -- so a cluster without
    # CLAIM_MACHINERY_API_BASE_PATH behaves as before, but its Deployment
    # gained this entry and rolled once when it came in. The value must start
    # with `/`; claim-machinery-api refuses to start otherwise.
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: claim-machinery-api
        spec:
          template:
            spec:
              containers:
                - name: claim-machinery-api
                  env:
                    - name: BASE_PATH
                      value: "${CLAIM_MACHINERY_API_BASE_PATH:-/}"
    # Order auth and order as PR (claim-machinery-api README "Order
    # authentication" / "Order as PR"; stuttgart-things#4380). OFF unless the
    # cluster creates them -- both are optional:
    #
    #   ConfigMap claim-machinery-order   env for the container (envFrom):
    #     AUTH_OIDC_ISSUER, AUTH_OIDC_AUDIENCE, AUTH_OIDC_CA_FILE
    #     (/etc/ssl/custom/trust-bundle.pem = the trust-bundle mount above),
    #     AUTH_TRUST_FORWARDED_USER, AUTH_ORDER_ROLES, AUTH_ADMIN_ROLES, ...;
    #     GITHUB_DISPATCH_APP_ID, GITHUB_DISPATCH_INSTALLATION_ID,
    #     GITHUB_DISPATCH_PRIVATE_KEY_FILE=/etc/github-app/private-key.pem
    #   Secret claim-machinery-github-app  key private-key.pem (the GitHub
    #     App's key), mounted under /etc/github-app
    #
    # A ConfigMap and not substitute variables: AUTH_ORDER_ROLES may be
    # empty on purpose, and an empty substitute value renders as null, which
    # the Kustomization CRD rejects. The cluster ships both objects (the
    # Secret SOPS-encrypted) next to its platform.yaml. GITHUB_DISPATCH_*
    # without the Secret stops the service at start (a partial dispatch
    # config is an error there), so create the Secret first. Reloader
    # (annotation above) rolls the pod when either changes.
    #
    # JSON6902 and not a strategic merge: envFrom has no merge key, a merge
    # patch would replace the base's configMapRef claim-machinery-api.
    - target:
        kind: Deployment
        name: claim-machinery-api
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/envFrom/-
          value:
            configMapRef:
              name: claim-machinery-order
              optional: true
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: github-app
            secret:
              secretName: claim-machinery-github-app
              optional: true
              # 0440: owner and the pod's fsGroup (65532) read it.
              defaultMode: 288
        - op: add
          path: /spec/template/spec/containers/0/volumeMounts/-
          value:
            name: github-app
            mountPath: /etc/github-app
            readOnly: true
