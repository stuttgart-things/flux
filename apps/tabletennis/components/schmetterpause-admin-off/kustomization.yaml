---
# schmetterpause-admin-off -- no bootstrap admin: the default. Selected through
# TABLETENNIS_SCHMETTERPAUSE_ADMIN (default off). Empty on purpose.
#
# The first admin is a SECOND-PASS value, not a first-boot one: the person has
# to have joined the instance before the flag can land on them (schmetterpause
# ADR-0008). A fresh cluster therefore starts here and moves to `on` once
# somebody has a player to point at.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# `patches: []` rather than nothing at all. kustomize refuses a kustomization.yaml
# with no directives -- "kustomization.yaml is empty" -- and that refusal is not
# only cosmetic: hack/check-passthrough-defaults.py renders every path with its
# DEFAULT components selected, which is exactly these, got None back, and skipped
# the whole tabletennis path in silence. The version-copy drift it exists to
# catch (flux#359, on these very variables) therefore went unchecked here.
patches: []
