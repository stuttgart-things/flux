---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaehlwerk-piezo-sim
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  labels:
    app.kubernetes.io/name: zaehlwerk-piezo-sim
    app.kubernetes.io/part-of: zaehlwerk
spec:
  replicas: 1
  # One board per table: a second one would take turns on the same match.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zaehlwerk-piezo-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zaehlwerk-piezo-sim
        app.kubernetes.io/part-of: zaehlwerk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: piezo
          image: ghcr.io/stuttgart-things/zaehlwerk-piezo:${ZAEHLWERK_PIEZO_VERSION:-v0.9.0}
          env:
            - name: ZAEHLWERK_URL
              value: http://zaehlwerk
            # Wait for a match started on the page, like the real board.
            - name: PIEZO_JOIN
              value: "true"
            # 0 = keep going: after a match, wait for the next.
            - name: PIEZO_MATCHES
              value: "0"
            # Fixed, not substituted: a number in postBuild.substitute fails
            # the whole layer (hack/check-substitute-strings.py).
            - name: PIEZO_BEST_OF
              value: "3"
            - name: PIEZO_PACE
              value: "${ZAEHLWERK_PIEZO_PACE:-1s}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
