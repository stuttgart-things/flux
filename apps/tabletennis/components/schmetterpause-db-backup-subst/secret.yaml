---
# The Secret ../schmetterpause-db-backup-sops/object-store.yaml names: S3 pair
# and endpoint CA, the same keys the ESO variant's ExternalSecret writes.
#
# The two keys have NO DEFAULT, like ../schmetterpause/sops/secrets.yaml: an
# unset value renders YAML null, which the API server stores as "" in
# stringData. Nothing refuses it at apply. The Cluster's ContinuousArchiving
# condition goes False with an S3 auth error instead. A default would be a
# credential readable by anyone here.
#
# The CA goes into `data`, base64, so a multi-line PEM passes through
# postBuild substitution as ONE line. A PEM substituted into a block scalar
# would lose its indentation after the first line and break the YAML.
apiVersion: v1
kind: Secret
metadata:
  name: schmetterpause-db-backup
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
type: Opaque
stringData:
  ACCESS_KEY_ID: ${SCHMETTERPAUSE_BACKUP_ACCESS_KEY_ID}
  ACCESS_SECRET_KEY: ${SCHMETTERPAUSE_BACKUP_SECRET_ACCESS_KEY}
data:
  # Default: a self-signed placeholder (CN placeholder-ca-not-used, P-256,
  # valid to 2056). Its key does not exist. See kustomization.yaml.
  trust-bundle.pem: ${SCHMETTERPAUSE_BACKUP_CA_PEM_B64:-} # pragma: allowlist secret
