---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: schmetterpause
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: schmetterpause-kustomize
  prune: true
  wait: true
  targetNamespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
  # Credentials are not patched here. The base's two ExternalSecrets are
  # pointed at the store by ./eso, or replaced with plain Secrets by ./sops --
  # a profile selects one of the two.
  patches:
    # The published base is deliberately environment-free: it names
    # `gateway`/`default` and `schmetterpause.cluster.example.com`, and an
    # environment is expected to patch those in. We PATCH rather than
    # $patch:delete-and-reship, because the base carries TWO routes whose
    # split is a design decision -- the http one redirects, the https one
    # serves -- and re-shipping them here would fork that decision into the
    # bundle.
    #
    # parentRefs is a list on a CRD, so kustomize replaces it wholesale rather
    # than merging into it. Every field has to be repeated, sectionName
    # included: dropping it would attach the route to every listener.
    - target:
        kind: HTTPRoute
        name: schmetterpause
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: schmetterpause
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: https
          hostnames:
            - ${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}
    - target:
        kind: HTTPRoute
        name: schmetterpause-redirect
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: schmetterpause-redirect
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: http
          hostnames:
            - ${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}
