---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: schmetterpause
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: schmetterpause-kustomize
  prune: true
  wait: true
  targetNamespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
  # Credentials are not patched here. The base's two ExternalSecrets are
  # pointed at the store by ./eso, or replaced with plain Secrets by ./sops --
  # a profile selects one of the two.
  patches:
    # The published base is deliberately environment-free: it names
    # `gateway`/`default` and `schmetterpause.cluster.example.com`, and an
    # environment is expected to patch those in. We PATCH rather than
    # $patch:delete-and-reship, because the base carries TWO routes whose
    # split is a design decision -- the http one redirects, the https one
    # serves -- and re-shipping them here would fork that decision into the
    # bundle.
    #
    # parentRefs is a list on a CRD, so kustomize replaces it wholesale rather
    # than merging into it. Every field has to be repeated, sectionName
    # included: dropping it would attach the route to every listener.
    - target:
        kind: HTTPRoute
        name: schmetterpause
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: schmetterpause
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: https
          hostnames:
            - ${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}
    # The address the QR sheet points phones at. The base ships the same
    # placeholder host as its routes (schmetterpause.cluster.example.com), so
    # left alone every printed code leads to a host that does not exist, while
    # the app itself looks healthy. labda-dev-a served exactly that.
    #
    # Set rather than removed. Unset, schmetterpause reads the address off the
    # request, and behind the gateway that request no longer carries the
    # public scheme and host: the gateway terminates TLS. That is the case
    # upstream says to set it for (internal/config/config.go). Built from the
    # same hostname the HTTPRoutes publish, so the two cannot disagree.
    #
    # ADDED, not replaced: `add` on an existing key replaces it, and it also
    # works on a base version that leaves the key out.
    - target:
        kind: ConfigMap
        name: schmetterpause-config
      patch: |
        - op: add
          path: /data/SP_PUBLIC_BASE_URL
          value: "https://${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}"
    - target:
        kind: HTTPRoute
        name: schmetterpause-redirect
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: schmetterpause-redirect
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: http
          hostnames:
            - ${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}
    # Stakater Reloader: roll schmetterpause when schmetterpause-config or one of
    # its Secrets (schmetterpause-app, schmetterpause-db) changes. It reads them
    # only at start, so on labda-dev-a both the scoreboard token (a new key in
    # schmetterpause-app) and SP_BOOTSTRAP_ADMIN sat unused until a manual
    # rollout restart -- /api/players stayed a 404 with the token already in the
    # Secret. Same patch as zaehlwerk's. No-op on clusters without the Reloader
    # controller (infra/reloader).
    #
    # A restart signs nobody out and loses nothing: the session key is in the
    # Secret, the database is its own Cluster, and the migrate init container
    # has nothing to do on an unchanged image. An ExternalSecret refresh that
    # rewrites identical data does not change the hash Reloader compares.
    - target:
        kind: Deployment
        name: schmetterpause
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: schmetterpause
          annotations:
            reloader.stakater.com/auto: "true"
