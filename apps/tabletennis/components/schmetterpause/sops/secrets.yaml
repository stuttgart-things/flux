---
# The two Secrets the base's ExternalSecrets would have written, with the same
# names, keys and types -- the Deployment and database.yaml read them by name
# and cannot tell the difference.
#
# NO DEFAULTS, and what an unset value does is worth knowing exactly: it is
# NOT refused at apply. It renders `KEY:` (YAML null), and for a Secret's
# stringData the API server stores that as "" -- checked with a server-side
# dry-run. What catches it is schmetterpause itself: it refuses to serve with
# an SP_SESSION_KEY that is empty or shorter than 32 characters
# (internal/config/config.go), so the pod does not come up and the Kustomization
# does not go Ready. A default would be worse on both counts: long enough to
# pass that check, and readable by anyone here.
#
# The values are substituted into YAML unquoted -- kustomize drops quotes before
# Flux substitutes. Generate the session key with `openssl rand -base64 32`, as
# schmetterpause's own error message says. The password also lands in the URL
# below, where base64's `/` and `+` break it: use `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: schmetterpause-app
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
type: Opaque
stringData:
  SP_SESSION_KEY: ${SCHMETTERPAUSE_SESSION_KEY}
---
# THREE keys, and the third is built here. The `migrate` init container and the
# main container both read SP_DATABASE_URL, which the ESO path synthesises in
# its target.template; a Secret carrying only username and password leaves the
# pod in Init:CreateContainerConfigError ("couldn't find key SP_DATABASE_URL").
# `?sslmode=require` because CNPG serves the database over TLS
# (schmetterpause-db-server).
#
# kubernetes.io/basic-auth, as the ESO template declares it. A Secret's type is
# immutable, so matching it is what lets a cluster move between ../eso and this
# without deleting the Secret by hand first -- see the README.
#
# username is FIXED: database.yaml bootstraps the database with owner
# `schmetterpause` from this Secret, and a different name here is a role the
# application cannot log in as.
apiVersion: v1
kind: Secret
metadata:
  name: schmetterpause-db
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
type: kubernetes.io/basic-auth
stringData:
  username: schmetterpause
  password: ${SCHMETTERPAUSE_DB_PASSWORD}
  SP_DATABASE_URL: postgresql://schmetterpause:${SCHMETTERPAUSE_DB_PASSWORD}@schmetterpause-db-rw.${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}.svc:5432/schmetterpause?sslmode=require
