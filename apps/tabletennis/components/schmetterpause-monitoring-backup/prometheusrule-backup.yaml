---
# WAL archiving and base backups -- the half of the alerting that only makes
# sense where components/schmetterpause-db-backup is selected too.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: schmetterpause-backup
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
  labels:
    app.kubernetes.io/name: schmetterpause
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: schmetterpause.backup
      rules:
        # EVERY EXPRESSION IN THIS GROUP READS max_over_time(...[15m]) AND EVERY
        # RULE CARRIES keep_firing_for. Both are load-bearing, measured on
        # homerun2-test1 after the 09-21..09-24 outage (stuttgart-things#3192).
        #
        # SchmetterpauseBackupTooOld notified 34 times and resolved itself 34
        # times across those two and a half days, flapping every 30-90 minutes,
        # while its condition was CONTINUOUSLY TRUE -- the last backup timestamp
        # sat frozen at 09-21 03:00 the whole time. The channel's final word, on
        # 09-24 11:37, was "Resolved", two hours before a backup actually ran.
        # An alert that says broken/fixed 34 times is correctly ignored.
        #
        # It was NOT the series going absent and NOT a label change: one stable
        # series, Prometheus with zero restarts, zero missed rule iterations and
        # 2ms evaluations. It was SINGLE-SCRAPE DROPOUTS. Over the outage the raw
        # expression was true for 3081 of 3211 minutes across 127 interruptions --
        # 124 of them exactly ONE minute. Each one resets the `for:` timer, so a
        # 30-minute `for` can only fire when a clean 30-minute run happens to
        # occur. The sicker the cluster, the flakier its scrapes: the rule is
        # least able to fire exactly when it matters most.
        #
        # max_over_time(...[15m]) bridges a dropout instead of evaluating to
        # empty. The same query over the same window: true for 3211 of 3211
        # minutes, zero interruptions. keep_firing_for carries the alert through
        # anything longer. An exporter gone for good is already covered by
        # SchmetterpauseDatabaseExporterDown, so no absent_over_time is needed.
        # NOT "seconds since the last archival". With nobody writing, no WAL
        # segment fills and that number grows all night while everything is fine.
        # A failure NEWER than the last success is the signal.
        - alert: SchmetterpauseWALArchivingFailing
          expr: max_over_time(cnpg_pg_stat_archiver_last_failed_time{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"}[15m]) > max_over_time(cnpg_pg_stat_archiver_last_archived_time{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"}[15m])
          for: 15m
          keep_firing_for: 1h
          labels:
            severity: critical
          annotations:
            summary: WAL archiving of schmetterpause-db is failing
            description: The last WAL archive attempt of schmetterpause-db failed and none has succeeded since, for 15 minutes. Point-in-time recovery stops at the last archived segment.
        - alert: SchmetterpauseWALArchiveBacklog
          expr: max_over_time(cnpg_collector_pg_wal_archive_status{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}", value="ready"}[15m]) > 10
          for: 30m
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: WAL segments of schmetterpause-db are waiting to be archived
            description: More than 10 WAL segments of schmetterpause-db have been ready for archiving for 30 minutes.
        # The Barman Cloud PLUGIN's own timestamp.
        # `cnpg_collector_last_available_backup_timestamp` stays 0 for plugin
        # backups, so it cannot be used here; this series is the one the plugin
        # publishes. It is absent entirely on a Cluster with no ObjectStore, which
        # is why these rules are a variant rather than always shipped -- an
        # absent series means this alert can never fire, and a rule that can never
        # fire is worse than no rule.
        #
        # The threshold arrives as the PRODUCT `26 * 3600`, not as a number of
        # seconds: postBuild.substitute takes strings only, and a bare int fails
        # every substitution in the block, not just this one (hack/
        # check-substitute-strings.py catches it). PromQL evaluates the product,
        # and comparison binds looser than `*`, so this reads
        # (time() - ts) > (26 * 3600).
        - alert: SchmetterpauseBackupTooOld
          expr: time() - max_over_time(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"}[15m]) > ${SCHMETTERPAUSE_BACKUP_MAX_AGE_SECONDS:-26 * 3600}
          for: 30m
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: No recent base backup of schmetterpause-db
            description: The newest base backup of schmetterpause-db has aged past the configured maximum (${SCHMETTERPAUSE_BACKUP_MAX_AGE_SECONDS:-26 * 3600} seconds); the daily ScheduledBackup has not completed.
        - alert: SchmetterpauseBackupFailed
          expr: max_over_time(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"}[15m]) > max_over_time(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}"}[15m])
          for: 5m
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            summary: The last base backup of schmetterpause-db failed
            description: A base backup of schmetterpause-db failed after the last successful one. `kubectl -n ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause} get backup` shows which.
