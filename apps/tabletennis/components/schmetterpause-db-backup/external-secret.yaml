---
# The S3 pair AND the CA bundle the ObjectStore verifies the endpoint with, in
# one Secret.
#
# The CA is the problem this solves. endpointCA must name a SECRET, and the
# cluster's trust bundle exists only as the cluster-trust-bundle ConfigMap that
# trust-manager publishes into every namespace. templateFrom copies that
# ConfigMap's key into this Secret verbatim (checked byte for byte on
# labda-dev-a) and follows it on every refresh, so a rotated Vault PKI CA
# arrives without anybody copying a certificate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schmetterpause-db-backup
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${SECRET_STORE_NAME:-set-TABLETENNIS_SECRET_STORE}
  target:
    name: schmetterpause-db-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .access_key }}"
        ACCESS_SECRET_KEY: "{{ .secret_key }}"
      templateFrom:
        - configMap:
            name: cluster-trust-bundle
            items:
              - key: trust-bundle.pem
                templateAs: Values
  data:
    - secretKey: access_key
      remoteRef:
        key: ${SCHMETTERPAUSE_BACKUP_SECRET_PATH:-schmetterpause-backup}
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: ${SCHMETTERPAUSE_BACKUP_SECRET_PATH:-schmetterpause-backup}
        property: secret_key
