---
# A daily base backup. WAL is archived continuously in between, so a recovery
# can reach any point after the oldest base backup the retention keeps.
#
# CloudNativePG's schedule has SIX fields -- seconds first. `immediate` takes one
# backup as soon as this is created, so a fresh cluster has something to recover
# from before the first night.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: schmetterpause-db-daily
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
spec:
  schedule: "${SCHMETTERPAUSE_BACKUP_SCHEDULE:-0 0 3 * * *}"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: schmetterpause-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
