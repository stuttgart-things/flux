---
# The app's own /metrics.
#
# The container port `metrics` exists since schmetterpause v0.8.0
# (SP_METRICS_ADDR); the Service does not name it, so it is reachable from inside
# the cluster only -- which is why this is a PodMonitor and not a ServiceMonitor.
#
# DISCOVERY DOES NOT DEPEND ON THE LABELS BELOW. infra/kube-prometheus-stack sets
# `podMonitorSelectorNilUsesHelmValues: false`, which leaves the Prometheus with
# an empty selector, and an empty selector matches every PodMonitor in every
# namespace. The labels are here so this object still resolves on a cluster whose
# Prometheus narrows that selector, the way infra/prometheus-pve-exporter's
# monitor does.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: schmetterpause
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
  labels:
    app.kubernetes.io/name: schmetterpause
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      # The label the published kustomize base puts on the app's pods.
      app.kubernetes.io/name: schmetterpause
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: ${SCHMETTERPAUSE_MONITORING_INTERVAL:-60s}
---
# The CloudNativePG instances, which export on port `metrics` (9187) -- including
# the Barman Cloud plugin's backup timestamps, which the backup variant's rules
# read.
#
# A PodMonitor of our own rather than the Cluster's
# `spec.monitoring.enablePodMonitor`, which CloudNativePG 1.30 marks deprecated
# in favour of exactly this. It also keeps components/schmetterpause/database.yaml
# free of a field whose meaning depends on whether this component is selected.
#
# The cluster name is FIXED rather than substituted, for the same reason
# database.yaml fixes it: the base's ExternalSecret builds a DSN naming
# `schmetterpause-db`, so it is not a variable anywhere in this bundle.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: schmetterpause-db
  namespace: ${SCHMETTERPAUSE_NAMESPACE:-schmetterpause}
  labels:
    app.kubernetes.io/name: schmetterpause-db
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: schmetterpause-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: ${SCHMETTERPAUSE_MONITORING_INTERVAL:-60s}
