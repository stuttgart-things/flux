---
# The Secret the base's ExternalSecret would have written: same name, same
# keys.
#
# SENTINEL DEFAULTS, unlike schmetterpause's required values -- and the
# difference is deliberate. zaehlwerk reads both keys with `optional: true` and
# uses them only when a panel is wired (zaehlwerk-panel-homerun2), so a cluster
# without one has nothing to put here. And both are CLIENT credentials: a
# sentinel sent to omni-pitcher or Redis is refused, not trusted. The cost is
# that a panel with the variables unset fails with auth errors in zaehlwerk's
# log instead of at apply time.
#
# A sentinel rather than leaving them bare: unset, a bare reference would be
# stored as "" (a Secret's stringData turns YAML null into an empty string), and
# an empty token is harder to tell apart from a wrong one than a value that
# names the variable to set.
apiVersion: v1
kind: Secret
metadata:
  name: zaehlwerk-panel
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
type: Opaque
stringData:
  OMNI_PITCHER_TOKEN: ${ZAEHLWERK_OMNI_PITCHER_TOKEN:-set-ZAEHLWERK_OMNI_PITCHER_TOKEN}
  REDIS_PASSWORD: ${ZAEHLWERK_REDIS_PASSWORD:-set-ZAEHLWERK_REDIS_PASSWORD}
