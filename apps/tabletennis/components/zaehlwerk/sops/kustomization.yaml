---
# zaehlwerk: credentials as a plain Secret substituted from the consumer's
# substituteFrom Secret. profiles/sops selects this; ../eso is the alternative.
#
# Only a cluster with a panel sets anything -- see secrets.yaml:
#   ZAEHLWERK_OMNI_PITCHER_TOKEN   the panel's token for omni-pitcher
#   ZAEHLWERK_REDIS_PASSWORD
#
# With the handover, add ../../zaehlwerk-handover-sops rather than -on: -on
# writes its token into the ExternalSecret this deletes, and refuses to build
# here (flux#526).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - secrets.yaml
patches:
  # Deleted rather than left unsynced: without ESO its CRD is missing and the
  # dry-run fails the whole zaehlwerk Kustomization. See ../../schmetterpause/sops.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: zaehlwerk
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: ExternalSecret
            name: zaehlwerk-panel
          patch: |
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: zaehlwerk-panel
            $patch: delete
  # Which credential mode this build is in, for the components that only work
  # in one of them: they test this annotation and fail the build on the wrong
  # one instead of delivering nothing (flux#526).
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: zaehlwerk
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: zaehlwerk
        annotations:
          tabletennis.stuttgart-things.com/credentials: sops
