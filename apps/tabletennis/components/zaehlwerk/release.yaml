---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zaehlwerk
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: zaehlwerk-kustomize
  prune: true
  wait: true
  targetNamespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  # Credentials are not patched here: the base's ExternalSecret is pointed at
  # the store by ./eso, or replaced with a plain Secret by ./sops -- a profile
  # selects one of the two.
  patches:
    # parentRefs is a list on a CRD: kustomize replaces it rather than merging,
    # so every field is repeated here, sectionName included.
    - target:
        kind: HTTPRoute
        name: zaehlwerk
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: zaehlwerk
        spec:
          parentRefs:
            - name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: https
          hostnames:
            - ${ZAEHLWERK_HOSTNAME:-zaehlwerk}.${DOMAIN}
    # No panel unless a cluster asks for one, and the only form of "none" that
    # zaehlwerk accepts is the variable being UNSET: it tests
    # `os.Getenv("OMNI_PITCHER_URL") != ""`, so any non-empty sentinel would be
    # taken for a URL. The base ships a placeholder
    # (https://omni-pitcher.example.com) that would be dialled forever.
    #
    # So the key is REMOVED rather than substituted. An empty substitution is
    # not possible at all: Flux replaces an unset ${VAR} with nothing,
    # kustomize has already dropped the quotes, and `KEY:` is YAML null --
    # which the API server rejects, failing the parent Kustomization. That
    # happened on labda-dev-a with a bare ${VAR} whose empty-string
    # behaviour had been assumed rather than observed.
    #
    # A cluster that has a panel adds its own patch setting the key.
    - target:
        kind: ConfigMap
        name: zaehlwerk-config
      patch: |
        - op: remove
          path: /data/OMNI_PITCHER_URL
    # Browser origins allowed to read the live match stream. schmetterpause's
    # own origin by default, so its live tab can read a running match the moment
    # that tab exists; upstream refuses the `*` wildcard on purpose
    # (internal/api/stream.go) and this is the only origin that will ever need
    # it.
    #
    # Empty is a supported value -- allowedOrigins() returns nil on an empty
    # string and logs that cross-origin browsers cannot read the stream -- so
    # like SP_BOOTSTRAP_ADMIN this is a plain substitution rather than an on/off
    # component. The quotes are the same load-bearing ones: without them an unset
    # variable renders `value:` and YAML null fails the whole apps layer.
    #
    # ADDED rather than replaced: the base leaves the key out entirely when its
    # own allowedOrigins is empty, and the published profile leaves it empty.
    - target:
        kind: ConfigMap
        name: zaehlwerk-config
      patch: |
        - op: add
          path: /data/ALLOWED_ORIGINS
          value: "${ZAEHLWERK_ALLOWED_ORIGINS:-https://${SCHMETTERPAUSE_HOSTNAME:-schmetterpause}.${DOMAIN}}"
    # Stakater Reloader: roll zaehlwerk when zaehlwerk-config or one of its
    # Secrets changes. zaehlwerk reads them only at start, so a changed
    # ConfigMap -- e.g. the panel URLs from zaehlwerk-panel-homerun2 -- sat
    # unnoticed until a manual rollout restart on labda-dev-a. No-op on
    # clusters without the Reloader controller (infra/reloader).
    - target:
        kind: Deployment
        name: zaehlwerk
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: zaehlwerk
          annotations:
            reloader.stakater.com/auto: "true"
