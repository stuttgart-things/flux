---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zaehlwerk
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: zaehlwerk-kustomize
  prune: true
  wait: true
  targetNamespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  patches:
    # parentRefs is a list on a CRD: kustomize replaces it rather than merging,
    # so every field is repeated here, sectionName included.
    - target:
        kind: HTTPRoute
        name: zaehlwerk
      patch: |
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: zaehlwerk
        spec:
          parentRefs:
            - name: ${GATEWAY_NAME}
              namespace: ${GATEWAY_NAMESPACE:-default}
              sectionName: https
          hostnames:
            - ${ZAEHLWERK_HOSTNAME:-zaehlwerk}.${DOMAIN}
    - target:
        kind: ExternalSecret
        name: zaehlwerk-panel
      patch: |
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: zaehlwerk-panel
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: ${SECRET_STORE_NAME:-set-TABLETENNIS_SECRET_STORE}
    # No panel unless a cluster asks for one, and the only form of "none" that
    # zaehlwerk accepts is the variable being UNSET: it tests
    # `os.Getenv("OMNI_PITCHER_URL") != ""`, so any non-empty sentinel would be
    # taken for a URL. The base ships a placeholder
    # (https://omni-pitcher.example.com) that would be dialled forever.
    #
    # So the key is REMOVED rather than substituted. An empty substitution is
    # not possible at all: Flux replaces an unset ${VAR} with nothing,
    # kustomize has already dropped the quotes, and `KEY:` is YAML null --
    # which the API server rejects, failing the parent Kustomization. That
    # happened on labda-dev-a with a bare ${VAR} whose empty-string
    # behaviour had been assumed rather than observed.
    #
    # A cluster that has a panel adds its own patch setting the key.
    - target:
        kind: ConfigMap
        name: zaehlwerk-config
      patch: |
        - op: remove
          path: /data/OMNI_PITCHER_URL
