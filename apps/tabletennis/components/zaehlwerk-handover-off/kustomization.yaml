---
# zaehlwerk-handover-off -- zaehlwerk scoring and reporting nowhere: the
# default. Selected through TABLETENNIS_ZAEHLWERK_HANDOVER (default off).
#
# Empty on purpose. zaehlwerk reads SCHMETTERPAUSE_URL as the on-switch, and the
# base leaves the key out, so "off" is already what the base renders --
# ADR-0004 keeps running without a handover a first-class way to use it, not a
# degraded one.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# `patches: []` rather than nothing at all. kustomize refuses a kustomization.yaml
# with no directives -- "kustomization.yaml is empty" -- and that refusal is not
# only cosmetic: hack/check-passthrough-defaults.py renders every path with its
# DEFAULT components selected, which is exactly these, got None back, and skipped
# the whole tabletennis path in silence. The version-copy drift it exists to
# catch (flux#359, on these very variables) therefore went unchecked here.
patches: []
