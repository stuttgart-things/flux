---
# zaehlwerk-buttons-sim-on -- the table mock next to zaehlwerk (zaehlwerk
# tools/chain-mock/buttons, image zaehlwerk-buttons). Selected with
# TABLETENNIS_ZAEHLWERK_BUTTONS_SIM: on.
#
# Two emulated wireless buttons and their hub, with a page to press them on, at
# https://<ZAEHLWERK_BUTTONS_HOSTNAME>.<DOMAIN>: short = a point, long = take
# one back, both long = both_long, and switches for the faults the radio and
# the hub can have. For trying the gestures of zaehlwerk-firmware#56 before the
# buttons exist as hardware.
#
# The page also runs a piezo board through its control endpoint
# (ZAEHLWERK_BUTTONS_PIEZO_URL, the piezo-sim's Service by default): pause it,
# try the buttons without a second scorer, turn its faults up. With the
# piezo-sim off the page says the board is not answering; point the variable
# at another board, or ignore it.
#
# THE PAGE TAKES POINTS BACK, and it is not behind a login. It scores into the
# running match like the real buttons, and a won match is handed over like any
# other. For demo, test and lab clusters, not one whose league counts.
#
# REQUIRES ZAEHLWERK v0.10.0 OR LATER for the image, v0.11.0 for the piezo
# section. Settings and the log live in the pod's memory and are shared by
# everyone on the page -- one replica, as for one table and one hub.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# The scoring page links the table mock as "Buttons" (zaehlwerk v0.22.0):
# BUTTONS_URL on zaehlwerk-config, the route's host above, as
# zaehlwerk-pong-on sets PONG_URL. A ConfigMap key, so both credential modes
# get it; older tags ignore it.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: zaehlwerk
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: ConfigMap
            name: zaehlwerk-config
          patch: |
            - op: add
              path: /data/BUTTONS_URL
              value: "https://${ZAEHLWERK_BUTTONS_HOSTNAME:-zaehlwerk-buttons}.${LINK_DOMAIN:-${DOMAIN}}"
  # Its part on the dev portal, when zaehlwerk-portal-on is selected too
  # (it comes first in the bundles); a no-op target otherwise. The board the
  # page runs goes on the portal as well, so a board that is not the
  # piezo-sim (a lab's emulated ESP board) shows there too. With the
  # piezo-sim on and the default URL that is the same value it sets itself.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: zaehlwerk-portal
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target:
            kind: ConfigMap
            name: zaehlwerk-portal-config
          patch: |
            - op: add
              path: /data/BUTTONS_URL
              value: "http://zaehlwerk-buttons-sim"
            - op: add
              path: /data/BUTTONS_PUBLIC_URL
              value: "https://${ZAEHLWERK_BUTTONS_HOSTNAME:-zaehlwerk-buttons}.${LINK_DOMAIN:-${DOMAIN}}"
            - op: add
              path: /data/PIEZO_CONTROL_URL
              value: "${ZAEHLWERK_BUTTONS_PIEZO_URL:-http://zaehlwerk-piezo-sim:8081}"
