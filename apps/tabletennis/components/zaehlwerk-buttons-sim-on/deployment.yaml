---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaehlwerk-buttons-sim
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  labels:
    app.kubernetes.io/name: zaehlwerk-buttons-sim
    app.kubernetes.io/part-of: zaehlwerk
spec:
  # One: the page's settings and log are in memory, shared by everyone on it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zaehlwerk-buttons-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zaehlwerk-buttons-sim
        app.kubernetes.io/part-of: zaehlwerk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: buttons
          image: ghcr.io/stuttgart-things/zaehlwerk-buttons:${ZAEHLWERK_BUTTONS_VERSION:-v0.46.0}
          env:
            # The hub calls zaehlwerk by its Service, like the piezo-sim.
            - name: ZAEHLWERK_URL
              value: http://zaehlwerk
            # What the page links to for starting a match: the browser's way
            # in, not the Service name above.
            - name: ZAEHLWERK_PUBLIC_URL
              value: "https://${ZAEHLWERK_HOSTNAME:-zaehlwerk}.${LINK_DOMAIN:-${DOMAIN}}"
            - name: BUTTONS_ADDR
              value: ":8084"
            - name: PIEZO_CONTROL_URL
              value: "${ZAEHLWERK_BUTTONS_PIEZO_URL:-http://zaehlwerk-piezo-sim:8081}"
            # The device the page starts on: button (one key, short/long),
            # keys (two keys per half, v0.28.0+) or display. The page can
            # switch at runtime; this is what a restart comes back to.
            - name: BUTTONS_DEVICE
              value: "${ZAEHLWERK_BUTTONS_DEVICE:-button}"
            # The bearer the hub sends with a fob check-in (v0.18.0): the
            # value zaehlwerk-checkin-sops writes into zaehlwerk's own Secret.
            # Optional, so without that switch the key is absent, the page's
            # fobs are refused (503) and points still score.
            - name: CHECKIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zaehlwerk-panel
                  key: CHECKIN_TOKEN
                  optional: true
            # The players the page offers a fob for (v0.20.0): zaehlwerk's
            # own Schmetterpause and token, both optional. Without them the
            # page offers only the two fobs that belong to nobody.
            - name: SCHMETTERPAUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: zaehlwerk-config
                  key: SCHMETTERPAUSE_URL
                  optional: true
            - name: SCHMETTERPAUSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zaehlwerk-panel
                  key: SCHMETTERPAUSE_TOKEN
                  optional: true
            # SCHMETTERPAUSE_URL may be an https host behind the cluster's
            # own CA, as zaehlwerk's is: trust-manager's bundle, the way
            # zaehlwerk mounts it, optional where there is none.
            - name: SSL_CERT_DIR
              value: /etc/ssl/cluster-trust
          volumeMounts:
            - name: cluster-trust
              mountPath: /etc/ssl/cluster-trust
              readOnly: true
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: cluster-trust
          configMap:
            name: cluster-trust-bundle
            optional: true
            items:
              - key: trust-bundle.pem
                path: ca.pem
