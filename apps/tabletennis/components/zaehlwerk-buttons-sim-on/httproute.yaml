---
# On the same gateway and listener as zaehlwerk's own route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-buttons-sim
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  labels:
    app.kubernetes.io/name: zaehlwerk-buttons-sim
    app.kubernetes.io/part-of: zaehlwerk
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE:-default}
      sectionName: https
  hostnames:
    - ${ZAEHLWERK_BUTTONS_HOSTNAME:-zaehlwerk-buttons}.${DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-buttons-sim
          port: 80
