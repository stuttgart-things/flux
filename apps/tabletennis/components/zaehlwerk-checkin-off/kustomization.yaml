---
# zaehlwerk-checkin-off -- no check-in by fob: the default. Selected through
# TABLETENNIS_FOB_CHECKIN (default off) on the tabletennis-sops* bundles.
#
# Empty on purpose. Without CHECKIN_TOKEN zaehlwerk answers 503 on
# /ingest/checkin and takes no check-in from anybody (zaehlwerk#113).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# `patches: []` because kustomize refuses an empty kustomization.yaml (see
# zaehlwerk-handover-off).
patches: []
