---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaehlwerk-pong
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  labels:
    app.kubernetes.io/name: zaehlwerk-pong
    app.kubernetes.io/part-of: zaehlwerk
spec:
  # One: a game is in the memory of the pod playing it, and a browser game's
  # token is known to that pod only.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zaehlwerk-pong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zaehlwerk-pong
        app.kubernetes.io/part-of: zaehlwerk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pong
          # The same tag as zaehlwerk: one release run builds both. Keep the
          # default equal to components/zaehlwerk/requirements.yaml's: the
          # sops bundles set no ZAEHLWERK_VERSION, so both fall back to it.
          image: ghcr.io/stuttgart-things/zaehlwerk-pong:${ZAEHLWERK_VERSION:-v0.41.0}
          env:
            # The game calls zaehlwerk by its Service, like the buttons sim.
            - name: ZAEHLWERK_URL
              value: http://zaehlwerk
            - name: HTTP_ADDR
              value: ":8081"
            # Fixed, not substituted: a number in postBuild.substitute fails
            # the whole layer (hack/check-substitute-strings.py). One set to
            # eleven: the length of a demo and the screensaver, and the one
            # the lobby starts on; the lobby also offers best of 3 and 5
            # (v0.22.0). The game's own default is 3.
            - name: PONG_BEST_OF
              value: "1"
            # leicht, mittel or schwer -- or two of them, comma-separated, one
            # per bot.
            - name: PONG_BOT_SKILL
              value: "${ZAEHLWERK_PONG_BOT_SKILL:-mittel}"
            # The names the lobby offers (v0.22.0): zaehlwerk's own
            # Schmetterpause and token, both optional, as the buttons sim
            # reads them. Names only -- a pong game is a demo and is never
            # reported (zaehlwerk ADR-0008). Without them the name fields
            # are free text, as before.
            - name: SCHMETTERPAUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: zaehlwerk-config
                  key: SCHMETTERPAUSE_URL
                  optional: true
            - name: SCHMETTERPAUSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zaehlwerk-panel
                  key: SCHMETTERPAUSE_TOKEN
                  optional: true
            # SCHMETTERPAUSE_URL may be an https host behind the cluster's
            # own CA: trust-manager's bundle, as zaehlwerk and the buttons
            # sim mount it, optional where there is none.
            - name: SSL_CERT_DIR
              value: /etc/ssl/cluster-trust
            # PONG_ATTRACT_AFTER is left out on purpose: unset is how the game
            # switches attract mode off, and an empty value cannot be carried
            # through postBuild.substitute. ../zaehlwerk-pong-attract adds it.
          volumeMounts:
            - name: cluster-trust
              mountPath: /etc/ssl/cluster-trust
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
          # /healthz says the process is up and does not ask zaehlwerk: a
          # zaehlwerk that is down is a game that cannot start, not a pod to
          # restart.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: cluster-trust
          configMap:
            name: cluster-trust-bundle
            optional: true
            items:
              - key: trust-bundle.pem
                path: ca.pem
