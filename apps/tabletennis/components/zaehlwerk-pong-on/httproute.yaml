---
# On the same gateway and listener as zaehlwerk's own route. Only for playing
# in a browser; attract mode needs no route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zaehlwerk-pong
  namespace: ${ZAEHLWERK_NAMESPACE:-zaehlwerk}
  labels:
    app.kubernetes.io/name: zaehlwerk-pong
    app.kubernetes.io/part-of: zaehlwerk
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE:-default}
      sectionName: https
  hostnames:
    - ${ZAEHLWERK_PONG_HOSTNAME:-zaehlwerk-pong}.${DOMAIN}
  rules:
    - backendRefs:
        - name: zaehlwerk-pong
          port: 80
