---
# The CA the workflow container trusts when it calls Backstage.
#
# The pod does not start without it. template-execution swaps the base's
# ConfigMap-backed backstage-ca volume for a SECRET-backed one and points
# SSL_CERT_FILE at it, so a missing Secret is not a degraded workflow -- it is
# `MountVolume.SetUp failed for volume "backstage-ca"` and ContainerCreating
# forever, while the Kustomization above reports only its own timeout.
#
# It is a CA certificate, not a credential, and it lives beside the tokens
# anyway: this is the one place a cluster is told what its Backstage is, and
# splitting "the endpoint's tokens" from "the endpoint's CA" across two
# mechanisms is how they end up describing two different endpoints.
#
# NOT the cluster's own PKI. A LabDA cicd cluster calls the Backstage on
# platform-sthings, which is signed by LabUL's Vault PKI -- copying the local
# vault-pki-ca in here yields a bundle that validates nothing and an error that
# blames TLS rather than the bundle.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-ca
  namespace: ${DAPR_BACKSTAGE_TPL_NAMESPACE:-backstage-workflows}
spec:
  refreshInterval: ${DAPR_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${DAPR_ESO_STORE_NAME:-set-DAPR_ESO_STORE_NAME}
    kind: ${DAPR_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: backstage-ca
    creationPolicy: Owner
  data:
    # ca.crt exactly: the volume selects that key by name, and a Secret with
    # the right content under a different key mounts an empty directory.
    - secretKey: ca.crt
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_ESO_BACKSTAGE_CA_PROPERTY:-backstage_ca}
