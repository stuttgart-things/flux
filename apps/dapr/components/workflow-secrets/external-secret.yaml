---
# The Secret that dapr-workflows SUBSTITUTES FROM, which is why it cannot live
# in that Kustomization: postBuild reads it while building, so a Secret created
# by the same apply does not exist yet and never will -- Flux applies nothing
# and retries forever on "secret not found". It gets its own Kustomization,
# ordered ahead of the one that consumes it.
#
# In flux-system, and not in the workflow namespace: substituteFrom resolves in
# the KUSTOMIZATION's namespace. The Secrets these values end up in are rendered
# into ${DAPR_BACKSTAGE_TPL_NAMESPACE} by the template-execution component.
#
# The key names are the substitution variables verbatim. A renamed key does not
# fail: the variable simply stays unsubstituted or renders empty, and a GitHub
# token that is present and empty is accepted by everything until it 401s.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dapr-workflows-secrets
  namespace: flux-system
spec:
  refreshInterval: ${DAPR_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${DAPR_ESO_STORE_NAME:-set-DAPR_ESO_STORE_NAME}
    kind: ${DAPR_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: ${DAPR_WORKFLOWS_SECRET:-dapr-workflows-secrets}
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_ESO_GITHUB_TOKEN_PROPERTY:-github_token}
    - secretKey: BACKSTAGE_AUTH_TOKEN
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_ESO_BACKSTAGE_TOKEN_PROPERTY:-backstage_token}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_ESO_REDIS_PASSWORD_PROPERTY:-redis_password}
