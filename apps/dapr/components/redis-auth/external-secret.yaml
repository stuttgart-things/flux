---
# The password the redis-stack chart expects to already exist.
#
# The chart is configured with auth.existingSecret and creates NOTHING itself:
# without this the HelmRelease installs, the pods stay Pending on a missing
# secret, and the Kustomization reports the timeout rather than the cause.
#
# It reads the SAME Vault field as REDIS_PASSWORD in dapr-workflows-secrets, and
# that is the point of putting them in one place: two entries holding "the redis
# password" drift the first time somebody rotates one of them, and the symptom
# is a Dapr component that cannot connect while every object involved is Ready.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: ${DAPR_REDIS_NAMESPACE:-dapr-redis}
spec:
  refreshInterval: ${DAPR_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${DAPR_ESO_STORE_NAME:-set-DAPR_ESO_STORE_NAME}
    kind: ${DAPR_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: ${DAPR_REDIS_AUTH_SECRET:-redis-auth}
    creationPolicy: Owner
  data:
    # The key the chart looks for is auth.existingSecretPasswordKey; keep the
    # two in step or the chart reads an absent key and starts with no password.
    - secretKey: ${DAPR_REDIS_AUTH_KEY:-password}
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_ESO_REDIS_PASSWORD_PROPERTY:-redis_password}
