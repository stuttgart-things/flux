---
# omni-pitcher's bearer token for the worker's homerun2 sink, out of the same
# Vault entry as dapr-workflows' own secrets:
#
#   <mount>/dapr-workflows   homerun_auth_token   (a copy of omni-pitcher's
#                            AUTH_TOKEN, platform-sthings Secret
#                            homerun2/homerun2-omni-pitcher-token, key auth-token)
#
# Its own ExternalSecret, rendered straight into the worker namespace, and NOT
# a fourth entry of dapr-workflows-secrets: that one is shared by every
# dapr-workflows cluster, ESO fails the whole Secret when one property is
# missing, and a key added to it by hand is overwritten (creationPolicy
# Owner). Here a missing property costs only the homerun sink.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homerun-pitcher-token
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
spec:
  refreshInterval: ${DAPR_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${DAPR_ESO_STORE_NAME:-set-DAPR_ESO_STORE_NAME}
    kind: ${DAPR_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: homerun-pitcher-token
    creationPolicy: Owner
  data:
    # `token` exactly: the volume selects that key by name.
    - secretKey: token  # pragma: allowlist secret
      remoteRef:
        key: ${DAPR_ESO_SECRET_PATH:-dapr-workflows}
        property: ${DAPR_CBW_HOMERUN_TOKEN_PROPERTY:-homerun_auth_token}
