---
# The bearer token for machinery's gRPC API, from the cluster's Vault:
#
#   <mount>/machinery-grpc   token
#
# The SAME entry and property the server reads (flux cicd/machinery/auth), and
# both are filled from ONE source, apps/cicd-defaults:machinery_grpc_token in
# the LabDA Vault (stuttgart-things hack/cluster-secret-policy.yaml), so the
# worker cluster and the machinery cluster cannot hold different tokens.
#
# Its own ExternalSecret, not a property of dapr-workflows-secrets, for the
# same reason as homerun-pitcher-token: that one is shared by every
# dapr-workflows cluster and ESO fails the whole Secret over one missing
# property.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: machinery-auth-token
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
spec:
  refreshInterval: ${DAPR_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${DAPR_ESO_STORE_NAME:-set-DAPR_ESO_STORE_NAME}
    kind: ${DAPR_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: machinery-auth-token
    creationPolicy: Owner
  data:
    # `token` exactly: the volume selects that key by name.
    - secretKey: token  # pragma: allowlist secret
      remoteRef:
        key: ${DAPR_CBW_MACHINERY_TOKEN_PATH:-machinery-grpc}
        property: ${DAPR_CBW_MACHINERY_TOKEN_PROPERTY:-token}
