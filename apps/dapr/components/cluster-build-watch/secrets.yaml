---
# Same Redis as backstage-template-execution: the password comes from the
# dapr-workflows-secrets Secret (substituteFrom on the cicd component).
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
type: Opaque
stringData:
  password: ${REDIS_PASSWORD}
---
# The worker's DIRECT notification sinks (Teams card, CloudEvent webhook).
# Empty means off; the status ConfigMap is always written. Empty is the normal
# case: Teams goes through homerun2 instead -- select the
# cluster-build-watch-homerun variant, whose sink pitches to omni-pitcher and
# whose notification-catcher posts the card (stuttgart-things/dapr-workflows#49).
#
# The two variables are read from the substituteFrom Secret. They are NOT
# substitute variables, because a webhook URL is a bearer capability -- and
# they CANNOT be added to dapr-workflows-secrets by hand on an ESO cluster:
# components/workflow-secrets' ExternalSecret owns that Secret
# (creationPolicy: Owner) and writes exactly its three keys, so a hand-added
# key is overwritten on the next refresh. Wiring a direct sink there means a
# property in the store AND a data entry in that ExternalSecret, which is
# shared by every dapr-workflows cluster (a missing property fails the whole
# Secret). Only a cluster whose dapr-workflows-secrets is NOT ESO-managed can
# simply carry DAPR_CBW_TEAMS_WEBHOOK_URL / DAPR_CBW_STATUS_WEBHOOK_URL.
apiVersion: v1
kind: Secret
metadata:
  name: notify-webhooks
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
type: Opaque
stringData:
  teams: "${DAPR_CBW_TEAMS_WEBHOOK_URL:-}"
  webhook: "${DAPR_CBW_STATUS_WEBHOOK_URL:-}"
