---
# Same Redis as backstage-template-execution: the password comes from the
# dapr-workflows-secrets Secret (substituteFrom on the cicd component).
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
type: Opaque
stringData:
  password: ${REDIS_PASSWORD}
---
# Notification sinks. Empty means off; the status ConfigMap is always written.
# A Teams/webhook URL is a bearer capability, so it is NOT a substitute
# variable: a cluster that wants notifications adds the keys
# DAPR_CBW_TEAMS_WEBHOOK_URL / DAPR_CBW_STATUS_WEBHOOK_URL to its
# dapr-workflows-secrets Secret (substituteFrom). Absent, they render empty.
apiVersion: v1
kind: Secret
metadata:
  name: notify-webhooks
  namespace: ${DAPR_CBW_NAMESPACE:-cluster-build-watch}
type: Opaque
stringData:
  teams: "${DAPR_CBW_TEAMS_WEBHOOK_URL:-}"
  webhook: "${DAPR_CBW_STATUS_WEBHOOK_URL:-}"
