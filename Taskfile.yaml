---
version: 3
vars:
  PROJECT:
    sh: echo ${PROJECT}
  BRANCH:
    sh: if [ $(git rev-parse --abbrev-ref HEAD) != "main" ]; then echo $(git rev-parse --abbrev-ref HEAD); else echo main ; fi
  CROSSPLANE_PACKAGE_REGISTRY: ghcr.io
  DAGGER_CROSSPLANE_MODULE: github.com/stuttgart-things/dagger/crossplane
  DAGGER_CROSSPLANE_MODULE_VERSION: v0.0.2
  DAGGER_DOCKER_MODULE: github.com/stuttgart-things/dagger/docker
  DAGGER_DOCKER_MODULE_VERSION: main

  # Renovate image used by the lint-/check-/preview-renovate tasks.
  # Tracks "latest" on purpose — that is what Mend Cloud runs against this repo.
  RENOVATE_IMAGE: renovate/renovate:latest

  # sthings-sops-cmp image (Argo CD CMP sidecar for SOPS).
  # Tag scheme: sops-age-kustomize-helm — keep in sync with ARG defaults in
  # cicd/argo-cd/sops-cmp/Dockerfile.
  SOPS_CMP_CONTEXT: ./cicd/argo-cd/sops-cmp
  SOPS_CMP_REGISTRY: ghcr.io
  SOPS_CMP_REPOSITORY: stuttgart-things/sthings-sops-cmp
  SOPS_CMP_SOPS_VERSION: 3.12.2
  SOPS_CMP_AGE_VERSION: 1.3.1
  SOPS_CMP_KUSTOMIZE_VERSION: 5.8.1
  SOPS_CMP_HELM_VERSION: 4.1.4
  SOPS_CMP_TAG: "{{.SOPS_CMP_SOPS_VERSION}}-{{.SOPS_CMP_AGE_VERSION}}-{{.SOPS_CMP_KUSTOMIZE_VERSION}}-{{.SOPS_CMP_HELM_VERSION}}"

includes:
  git:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/git/git.yaml


tasks:
  get-variables:
    desc: Get variables from app folder
    cmds:
      - |
        # INPUT FOLDER CONTAINING YAML FILES
        echo "Enter app folder path (e.g. apps/app-xy):"
        read APP_FOLDER;

        output_file="/tmp/variables.yaml"

        # CLEAR THE OUTPUT FILE
        > "$output_file"

        # ITERATE OVER ALL YAML FILES IN THE FOLDER
        find "${APP_FOLDER}" -type f -name "*.yaml" | while read -r file; do
            echo "Processing: $file..."

            # EXTRACT VARIABLES WITH DEFAULT VALUES FROM EACH YAML FILE
            grep -oP '\$\{([A-Z0-9_]+)(?::-([^\}]+))?\}' "$file" | sort | uniq | while read -r line; do

                # EXTRACT VARIABLE NAME AND DEFAULT VALUE
                var_name=$(echo "$line" | grep -oP '\$\{\K[A-Z0-9_]+')
                default_value=$(echo "$line" | grep -oP ':-\K[^}]+' || echo "")

                # WRITE TO THE OUTPUT IN YAML FORMAT (APPEND ONLY IF NOT ALREADY PRESENT)
                if ! grep -q "^$var_name:" "$output_file"; then
                    if [ -n "$default_value" ]; then
                        echo "$var_name: $default_value" >> "$output_file"
                    else
                        echo "$var_name: " >> "$output_file"
                    fi
                fi
            done
        done

        # Display the generated YAML
        cat "$output_file"

  release:
    deps:
      - check
    desc: push new version
    cmds:
      - task: pr
      - npx semantic-release --dry-run
      - npx semantic-release --debug --no-ci
      - echo released version $(git describe --tags --abbrev=0)

  do:
    desc: Select a task to run
    cmds:
      - |
        # Extract task names (keep internal colons, remove only trailing colon)
        task_name=$(task -l | awk '/^\*/ {print $2}' | sed 's/:$//' | gum choose)

        # Run the selected task
        [ -n "$task_name" ] && task "$task_name"

  lint-sops-cmp:
    desc: Hadolint the sthings-sops-cmp Dockerfile via dagger
    cmds:
      - |
        dagger call -m {{.DAGGER_DOCKER_MODULE}}@{{.DAGGER_DOCKER_MODULE_VERSION}} lint \
          --src {{.SOPS_CMP_CONTEXT}} \
          --progress plain

  build-sops-cmp:
    desc: Build sthings-sops-cmp container image locally via dagger (no push)
    cmds:
      - echo "Building {{.SOPS_CMP_REGISTRY}}/{{.SOPS_CMP_REPOSITORY}}:{{.SOPS_CMP_TAG}}"
      - |
        dagger call -m {{.DAGGER_DOCKER_MODULE}}@{{.DAGGER_DOCKER_MODULE_VERSION}} build \
          --src {{.SOPS_CMP_CONTEXT}} \
          --progress plain

  push-sops-cmp:
    desc: Build & push sthings-sops-cmp to ghcr.io via dagger
    preconditions:
      - sh: test -n "$GITHUB_USER"
        msg: "GITHUB_USER env var must be set"
      - sh: test -n "$GITHUB_TOKEN"
        msg: "GITHUB_TOKEN env var must be set"
    cmds:
      - echo "Pushing {{.SOPS_CMP_REGISTRY}}/{{.SOPS_CMP_REPOSITORY}}:{{.SOPS_CMP_TAG}}"
      - |
        dagger call -m {{.DAGGER_DOCKER_MODULE}}@{{.DAGGER_DOCKER_MODULE_VERSION}} build-and-push \
          --source {{.SOPS_CMP_CONTEXT}} \
          --repository-name {{.SOPS_CMP_REPOSITORY}} \
          --registry-url {{.SOPS_CMP_REGISTRY}} \
          --tag {{.SOPS_CMP_TAG}} \
          --registry-username env:GITHUB_USER \
          --registry-password env:GITHUB_TOKEN \
          --progress plain

  lint-renovate:
    desc: Validate renovate.json against the current Renovate config schema
    cmds:
      - |
        docker run --rm \
          -v "${PWD}/renovate.json":/tmp/renovate.json:ro \
          {{.RENOVATE_IMAGE}} \
          renovate-config-validator /tmp/renovate.json

  check-renovate:
    desc: Fail if a substituted HelmRelease chart version lacks its "# renovate:" annotation
    silent: true
    cmds:
      - |
        # Renovate's flux manager cannot parse ${VAR:-1.2.3} in chart.spec.version;
        # it drops the dep as "contains-variable" without warning. The annotation on
        # the preceding line is what feeds the custom manager instead — so a missing
        # one means that chart silently never gets an update PR.
        missing=$(find apps infra cicd -name '*.yaml' -print0 \
          | xargs -0 awk '
              FNR == 1 { prev = "" }
              /^[[:space:]]*version:[[:space:]]*\$\{[A-Z0-9_]+:-/ {
                if (prev !~ /#[[:space:]]*renovate:/) printf "  %s:%d\n", FILENAME, FNR
              }
              { prev = $0 }
            ')

        if [ -n "${missing}" ]; then
          echo "Chart versions with no '# renovate:' annotation:"
          echo "${missing}"
          echo
          echo "Renovate will never propose an update for these."
          echo "Derive the annotation from the HelmRepository the sourceRef points at:"
          echo "  type: oci   -> # renovate: datasource=docker depName=<host>/<path>/<chart>"
          echo "  plain HTTPS -> # renovate: datasource=helm depName=<chart> registryUrl=<url>"
          echo "See CLAUDE.md -> Dependency Management."
          exit 1
        fi

        echo "OK: every substituted chart version is annotated."

  preview-renovate:
    desc: Dry-run Renovate over a copy of the working tree and list the updates it would propose
    silent: true
    vars:
      PREVIEW_DIR: /tmp/renovate-preview
    preconditions:
      - sh: command -v docker
        msg: "docker is required to run Renovate locally"
    cmds:
      - |
        # Run against a copy: --dry-run writes no commits, but the container would
        # still churn caches inside a mounted working tree.
        rm -rf {{.PREVIEW_DIR}} && mkdir -p {{.PREVIEW_DIR}}
        tar --exclude=.git --exclude=.task -cf - . | tar -xf - -C {{.PREVIEW_DIR}}
        chmod -R a+rwX {{.PREVIEW_DIR}}

        # A token only widens lookups to GitHub-hosted datasources; helm/docker work without.
        token="${GITHUB_TOKEN:-$(gh auth token 2>/dev/null || true)}"

        echo "Running {{.RENOVATE_IMAGE}} against the working tree (this takes a minute)..."
        docker run --rm -u 0 \
          -v {{.PREVIEW_DIR}}:/work -w /work \
          -e RENOVATE_CONFIG_FILE=/work/renovate.json \
          -e LOG_LEVEL=debug \
          -e GITHUB_COM_TOKEN="${token}" \
          {{.RENOVATE_IMAGE}} \
          --platform=local --dry-run=full > {{.PREVIEW_DIR}}/renovate.log 2>&1 || true

        echo
        echo "Updates Renovate would propose:"
        grep -oE '"branchName": "renovate/[^"]*"' {{.PREVIEW_DIR}}/renovate.log \
          | sed 's|.*renovate/|  |; s|"$||' | sort -u
        echo
        echo "  total: $(grep -oE '"branchName": "renovate/[^"]*"' {{.PREVIEW_DIR}}/renovate.log | sort -u | wc -l)"

        if grep -qiE 'failed to look up' {{.PREVIEW_DIR}}/renovate.log; then
          echo
          echo "Lookup failures (wrong depName or registryUrl in an annotation):"
          grep -iE 'failed to look up' {{.PREVIEW_DIR}}/renovate.log | sed 's/^/  /' | sort -u
        fi

        echo
        echo "Full log: {{.PREVIEW_DIR}}/renovate.log"
