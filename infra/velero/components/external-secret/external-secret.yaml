---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-cloud-credentials
  namespace: ${VELERO_NAMESPACE:-velero}
spec:
  refreshInterval: ${VELERO_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${VELERO_ESO_SECRET_STORE_NAME:-vault-cluster}
    kind: ${VELERO_ESO_SECRET_STORE_KIND:-ClusterSecretStore}
  target:
    name: cloud-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  # The entry NAME, not a path. A ClusterSecretStore carries the mount and the
  # KV version and composes <mount>/data/<key> itself, so the old default
  # kv/data/velero/s3 resolved to <mount>/data/kv/data/velero/s3 -- a path that
  # exists nowhere, reported only on this object.
  data:
    - secretKey: access_key
      remoteRef:
        key: ${VELERO_ESO_SECRET_PATH:-velero}
        property: ${VELERO_ESO_ACCESS_KEY_PROPERTY:-access_key}
    - secretKey: secret_key
      remoteRef:
        key: ${VELERO_ESO_SECRET_PATH:-velero}
        property: ${VELERO_ESO_SECRET_KEY_PROPERTY:-secret_key}
