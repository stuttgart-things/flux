---
# The Hetzner Cloud API token, rendered from a substitution variable -- for a
# cluster that delivers secrets with SOPS + substituteFrom (the consuming
# Kustomization reads HETZNER_DNS_TOKEN from a Secret in flux-system). No
# default on purpose: without the token there is nothing to solve with.
apiVersion: v1
kind: Secret
metadata:
  name: ${LETSENCRYPT_HETZNER_TOKEN_SECRET:-hetzner-dns}
  namespace: ${CERT_MANAGER_NAMESPACE:-cert-manager}
type: Opaque
stringData:
  token: ${HETZNER_DNS_TOKEN}
