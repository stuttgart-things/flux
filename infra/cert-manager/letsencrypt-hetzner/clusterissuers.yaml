---
# Staging first: untrusted certificates, but generous rate limits -- for every
# first issuance and every change of a Certificate. Switch the Certificate to
# the production issuer once staging has issued.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${LETSENCRYPT_HETZNER_STAGING_ISSUER:-letsencrypt-staging-hetzner}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: ${LETSENCRYPT_HETZNER_STAGING_ISSUER:-letsencrypt-staging-hetzner}-account # pragma: allowlist secret
    solvers:
      - dns01:
          webhook:
            groupName: acme.hetzner.com
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: ${LETSENCRYPT_HETZNER_TOKEN_SECRET:-hetzner-dns} # pragma: allowlist secret
                key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${LETSENCRYPT_HETZNER_ISSUER:-letsencrypt-hetzner}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: ${LETSENCRYPT_HETZNER_ISSUER:-letsencrypt-hetzner}-account # pragma: allowlist secret
    solvers:
      - dns01:
          webhook:
            groupName: acme.hetzner.com
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: ${LETSENCRYPT_HETZNER_TOKEN_SECRET:-hetzner-dns} # pragma: allowlist secret
                key: token
