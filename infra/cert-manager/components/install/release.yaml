---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: ${CERT_MANAGER_NAMESPACE:-cert-manager}
spec:
  interval: 20m
  # single-node clusters can need >5m to pull new images on upgrade
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      version: ${CERT_MANAGER_VERSION:-v1.21.3}
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: ${CERT_MANAGER_NAMESPACE:-cert-manager}
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: ${CERT_MANAGER_INSTALL_CRDS:-true}
