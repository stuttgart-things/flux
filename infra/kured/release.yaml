---
# kured (Kubernetes Reboot Daemon): reboots a node once the OS asked for it
# (/var/run/reboot-required, written by unattended-upgrades after a kernel or
# libc update) -- one node at a time, cordon + drain + reboot + uncordon,
# inside a weekday window. The same defaults as the Argo CD catalog's
# infra/kured/install (stuttgart-things/argocd), so both fleets reboot alike.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: ${KURED_NAMESPACE:-kube-system}
spec:
  interval: 20m
  chart:
    spec:
      chart: kured
      # renovate: datasource=helm depName=kured registryUrl=https://kubereboot.github.io/charts
      version: ${KURED_VERSION:-6.1.0}
      sourceRef:
        kind: HelmRepository
        name: kubereboot
        namespace: ${KURED_NAMESPACE:-kube-system}
      interval: 12h
  values:
    configuration:
      period: ${KURED_PERIOD:-1h}
      # Weekdays. A list cannot be substituted (kustomize parses before
      # postBuild); another set of days is a patch on this HelmRelease.
      rebootDays: [mo, tu, we, th, fr]
      startTime: "${KURED_START_TIME:-04:00}"
      endTime: "${KURED_END_TIME:-06:00}"
      timeZone: ${KURED_TIME_ZONE:-UTC}
      concurrency: 1
      # A drain can block for good: single-instance CNPG keeps a PDB on its
      # primary, and a single-node cluster has nowhere to move pods. After the
      # timeout kured reboots anyway (forceReboot) -- in a lab the reboot is
      # the lesser evil, a node left cordoned the bigger one.
      drainTimeout: ${KURED_DRAIN_TIMEOUT:-15m}
      # NOT threaded (a bool, and postBuild.substitute is map[string]string);
      # false is a patch on this HelmRelease.
      forceReboot: true
      drainGracePeriod: "-1"
      # Taint the waiting node so pods from a node rebooting before it do not
      # land there.
      preferNoScheduleTaint: weave.works/kured-node-reboot
      annotateNodes: true
    # Run on every node, server nodes included: they get kernel updates too.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      - key: node-role.kubernetes.io/master
        operator: Exists
      - key: node-role.kubernetes.io/etcd
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
