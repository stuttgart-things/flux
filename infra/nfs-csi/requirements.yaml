---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NFS_CSI_NAMESPACE:-kube-system}
  annotations:
    # Shared namespace (kube-system): never delete it when this app is removed
    # or its Kustomization is pruned -- only this app's objects go.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    toolkit.fluxcd.io/tenant: sthings-team
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stuttgart-things
  namespace: ${NFS_CSI_NAMESPACE:-kube-system}
spec:
  interval: 24h
  url: oci://ghcr.io/stuttgart-things
  type: oci
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: ${NFS_CSI_NAMESPACE:-kube-system}
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
