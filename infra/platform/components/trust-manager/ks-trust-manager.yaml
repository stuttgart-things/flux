---
# trust-manager + the cluster trust Bundles → ./infra/trust-manager
#
# Applies trust.cert-manager.io Bundles, so it needs cert-manager's CRDs and
# webhook first — hence dependsOn cert-manager-install (base). Requires the
# base; on its own the dependsOn target never exists and this stays pending.
#
# Shared-ownership note: ./infra/trust-manager and
# ./infra/cert-manager/components/install BOTH render Namespace/cert-manager
# and HelmRepository/cert-manager. Two Kustomizations applying one object means
# the last writer owns the fields. That mirrors the pre-bundle setup exactly,
# so behaviour is unchanged — but it is why TRUST_MANAGER_NAMESPACE is fed from
# CERT_MANAGER_NAMESPACE rather than being an independent knob.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  dependsOn:
    - name: cert-manager-install
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  # Off switch. Set TRUST_MANAGER_SUSPEND: "true" in the consumer's substitute block.
  # This works where a substitute-map bool cannot: spec.suspend IS a boolean
  # field, so a bare `true`/`false` is exactly the right type — the opposite of
  # postBuild.substitute, which is map[string]string and rejects one.
  # Semantics: STOPS RECONCILING. On a cluster that never had this component it
  # means "never installed"; on one that has it, the objects STAY (frozen at
  # their current state, drift no longer corrected). To actually uninstall,
  # delete the component from the overlay — see this bundle's README.
  suspend: ${TRUST_MANAGER_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  # On/off switch. Set TRUST_MANAGER_ENABLED: "false" in the consumer's substitute block.
  #
  # A substituted variable cannot remove a resource from a build — kustomize
  # builds first, substitution runs after on the output — so the toggle moves
  # this child's PATH instead: switch/true includes ./infra/trust-manager unchanged,
  # switch/false is a kustomization with `resources: []`. Disabled, the child
  # still reconciles but applies nothing, and its own prune removes every
  # object it owned. That is a real uninstall, unlike TRUST_MANAGER_SUSPEND
  # (which freezes and leaves objects running).
  path: ./infra/platform/components/trust-manager/switch/${TRUST_MANAGER_ENABLED:-true}
  postBuild:
    substitute:
      TRUST_MANAGER_NAMESPACE: "${CERT_MANAGER_NAMESPACE:-cert-manager}"
      TRUST_MANAGER_TRUST_NAMESPACE: "${TRUST_MANAGER_TRUST_NAMESPACE:-cert-manager}"
      # renovate: datasource=helm depName=trust-manager registryUrl=https://charts.jetstack.io
      TRUST_MANAGER_VERSION: "${TRUST_MANAGER_VERSION:-v0.24.0}"
      TRUST_BUNDLE_NAME: "${TRUST_BUNDLE_NAME:-cluster-trust-bundle}"
      TRUST_BUNDLE_CA_SECRET: "${CERT_MANAGER_CA_SECRET:-cluster-ca-secret}" # pragma: allowlist secret
      TRUST_BUNDLE_CA_KEY: "${TRUST_BUNDLE_CA_KEY:-ca.crt}"
      TRUST_BUNDLE_TARGET_KEY: "${TRUST_BUNDLE_TARGET_KEY:-trust-bundle.pem}"
      TRUST_BUNDLE_VAULT_CA_SECRET: "${TRUST_BUNDLE_VAULT_CA_SECRET:-vault-pki-ca}" # pragma: allowlist secret
      TRUST_BUNDLE_VAULT_CA_KEY: "${TRUST_BUNDLE_VAULT_CA_KEY:-ca.crt}"
      TRUST_BUNDLE_SECRET_NAME: "${TRUST_BUNDLE_SECRET_NAME:-tls-ca}" # pragma: allowlist secret
      TRUST_BUNDLE_SECRET_TARGET_KEY: "${TRUST_BUNDLE_SECRET_TARGET_KEY:-cacerts.pem}"
      TRUST_BUNDLE_SECRET_NAMESPACE: "${TRUST_BUNDLE_SECRET_NAMESPACE:-cattle-system}"
