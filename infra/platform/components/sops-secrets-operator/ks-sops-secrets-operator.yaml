---
# sops-secrets-operator → ./apps/sops-secrets-operator
#
# Turns a SopsSecret -- an age-encrypted blob committed to git -- into a real
# Kubernetes Secret. The third member of this bundle's secrets layer, beside
# external-secrets (pull from Vault at runtime) and Flux's own SOPS decryption
# (decrypt during kustomize build). They solve the same problem three ways and
# nothing stops a cluster running all three; pick the one whose failure mode
# you want.
#
# In the INFRA bundle although the base lives under apps/, on the same
# reasoning as flux-web and headlamp: the layer decides, not the directory.
#
# THE NAME IS NOT sops-secrets-operator, AND IT CANNOT BE. What this path
# renders is itself a Flux Kustomization called `sops-secrets-operator` in
# flux-system -- so a wrapper of that name in that namespace would be applying
# a resource with its own name, and the two would fight over every field on
# every reconcile. `-bootstrap` says what this one is: the thing that plants
# the OCIRepository and the Kustomization that does the work.
#
# `wait: true` therefore waits on the INNER Kustomization's Ready condition,
# which is what makes it meaningful -- it is not Ready until the artifact has
# been pulled and the operator is up.
#
# NO cert-manager DEPENDENCY, and the reason is worth stating because the
# upstream layout says otherwise: kubebuilder's config/default composes
# ../webhook and ../certmanager, so `kubectl apply -k config/default` needs
# cert-manager. This artifact is rendered from that repo's kcl/ deploy profile
# instead -- no ValidatingWebhookConfiguration, no Certificate, no cert volume.
# See apps/sops-secrets-operator/README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-secrets-operator-bootstrap
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  interval: 1h
  retryInterval: 1m
  # 10m: this waits for the inner Kustomization, which pulls an OCI artifact
  # and installs CRDs before its own Deployment is up.
  timeout: 10m
  force: false
  prune: true
  # Off switch. Set SOPS_OPERATOR_SUSPEND: "true" in the consumer's substitute
  # block. It freezes THIS Kustomization only -- the inner one keeps
  # reconciling, because suspend does not propagate to an applied
  # Kustomization's own spec. To actually stop the operator, remove this
  # component from spec.components.
  suspend: ${SOPS_OPERATOR_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./apps/sops-secrets-operator
  postBuild:
    substitute:
      # The OCIRepository and the inner Kustomization both live here, NOT in
      # the operator's own namespace: the artifact creates
      # sops-secrets-operator-system itself, and creating it a second time
      # would give one namespace two owners across two Kustomizations, either
      # of which would prune it out from under the other.
      FLUX_NAMESPACE: "${FLUX_NAMESPACE:-flux-system}"
      FLUX_SOURCE_API_VERSION: "${FLUX_SOURCE_API_VERSION:-v1}"
      # The artifact tag pins its own image -- the repo writes
      # config/manager/kustomization.yaml before tagging. That was off by one
      # until stuttgart-things/sops-secrets-operator#90; v0.9.0 gives v0.9.0.
      # renovate: datasource=docker depName=ghcr.io/stuttgart-things/sops-secrets-operator-kustomize
      SOPS_OPERATOR_VERSION: "${SOPS_OPERATOR_VERSION:-v0.9.2}"
