---
# Headlamp with OIDC login (opt-in) → ./apps/headlamp + the patch below
#
# Same child Kustomization, same name, as the headlamp component: select ONE
# of the two. Everything the headlamp component threads is threaded here the
# same way (check-shared-path-wiring.py). A cluster switching between the two
# keeps its hostname, version and namespace.
#
# Headlamp passes the user's ID token through to the kube-apiserver, so this
# is only half of it: the apiserver must trust the issuer with this client ID
# as audience (AuthenticationConfiguration, --authentication-config), and RBAC
# must bind the users / groups it maps. Without that the login succeeds at the
# IdP and every request after it is 401.
#
# The base's cluster-admin binding of Headlamp's own ServiceAccount stays as
# it is: with OIDC, requests go out with the user's token, not the pod's.
#
# WHY A PATCH HERE AND NOT SUBSTITUTE KEYS: client IDs can be digits only
# (ZITADEL: 397534885599773258). kustomize drops the quotes of a substitute
# value, so after the bundle's substitution the child would carry a number in
# postBuild.substitute (map[string]string) and the whole bundle apply fails.
# Inside the patch's block scalar the quotes survive the bundle's
# substitution, as in apps/platform/components/sthings-portal. The HEADLAMP_OIDC_*
# variables are therefore read HERE, by the bundle, and never reach the
# child's substitute map.
#
# Chart 0.46.0: everything goes through .Values.env, not config.oidc.* -- the
# chart renders config.oidc.clientID unquoted into the Deployment (a numeric ID
# breaks EnvVar.value) and its schema wants a string. From env it picks up
# OIDC_CLIENT_ID / _ISSUER_URL / _SCOPES / _CALLBACK_URL and adds the -oidc-*
# args itself. secret.create: false, so the chart writes no Secret.
#
# The client secret is NOT a variable: it comes from an existing Secret in
# the headlamp namespace (HEADLAMP_OIDC_CLIENT_SECRET_NAME / _KEY), applied by
# the cluster (SOPS) or ESO, as HEADLAMP_CONFIG_OIDC_CLIENT_SECRET (Headlamp
# reads HEADLAMP_CONFIG_* env as its flags). The issuer's CA defaults to
# trust-manager's cluster-trust-bundle, which carries the lab's Vault PKI
# (-oidc-ca-file via HEADLAMP_CONFIG_OIDC_CA_FILE). A missing Secret or
# ConfigMap keeps the pod in ContainerCreating.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  # Same reason as flux-web: the HelmRelease renders an HTTPRoute
  # unconditionally, and one whose parentRef does not resolve fails quietly.
  dependsOn:
    - name: cilium-gateway
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  # Off switch. Set HEADLAMP_SUSPEND: "true" in the consumer's substitute block.
  # STOPS RECONCILING; objects stay. To uninstall, drop the component.
  suspend: ${HEADLAMP_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./apps/headlamp
  # Substituted by the bundle (see above). Variables, all optional but the
  # first two:
  #   HEADLAMP_OIDC_ISSUER_URL      REQUIRED, as in the discovery document
  #   HEADLAMP_OIDC_CLIENT_ID       REQUIRED, also the apiserver's audience
  #   HEADLAMP_OIDC_SCOPES          profile,email (comma separated, openid is
  #                                 added; ZITADEL: + urn:zitadel:iam:org:projects:roles)
  #   HEADLAMP_OIDC_CALLBACK_URL    https://<HEADLAMP_HOSTNAME>.<INFRA_DOMAIN>/oidc-callback
  #   HEADLAMP_OIDC_CLIENT_SECRET_NAME / _KEY   headlamp-oidc / client-secret
  #   HEADLAMP_OIDC_CA_CONFIGMAP / _KEY         cluster-trust-bundle / trust-bundle.pem
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: headlamp
      patch: |  # pragma: allowlist secret -- names a Secret and its key, holds none
        - op: add
          path: /spec/values/config/oidc
          value:
            secret:
              create: false
        - op: add
          path: /spec/values/env
          value:
            - name: OIDC_CLIENT_ID
              # keep quoted: client IDs can be digits only
              value: "${HEADLAMP_OIDC_CLIENT_ID:-set-HEADLAMP_OIDC_CLIENT_ID}"
            - name: OIDC_ISSUER_URL
              value: "${HEADLAMP_OIDC_ISSUER_URL:-https://set-HEADLAMP_OIDC_ISSUER_URL.invalid}"
            - name: OIDC_SCOPES
              value: "${HEADLAMP_OIDC_SCOPES:-profile,email}"
            - name: OIDC_CALLBACK_URL
              value: "${HEADLAMP_OIDC_CALLBACK_URL:-https://${HEADLAMP_HOSTNAME:-headlamp}.${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}/oidc-callback}"
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "${HEADLAMP_OIDC_CLIENT_SECRET_NAME:-headlamp-oidc}"
                  key: "${HEADLAMP_OIDC_CLIENT_SECRET_KEY:-client-secret}"
            - name: HEADLAMP_CONFIG_OIDC_CA_FILE
              value: "/etc/headlamp/oidc-ca/${HEADLAMP_OIDC_CA_KEY:-trust-bundle.pem}"
        - op: add
          path: /spec/values/volumes
          value:
            - name: oidc-ca
              configMap:
                name: "${HEADLAMP_OIDC_CA_CONFIGMAP:-cluster-trust-bundle}"
        - op: add
          path: /spec/values/volumeMounts
          value:
            - name: oidc-ca
              mountPath: /etc/headlamp/oidc-ca
              readOnly: true
  postBuild:
    substitute:
      HEADLAMP_NAMESPACE: "${HEADLAMP_NAMESPACE:-headlamp}"
      # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp
      HEADLAMP_VERSION: "${HEADLAMP_VERSION:-0.46.0}"
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOSTNAME: "${HEADLAMP_HOSTNAME:-headlamp}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED
