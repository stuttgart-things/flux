---
# cert-manager-selfsigned
#
# REQUIRES ../cert-manager-install in the same spec.components list. Its child has a
# dependsOn on that Kustomization, and Flux has no optional dependency: if
# cert-manager-install is not selected, this one waits on "dependency not ready"
# forever rather than deploying something half-wired.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ks-cert-manager-selfsigned.yaml
