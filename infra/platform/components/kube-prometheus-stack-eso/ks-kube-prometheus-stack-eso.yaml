---
# kube-prometheus-stack with Alertmanager's webhook token read from a
# ClusterSecretStore (opt-in) → ./infra/kube-prometheus-stack
#   + ./components/alertmanager-webhook-token
#
# Same child Kustomization, same name, as the kube-prometheus-stack component:
# select ONE of the two. Everything the base threads is threaded here the same
# way (check-shared-path-wiring.py), plus the ESO store and entry.
#
# For clusters without their own homerun2: set KPS_ALERTMANAGER_WEBHOOK_URL to a
# pitcher they can reach, and put that pitcher's token at
# <store>/<KPS_ESO_SECRET_PATH>:<KPS_ESO_TOKEN_PROPERTY>. Without the Secret the
# Alertmanager pod cannot mount it and sits in ContainerCreating -- loud, unlike the base's
# `changeme`, which delivers nothing and says nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  dependsOn:
    - name: cilium-gateway
    - name: external-secrets-vault-store
  interval: 1h
  retryInterval: 1m
  # 15m, not the bundle's usual 5m: this chart installs the prometheus-operator
  # CRDs and five workloads, and `wait: true` holds until they are all healthy.
  timeout: 15m
  force: false
  prune: true
  # Off switch. See the note in components/prometheus: suspend STOPS
  # RECONCILING, it does not uninstall.
  suspend: ${KPS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./infra/kube-prometheus-stack
  components:
    - ./components/alertmanager-webhook-token
    # the external pitcher's certificate is from a lab PKI: trust the
    # cluster's trust-manager bundle (stuttgart-things#3503)
    - ./components/alertmanager-webhook-ca
  postBuild:
    substitute:
      KPS_NAMESPACE: "${KPS_NAMESPACE:-monitoring}"
      # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      KPS_VERSION: "${KPS_VERSION:-92.1.0}"

      # ---- Prometheus storage ----
      # REQUIRED in practice: see the note above. The bundle cannot default
      # this correctly because the right answer is whichever StorageClass the
      # cluster actually has (openebs-hostpath, nfs4-csi, ...).
      KPS_PROMETHEUS_STORAGE_CLASS: "${KPS_PROMETHEUS_STORAGE_CLASS:-nfs4-csi}"
      KPS_PROMETHEUS_STORAGE_SIZE: "${KPS_PROMETHEUS_STORAGE_SIZE:-10Gi}"
      KPS_PROMETHEUS_RETENTION: "${KPS_PROMETHEUS_RETENTION:-15d}"
      # Applies to both scrapeInterval and evaluationInterval; 60s roughly
      # halves scrape CPU and TSDB write volume against the chart's 30s.
      KPS_SCRAPE_INTERVAL: "${KPS_SCRAPE_INTERVAL:-60s}"

      # ---- Grafana ----
      # Cleartext, and it lands in the HelmRelease values on the cluster. Left
      # as a plain substitute because that is what every consumer does today;
      # a cluster that cares should drop this line and add a
      # postBuild.substituteFrom pointing at a SOPS-decrypted Secret.
      KPS_GRAFANA_ADMIN_PASSWORD: "${KPS_GRAFANA_ADMIN_PASSWORD:-prom-operator}"

      # ---- Grafana HTTPRoute ----
      # The base uses the bare names GATEWAY_NAME / HOSTNAME / DOMAIN. They are
      # mapped here to bundle-level names so a consumer never sets a variable
      # as collision-prone as HOSTNAME at the top level.
      GATEWAY_NAME: "${INFRA_GATEWAY_NAME:-cilium-gateway}"
      GATEWAY_NAMESPACE: "${INFRA_GATEWAY_NAMESPACE:-default}"
      HOSTNAME: "${KPS_HOSTNAME:-grafana}"
      DOMAIN: "${INFRA_DOMAIN:-set-INFRA_DOMAIN.invalid}" # REQUIRED

      # ---- Alertmanager → MS Teams ----
      # The base routes warning|critical at a homerun2-omni-pitcher Service.
      # Where that does not exist the alerts simply fail to deliver — nothing
      # here breaks, and the null receiver still swallows everything else.
      HOMERUN2_NAMESPACE: "${HOMERUN2_NAMESPACE:-homerun2}"
      HOMERUN2_OMNI_PITCHER_AUTH_TOKEN: "${HOMERUN2_OMNI_PITCHER_AUTH_TOKEN:-changeme}"
      KPS_ALERTMANAGER_WEBHOOK_URL: "${KPS_ALERTMANAGER_WEBHOOK_URL:-http://homerun2-omni-pitcher.${HOMERUN2_NAMESPACE:-homerun2}.svc.cluster.local/pitch/grafana}"
      KPS_ESO_SECRET_STORE_NAME: "${KPS_ESO_SECRET_STORE_NAME:-set-KPS_ESO_SECRET_STORE_NAME}"
      KPS_ESO_SECRET_STORE_KIND: "${KPS_ESO_SECRET_STORE_KIND:-ClusterSecretStore}"
      KPS_ESO_SECRET_PATH: "${KPS_ESO_SECRET_PATH:-alertmanager-webhook}"
      KPS_ALERTMANAGER_CA_CONFIGMAP: "${KPS_ALERTMANAGER_CA_CONFIGMAP:-cluster-trust-bundle}"
      KPS_ALERTMANAGER_CA_KEY: "${KPS_ALERTMANAGER_CA_KEY:-trust-bundle.pem}"
      KPS_ESO_TOKEN_PROPERTY: "${KPS_ESO_TOKEN_PROPERTY:-token}"
      KPS_ESO_REFRESH_INTERVAL: "${KPS_ESO_REFRESH_INTERVAL:-1h}"
