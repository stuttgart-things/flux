---
# cilium-gateway
#
# REQUIRES ../cilium-lb in the same spec.components list. Its child has a
# dependsOn on that Kustomization, and Flux has no optional dependency: if
# cilium-lb is not selected, this one waits on "dependency not ready"
# forever rather than deploying something half-wired.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ks-cilium-gateway.yaml
