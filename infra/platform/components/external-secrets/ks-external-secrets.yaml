---
# External Secrets Operator (controller + CRDs) → ./infra/external-secrets/components/install
#
# No dependsOn. ESO installs its own CRDs from the chart and needs nothing else
# in the bundle — not the Gateway (it publishes no UI) and not a StorageClass.
#
# This component deploys the OPERATOR ONLY. It creates no SecretStore, so on a
# fresh cluster it reconciles green while being able to read exactly nothing.
# That is the correct split: a store carries the address of a Vault, an auth
# mount and a role, and those are per-cluster credentials the bundle cannot
# know — the same reason the Vault ClusterIssuer's Vault-side half lives in the
# VM pipeline rather than here. Add `external-secrets-vault-store` (or a
# hand-written Kustomization) once that Vault auth backend exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  # Off switch. See the note in components/prometheus: suspend STOPS
  # RECONCILING, it does not uninstall. To remove ESO, delete this line from
  # the consumer's `components:` list.
  suspend: ${EXTERNAL_SECRETS_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./infra/external-secrets/components/install
  postBuild:
    substitute:
      EXTERNAL_SECRETS_NAMESPACE: "${EXTERNAL_SECRETS_NAMESPACE:-external-secrets}"
      # renovate: datasource=helm depName=external-secrets registryUrl=https://charts.external-secrets.io
      EXTERNAL_SECRETS_VERSION: "${EXTERNAL_SECRETS_VERSION:-2.10.0}"
      #
      # EXTERNAL_SECRETS_INSTALL_CRDS is deliberately NOT passed through here.
      # Its value is a bool, and no substitute value may be one: kustomize
      # re-emits this file and drops the quotes (every form of them -- "x", 'x'
      # and !!str alike), so `"${VAR:-true}"` reaches the cluster as a bare
      # `true`. postBuild.substitute is map[string]string, and the typed-patch
      # error that follows fails the WHOLE parent Kustomization, every sibling
      # component with it. The base's own `:-true` default still applies; a
      # cluster that really needs CRDs off should point a Kustomization
      # straight at ./infra/external-secrets/components/install.
