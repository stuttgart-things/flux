---
# A Vault ClusterSecretStore → ./infra/external-secrets/components/cluster-store-vault
#
# dependsOn external-secrets: the base renders a ClusterSecretStore, whose CRD
# arrives with the ESO chart. Applied first it fails with `no matches for kind`
# — the same ordering that moved the Vault ClusterIssuer out of the pipeline and
# into this bundle.
#
# THE VAULT SIDE IS NOT HERE. This deploys the store; the auth backend it logs
# into, its role and the bound ServiceAccount come from the VM pipeline
# (blueprints CreateVaultKubernetesAuth --auth-name eso), because configuring a
# Kubernetes auth mount needs a Vault token and this cluster's API address, and
# Flux has neither. Until that has run, the store reports
# `Ready=False / InvalidProviderConfig` and every ExternalSecret with it.
#
# `Ready=True` here means the LOGIN worked. It says nothing about whether the
# bound policy grants the paths anyone will ask for — a store pointed at a KV
# mount outside the policy validates exactly the same and fails only at the
# first ExternalSecret. Prove it with a synced secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-vault-store
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  dependsOn:
    - name: external-secrets
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${ESO_STORE_SUSPEND:-false}
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./infra/external-secrets/components/cluster-store-vault
  postBuild:
    substitute:
      VAULT_CSS_NAME: "${ESO_STORE_NAME:-vault}"
      # REQUIRED. The bundle default points at the LabUL Vault, which is wrong
      # everywhere else and wrong in a way that still validates: a store aimed
      # at an unreachable Vault fails loudly, but one aimed at the WRONG
      # reachable Vault does not.
      VAULT_SERVER: "${ESO_STORE_VAULT_ADDR:-https://vault.infra.sthings-vsphere.labul.sva.de}"
      # KV v2 mount this store reads. It must be inside what the bound policy
      # allows -- see the note above.
      VAULT_KV_PATH: "${ESO_STORE_KV_PATH:-set-ESO_STORE_KV_PATH}"

      # ---- Vault's own TLS ----------------------------------------------
      # Defaults to the Secret the pipeline drops for cert-manager. On our labs
      # the Vault server certificate is issued by the same internal CA that
      # Secret carries, so one copy serves both.
      VAULT_CA_SECRET_NAME: "${ESO_STORE_CA_SECRET:-vault-pki-ca}"
      VAULT_CA_SECRET_NAMESPACE: "${ESO_STORE_CA_SECRET_NAMESPACE:-cert-manager}"
      VAULT_CA_SECRET_KEY: "${ESO_STORE_CA_SECRET_KEY:-ca.crt}"

      # ---- kubernetes auth ----------------------------------------------
      # The mount path is per-cluster: the pipeline creates it as
      # <cluster>-<authName>. Note this is the BARE path, with no /v1/auth/
      # prefix -- unlike the cert-manager ClusterIssuer, which wants the prefix.
      VAULT_K8S_AUTH_MOUNT_PATH: "${ESO_STORE_AUTH_MOUNT_PATH:-set-ESO_STORE_AUTH_MOUNT_PATH}"
      VAULT_K8S_AUTH_ROLE: "${ESO_STORE_AUTH_ROLE:-eso}"
      # The ESO chart's OWN ServiceAccount, named after the release. Not `eso`:
      # that is the auth-name, and binding a ServiceAccount that does not exist
      # produces a role Vault accepts and no pod can ever use.
      VAULT_K8S_AUTH_SA_NAME: "${ESO_STORE_AUTH_SA_NAME:-external-secrets}"
      VAULT_K8S_AUTH_SA_NAMESPACE: "${ESO_STORE_AUTH_SA_NAMESPACE:-external-secrets}"
