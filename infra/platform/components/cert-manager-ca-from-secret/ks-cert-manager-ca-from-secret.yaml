---
# CA ClusterIssuer from a caller-provided CA Secret
#   → ./infra/cert-manager/components/ca-from-secret
#
# The CA Secret is NOT in this bundle and never will be: the cluster ships it
# (SOPS, typically), as a kubernetes.io/tls Secret named
# CERT_MANAGER_CA_FROM_SECRET_NAME in cert-manager's namespace. Apply it from a
# Kustomization of the cluster's own that dependsOn cert-manager-install (the
# namespace) and carries the SOPS decryption block. No deadlock: that one does
# not wait on this bundle, and this child only waits on the issuer.
#
# For the gateway wildcard from this CA, select cert-manager-selfsigned too and
# set CERT_MANAGER_SELFSIGNED_ISSUER to CERT_MANAGER_CA_FROM_SECRET_ISSUER.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-ca-from-secret
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    kustomization.stuttgart-things.com/type: infrastructure
    kustomization.stuttgart-things.com/bundle: infra-platform
spec:
  dependsOn:
    - name: cert-manager-install
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: false
  prune: true
  suspend: ${CERT_MANAGER_CA_FROM_SECRET_SUSPEND:-false}
  # wait on the ClusterIssuer's Ready: cert-manager sets it once the Secret
  # exists and holds a usable CA keypair. A missing Secret keeps this child --
  # and nothing else -- not-Ready.
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE:-flux-infra}
  path: ./infra/cert-manager/components/ca-from-secret
  postBuild:
    # passthrough-complete: every ${VAR} the child reads is listed here.
    substitute:
      CERT_MANAGER_CA_FROM_SECRET_ISSUER: "${CERT_MANAGER_CA_FROM_SECRET_ISSUER:-ca-from-secret}"
      CERT_MANAGER_CA_FROM_SECRET_NAME: "${CERT_MANAGER_CA_FROM_SECRET_NAME:-ca-from-secret}" # pragma: allowlist secret
