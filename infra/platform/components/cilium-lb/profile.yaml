---
# AppProfile: what a cluster sets for cilium-lb.
# Read by blueprints `render-cluster-apps`; kept true by
# hack/check-app-profiles.py (vars and keys) and `kcl vet` (value shapes).
kind: AppProfile
metadata:
  name: cilium-lb
spec:
  bundle: infra-platform
  component: ../components/cilium-lb
  vars:
    CILIUM_L2_POLICY_NAME: {}
    CILIUM_LB_IP_START: {}
    CILIUM_LB_IP_STOP: {}
    CILIUM_LB_POOL_NAME: {}
    CILIUM_LB_SUSPEND: {}
    CILIUM_NAMESPACE: {}
