---
# Per-cluster overlay: test-infra1 (labda / tiab)
#
# Lists EVERY component the bundle offers. Which of them actually deploy is
# decided per cluster by <APP>_ENABLED in the consumer's substitute block, not
# here — so this file rarely changes, and turning something on later needs no
# commit in this repo at all.
#
# First run on test-infra1 enables only what the cluster already had, minus
# reloader:
#     CILIUM_LB_ENABLED               true   (default)
#     CERT_MANAGER_INSTALL_ENABLED    true   (default)
#     OPENEBS_ENABLED                 true   (default)
#     CILIUM_GATEWAY_ENABLED          false  ← no free LB IP on this cluster
#     CERT_MANAGER_SELFSIGNED_ENABLED false  ← no domain/PKI wanted yet
#     TRUST_MANAGER_ENABLED           false
#     NFS_CSI_ENABLED                 false
#     PROMETHEUS_ENABLED              false
#     RELOADER_ENABLED                false
#
# Consume with ONE Flux Kustomization:
#   path: ./infra/platform/overlays/test-infra1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/trust-manager
  - ../../components/nfs-csi
  - ../../components/openebs
  - ../../components/prometheus
  - ../../components/reloader
