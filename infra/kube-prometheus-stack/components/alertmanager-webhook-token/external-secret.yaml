---
# The bearer token Alertmanager sends to the omni-pitcher, read from a
# ClusterSecretStore. It lands in a Secret that alertmanagerSpec.secrets mounts
# at /etc/alertmanager/secrets/alertmanager-webhook-token/, and the receiver
# reads it with credentials_file -- so the token is in no Flux variable, no
# HelmRelease value and no git file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook-token
  namespace: ${KPS_NAMESPACE:-monitoring}
spec:
  refreshInterval: ${KPS_ESO_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${KPS_ESO_SECRET_STORE_NAME:-set-KPS_ESO_SECRET_STORE_NAME}
    kind: ${KPS_ESO_SECRET_STORE_KIND:-ClusterSecretStore}
  target:
    name: alertmanager-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token  # pragma: allowlist secret
      remoteRef:
        key: ${KPS_ESO_SECRET_PATH:-alertmanager-webhook}
        property: ${KPS_ESO_TOKEN_PROPERTY:-token}
