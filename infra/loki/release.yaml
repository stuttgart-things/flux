---
# Loki, monolithic: one StatefulSet, TSDB index and chunks on its own PVC.
# Meant as the central log store of a lab, fed by fluent-bit on every cluster
# (./infra/fluent-bit) -- through the gateway Service in-cluster, through
# components/httproute from the others.
#
# auth_enabled: false -- one tenant (`fake`) for the whole lab. The push
# endpoint is therefore open to whoever reaches the route; keep it on a lab
# Gateway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: ${LOKI_NAMESPACE:-loki}
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: loki
      # renovate: datasource=docker depName=ghcr.io/grafana-community/helm-charts/loki
      version: ${LOKI_VERSION:-20.2.0}
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: ${LOKI_NAMESPACE:-loki}
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: ${LOKI_RETENTION:-168h}
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: ${LOKI_STORAGE_SIZE:-20Gi}
        storageClass: ${LOKI_STORAGE_CLASS:-local-path}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
    # The nginx gateway is the one address for push and query, in-cluster
    # (loki-gateway.<ns>.svc) and behind components/httproute.
    gateway:
      enabled: true
    # Off for a single small instance: memcached caches, the canary, the
    # helm test, the bundled MinIO.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false
    # Every other deployment mode at zero.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0
