---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: ${LOKI_GRAFANA_NAMESPACE:-monitoring}
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.${LOKI_NAMESPACE:-loki}.svc.cluster.local
        jsonData:
          maxLines: 1000
