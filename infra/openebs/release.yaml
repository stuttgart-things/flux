---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: ${OPENEBS_NAMESPACE:-openebs}
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      # renovate: datasource=helm depName=openebs registryUrl=https://openebs.github.io/openebs
      version: ${OPENEBS_VERSION:-4.6.0}
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: ${OPENEBS_NAMESPACE:-openebs}
      interval: 12h
  values:
    # The chart defaults this hook to docker.io/bitnami/kubectl:1.25.15, which
    # Bitnami has removed from the registry — the pull fails with NotFound, the
    # pre-upgrade hook never completes, and every helm upgrade of this release
    # times out.
    #
    # The replacement must ship a shell: the chart invokes the hook with
    # command: ["/bin/sh","-c"], so a distroless image such as
    # registry.k8s.io/kubectl pulls fine but dies with
    # 'exec: "/bin/sh": no such file or directory'. alpine/kubectl has one, and
    # 1.35 matches the clusters' API version.
    preUpgradeHook:
      image:
        registry: ${OPENEBS_PREUPGRADE_HOOK_IMAGE_REGISTRY:-docker.io}
        repo: ${OPENEBS_PREUPGRADE_HOOK_IMAGE_REPO:-alpine/kubectl}
        tag: ${OPENEBS_PREUPGRADE_HOOK_IMAGE_TAG:-1.35.4}
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: ${VOLUMESNAPSHOTS_ENABLED:-false}
    mayastor:
      csi:
        node:
          initContainers:
            enabled: ${CSI_NODE_INIT_CONTAINERS_ENABLED:-false}
    # AN OBSERVABILITY STACK NOBODY ASKED FOR, disarmed BEFORE it can arrive.
    #
    # These two keys do nothing at the pinned 4.2.0 — that chart has no such
    # dependencies at all, and its values.yaml does not mention loki, minio or
    # alloy once. They are here for the version bump, because OPENEBS_VERSION is
    # substitutable and 4.5.x added:
    #
    #   loki   6.29.0   condition: loki.enabled    (default TRUE)
    #   alloy  1.0.1    condition: alloy.enabled   (default TRUE)
    #
    # So raising the version alone would silently deploy a Loki StatefulSet, the
    # MinIO StatefulSet backing it (MinIO is Loki's object store — a
    # sub-dependency with no toggle of its own), an Alloy log-shipper DaemonSet
    # and two extra StorageClasses, onto every cluster consuming this artifact.
    # Without these lines the artifact would offer no way to say no.
    #
    # On a small cluster it is worse than noise: Loki asks for three replicas
    # with pod anti-affinity, so on a 1+2 node cluster replica 0 sits Pending
    # forever. openebs-hostpath — the StorageClass this fleet actually uses — is
    # unaffected either way.
    #
    # Harmless at 4.2.0: the chart ships no values.schema.json, so unknown keys
    # are accepted rather than rejected. Verified against both 4.2.0 and 4.5.1.
    loki:
      enabled: ${OPENEBS_LOKI_ENABLED:-false}
    alloy:
      enabled: ${OPENEBS_ALLOY_ENABLED:-false}
    localpv-provisioner:
      hostpathClass:
        # DEFAULT true, unlike the chart. This app only ever lands on target
        # clusters, and those are rke2 — which ships no default StorageClass at
        # all. Without one every PVC that does not name a class stays Pending
        # with "no persistent volumes available for this claim and no storage
        # class is set", and the workload above it simply never starts.
        #
        # Found the expensive way on u26-rke2-1, 2026-08-17: Tekton's `all`
        # profile installs Results, Results wants a PostgreSQL, its PVC hung,
        # the Tekton operator blocked on it, and NOTHING after Results ever
        # installed — including the Dashboard. The cause named neither storage
        # nor a class; it presented as "the Dashboard never appeared".
        #
        # openebs-hostpath is the StorageClass this fleet actually uses, and it
        # is the only reason openebs is installed. A cluster that installs it
        # and then leaves it non-default has done half a job.
        #
        # Set false on a cluster that already HAS a default — a kind target
        # carries `standard` from the kind image, and two defaults is a
        # misconfiguration the API server resolves arbitrarily.
        isDefaultClass: ${OPENEBS_HOSTPATH_DEFAULT_CLASS:-true}
    engines:
      local:
        # STATED, NOT INHERITED, and for the same reason as the two above. At
        # 4.2.0 localpv-provisioner is an unconditional dependency; at 4.5.x it
        # gained `condition: engines.local.hostpath.enabled`. That is the
        # provisioner behind openebs-hostpath, i.e. the only reason this fleet
        # installs openebs at all — so it should not depend on an upstream
        # default staying true across a bump.
        hostpath:
          enabled: ${LOCAL_HOSTPATH_ENABLED:-true}
        lvm:
          enabled: ${LOCAL_LVM_ENABLED:-false}
        zfs:
          enabled: ${LOCAL_ZFS_ENABLED:-false}
      replicated:
        mayastor:
          enabled: ${REPLICATED_MAYASTOR_ENABLED:-false}
