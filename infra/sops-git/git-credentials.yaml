---
# Read-only git credential the GitRepository below clones with.
#
# `basic` auth, so the chart's default secret shape is username + password. The
# username is not a secret and is a plain substitution; the token is.
#
# SEPARATE FROM THE AGE KEY on purpose, even though both come from the same KV
# entry: they are rotated on different schedules and by different people, and a
# single ExternalSecret would tie the two together for no benefit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sops-git-credentials
  namespace: ${SOPS_GIT_NAMESPACE:-crossplane-system}
spec:
  refreshInterval: ${SOPS_GIT_REFRESH_INTERVAL:-1h}
  secretStoreRef:
    name: ${SOPS_GIT_ESO_STORE:-set-SOPS_GIT_ESO_STORE}
    kind: ${SOPS_GIT_ESO_STORE_KIND:-ClusterSecretStore}
  target:
    name: ${SOPS_GIT_CREDENTIALS_SECRET:-sops-git-credentials}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: ${SOPS_GIT_USERNAME:-stuttgart-things}
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: ${SOPS_GIT_ESO_SECRET_PATH:-sops-git}
        property: ${SOPS_GIT_ESO_TOKEN_PROPERTY:-git_token}
