---
# Release + OCI publish for the Flux GitOps monorepo.
#
# On every push to main:
#   1. release  – semantic-release cuts a SemVer tag + GitHub Release from the
#                 Conventional Commit history (feat -> minor, fix -> patch,
#                 BREAKING -> major). It pushes nothing to main: the notes
#                 live on the GitHub Release (#215).
#   2. plan     – resolves the version tag to publish and computes which
#                 apps/* and infra/* components changed in this merge.
#   3. push     – packages each CHANGED component directory as a Flux OCI
#                 artifact and pushes it to ghcr.io.
#   4. push-repo – packages the WHOLE repo as one Flux OCI artifact
#                 (flux/repo), independent of which components changed. The
#                 platform bundles need it: their child Kustomizations use
#                 paths from the repo root and cross layers (#621).
#
# Naming:  oci://ghcr.io/stuttgart-things/flux/<apps|infra|cicd>/<name>
#          oci://ghcr.io/stuttgart-things/flux/repo
# Tags:    <release-version> (e.g. v1.17.0) AND latest
#
# Only changed components get the new version tag. Unchanged components keep
# their existing tags in the registry — since their content did not change,
# their `latest` already points at the correct manifests. Consumers pin a
# component independently, e.g.:
#   OCIRepository -> oci://ghcr.io/stuttgart-things/flux/apps/vault
#                    ref.tag: ${VAULT_KUSTOMIZE_VERSION:-v1.17.0}
name: Release

on:
  push:
    branches:
      - main
  # Manual trigger for backfilling / re-pushing artifacts. With push-all=true
  # (default) every apps/*, infra/* and cicd/* component AND the whole-repo
  # artifact (flux/repo) are published at the current release version — used
  # to seed the registry or force a re-push. No release is cut on manual
  # dispatch.
  workflow_dispatch:
    inputs:
      push-all:
        description: "Push ALL components (backfill), not just changed ones"
        type: boolean
        default: true

# Never run two releases concurrently — they would race on the tag, and the
# push job depends on the release job, so the whole pipeline serializes here.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: semantic-release
    # Only cut a release on a real push to main — never on manual dispatch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags + releases
      issues: write          # semantic-release success/fail comments
      pull-requests: write   # semantic-release PR comments
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history so commit-analyzer sees every commit

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Creates the tag and the GitHub Release only -- no CHANGELOG commit.
      # The ruleset on main requires status checks and GITHUB_TOKEN cannot
      # bypass it (bypass_actors only accepts an Integration of the owner org;
      # org rulesets need GitHub Team). Tags are not subject to the branch rule,
      # so not pushing to main is what lets the gate enforce without a PAT (#215).
      - name: semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: plan OCI push
    needs: release
    # release is skipped on manual dispatch — still run the plan/push.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.changed.outputs.components }}
      version: ${{ steps.version.outputs.version }}
      # "true" when this run publishes a version that belongs to this commit:
      # a release was cut, or a push-all dispatch backfills. Gates push-repo.
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Resolve version tag
        run: |
          if [ "${{ needs.release.outputs.published }}" = "true" ]; then
            VERSION="v${{ needs.release.outputs.version }}"
          else
            # No release cut (manual dispatch, or a push with only chore/docs
            # commits) — reuse the latest existing tag so components still get a
            # concrete SemVer tag.
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing OCI artifacts with tag: ${VERSION}"

          # The whole-repo artifact is what a cluster pins as ONE immutable
          # version, so only push it when VERSION is a real release of this
          # commit -- or on an explicit push-all backfill. A chore/docs-only
          # push reuses the previous tag above; re-pushing repo:<that tag>
          # would silently change what an already-pinned cluster pulls.
          if [ "${{ needs.release.outputs.published }}" = "true" ] \
             || { [ "${{ github.event_name }}" = "workflow_dispatch" ] \
                  && [ "${{ inputs.push-all }}" = "true" ]; }; then
            echo "repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo=false" >> "$GITHUB_OUTPUT"
            echo "No release cut: skipping the whole-repo artifact"
          fi

      - id: changed
        name: Compute components to push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.push-all }}" = "true" ]; then
            # Backfill: every apps/*, infra/* and cicd/* component directory.
            components=$(
              find apps infra cicd -mindepth 1 -maxdepth 1 -type d \
                | sort -u \
                | jq -R -s -c 'split("\n") | map(select(length>0))'
            )
            echo "Mode: backfill (all components)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # Initial push / new branch: diff against the empty tree
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              base=$(git hash-object -t tree /dev/null)
            fi
            # `git diff --name-only` lists deleted files too, so removing a
            # component would otherwise put it on the push matrix and fail the
            # job on `flux push artifact --path=./<gone>`. Keep only the
            # directories that still exist at HEAD.
            components=$(
              git diff --name-only "$base" "$head" \
                | grep -E '^(apps|infra|cicd)/[^/]+/' \
                | sed -E 's#^((apps|infra|cicd)/[^/]+)/.*#\1#' \
                | sort -u \
                | while read -r dir; do
                    if [ -d "$dir" ]; then printf '%s\n' "$dir"; fi
                  done \
                | jq -R -s -c 'split("\n") | map(select(length>0))'
            )
            echo "Mode: changed-only"
          fi
          echo "components=${components}" >> "$GITHUB_OUTPUT"
          echo "Components to push:"
          echo "${components}" | jq -r '.[]'

  push:
    # NB: keep this a static string — referencing ${{ matrix.component }} in a
    # job-level name fails at startup when the matrix is derived from `needs`
    # (the graph is built before `needs` resolves). GitHub already appends the
    # matrix value to each job's display name.
    name: push OCI artifact
    needs: plan
    # !cancelled() is required: on manual dispatch the skipped `release` job
    # propagates a skip through `plan` to this job under the default success()
    # gate. Explicitly gate on plan succeeding + a non-empty component list.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.components != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push OCI artifacts to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.plan.outputs.components) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI artifact
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ARTIFACT="oci://ghcr.io/${{ github.repository }}/${{ matrix.component }}"

          flux push artifact "${ARTIFACT}:${VERSION}" \
            --path="./${{ matrix.component }}" \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${VERSION}@sha1:${{ github.sha }}"

          # Move the rolling `latest` tag to this build
          flux tag artifact "${ARTIFACT}:${VERSION}" --tag=latest

          {
            echo "## OCI artifact pushed"
            echo ""
            echo "- \`${ARTIFACT}:${VERSION}\`"
            echo "- \`${ARTIFACT}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  push-repo:
    name: push repo OCI artifact
    needs: plan
    # Independent of the component matrix: a release that touches only hack/
    # or the repo root still gets a repo artifact. !cancelled() for the same
    # reason as `push` -- on manual dispatch the skipped `release` would
    # otherwise propagate a skip through `plan` to this job.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.version != '' && needs.plan.outputs.repo == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push OCI artifacts to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bundles (infra|apps|cicd/platform) render child Kustomizations
      # whose paths start at the repo root (./infra/cert-manager/...) and
      # cross layers (infra-platform -> ./apps/cnpg-operator), so no single
      # component artifact can serve them. `repo` cannot collide with a
      # component: those are always <apps|infra|cicd>/<name>.
      #
      # --ignore-paths REPLACES flux's default list, so the VCS entries are
      # repeated here. Leading `/` anchors a pattern to the repo root, so a
      # component folder that happens to be called docs/ or tests/ is kept.
      # Nothing under apps/, infra/ or cicd/ is dropped except *.md, which no
      # kustomization reads.
      - name: Push repo OCI artifact
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ARTIFACT="oci://ghcr.io/${{ github.repository }}/repo"

          flux push artifact "${ARTIFACT}:${VERSION}" \
            --path=. \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${VERSION}@sha1:${{ github.sha }}" \
            --ignore-paths=".git,.gitignore,.gitmodules,.gitattributes,/.github/,/.claude/,/docs/,/tests/,/hack/,/memory/,*.md"

          # Move the rolling `latest` tag to this build
          flux tag artifact "${ARTIFACT}:${VERSION}" --tag=latest

          {
            echo "## Repo OCI artifact pushed"
            echo ""
            echo "- \`${ARTIFACT}:${VERSION}\`"
            echo "- \`${ARTIFACT}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
