---
# Pre-merge gate for the Renovate wiring.
#
# Both failure modes this guards against are silent: a HelmRelease whose chart
# version carries no "# renovate:" annotation is skipped by Renovate without a
# warning and simply never updates, and a substituted image tag that does not
# exist in its registry only fails once a cluster tries to pull it.
#
# The checks are invoked as scripts rather than through `task`, on purpose: the
# Taskfile includes a remote Taskfile, which task refuses to load unattended
# ("not trusted by user") unless passed --yes — and --yes would mean trusting a
# Taskfile fetched over the network on every CI run. The scripts under hack/ are
# what the task targets call anyway, so both paths run identical code.
#
# Deliberately not run here: `task preview-renovate`, a full Renovate run taking
# minutes. Use it locally when changing renovate.json.
name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annotations:
    name: Chart version annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every substituted chart version is annotated
        run: ./hack/check-chart-annotations.sh

  image-tags:
    name: Image tags resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Queries ghcr.io and docker.io tag listings. Repositories that cannot be
      # read are reported separately and do not fail the job, so a private or
      # renamed package is never mistaken for a broken tag.
      - name: Every substituted image tag exists
        run: python3 hack/verify-image-tags.py

  bundle-components:
    name: Bundle components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Every component is buildable and the bundle composes
        run: ./hack/check-bundle-components.sh
      - name: Every postBuild.substitute value is a string
        run: |
          pip install --quiet pyyaml
          python3 ./hack/check-substitute-strings.py
      # Needs kustomize, installed above: it compares against the RENDERED
      # target so a default reached through a component or a base counts.
      - name: Every pass-through default matches the path it threads into
        run: python3 ./hack/check-passthrough-defaults.py
      # Reads no registry and renders nothing -- it only compares two
      # Kustomizations that already exist, so it is cheap and belongs before
      # anything that installs a tool.
      - name: Kustomizations rendering one path are wired the same way
        run: python3 ./hack/check-shared-path-wiring.py
      # kcl, because the machinery profile is GENERATED from a KCL catalog
      # published as an OCI module -- the same one ManagementPlane reads. The
      # check re-renders it and compares; without kcl it reports itself
      # unverified rather than failing, like skopeo below.
      - name: Install KCL
        run: |
          curl -sSL https://kcl-lang.io/script/install-cli.sh | /bin/bash
          kcl --version
      - name: The machinery profile matches the catalog it is generated from
        run: python3 ./hack/gen-crossplane-profile.py --check
      # skopeo, because the crossplane packages' dependsOn lives inside the OCI
      # artifact and the xpkg registries do not answer the anonymous manifest
      # request verify-image-tags.py knows how to make. Without it the check
      # reports itself unverifiable rather than failing.
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: No duplicate or cross-registry crossplane package node
        run: python3 ./hack/check-crossplane-deps.py

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # renovate declares engines.node ^24.11.0; an older runtime happens to work
      # for the validator today but is not something to rely on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # npx rather than the renovate/renovate image the lint-renovate task uses:
      # several GB of pull for a single validation is not worth it in CI.
      # Validating against @latest is intentional — that is what Mend Cloud runs.
      - name: Validate renovate.json
        run: npx --yes --package renovate@latest renovate-config-validator renovate.json
